# A runner whose sshd allows agent forwarding (the image's 10-fleet.conf says no). Mounted as
# /etc/ssh/sshd_config.d/05-link.conf, read before it (sshd keeps the first value). The hub's transport rows
# (runtime/crates/drgnx-ratatoskr/tests/fleet_link.rs) need it to show the hub never forwards an agent anyway.
AllowAgentForwarding yes
