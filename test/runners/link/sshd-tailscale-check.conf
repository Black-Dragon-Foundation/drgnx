# A runner that answers every session with Tailscale SSH's "additional check" banner and no command, as a host that
# wants a fresh login does. Mounted as /etc/ssh/sshd_config.d/05-link.conf; used by the transport's banner row
# (runtime/crates/drgnx-ratatoskr/tests/fleet_link.rs).
ForceCommand printf '%s\n' '# Tailscale SSH requires an additional check.' '# To authenticate, visit: https://login.example.invalid/a/0123abcd' >&2; exit 1
