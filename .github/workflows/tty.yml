# Nightly and on demand: the terminal test tier — Emacs in tmux sessions, on Fedora 45
# (Emacs 31.1), in test/container/Containerfile.tty. docs/develop/ci.md
name: Terminal tier

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tty:
    name: Terminal tests (Fedora ${{ matrix.fedora }}, tmux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        fedora: [45]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prebuilt image for this Containerfile (else the tier builds it)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/black-dragon-foundation/drgnx-test-tty:$(sha256sum test/container/Containerfile.tty | cut -c1-16)"
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin || true
          if podman pull -q "$image"; then echo "DRGNX_TEST_TTY_IMAGE=$image" >> "$GITHUB_ENV"; else echo "no $image yet: building"; fi
      - name: Terminal tier in test/container/Containerfile.tty
        env:
          DRGNX_CONTAINER: podman
        run: bin/drgnx test --container --tty --fedora ${{ matrix.fedora }}
