# Every push to main or a ci/* branch and every pull request: the Rust workspace (runtime.yml, called as the `runtime`
# job), shellcheck, and the leak scan. The `gate` job ("CI gate") is the check branch protection requires. A pull
# request or a ci/* push runs only the jobs its change can affect (the `changes` job, .github/ci/paths.txt); a manual
# run can name jobs, and its gate is then "CI gate (partial)". docs/develop/ci.md
name: CI

on:
  # main only (2026-11-22): a push to a PR's branch ran this workflow twice, push and pull_request, on the same commit.
  # ci/* diagnostics run through workflow_dispatch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: Minutes of fuzzing per target (default 10)
        type: string
        default: "10"
      jobs:
        description: "Narrowed: the jobs to run, ids from .github/ci/paths.txt (rt-linux ... rt-macos); empty: all"
        type: string
        default: ""

permissions:
  contents: read

# a newer push to the same ci/* branch (or pull request) cancels the older run; a run on main is never cancelled
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # What the change can affect (.github/ci/changes.sh over .github/ci/paths.txt). Anything uncertain runs everything;
  # the jobs below run unless it said they need not, so they run if it failed (and the gate fails).
  changes:
    name: What the change can affect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      runtime: ${{ steps.c.outputs.runtime }}
      partial: ${{ steps.c.outputs.partial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: .github/ci
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GATE: CI gate
          PUSH: rt-linux rt-msrv rt-escape rt-containers rt-android rt-deny rt-fuzz rt-macos
          CAN: rt-linux rt-msrv rt-escape rt-containers rt-android rt-deny rt-fuzz rt-macos
          REQUEST: ${{ inputs.jobs }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/changes.sh .github/ci/paths.txt | tee -a "$GITHUB_OUTPUT"
      # main moves to a pull request's head by fast-forward, so the head (never GitHub's merge commit) is what runs, and
      # it must descend from main's tip: a failed changes job fails the gate
      - name: The pull request's head descends from the default branch's tip
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$REPO/branches/$DEFAULT_BRANCH" --jq .commit.sha)
          status=$(gh api "repos/$REPO/compare/$tip...$HEAD_SHA" --jq .status)
          case "$status" in
            ahead|identical) echo "$HEAD_SHA descends from $DEFAULT_BRANCH's tip $tip" ;;
            *) echo "::error::$HEAD_SHA does not descend from $DEFAULT_BRANCH's tip $tip ($status): merge or rebase onto it, so $DEFAULT_BRANCH can fast-forward"; exit 1 ;;
          esac

  # The prebuilt images of this checkout's inputs (images.yml), each missing tag built and pushed once, before the jobs
  # that pull them (docs/develop/ci.md, "Prebuilt images"). This repository's own pushes and pull requests only: a
  # fork's token cannot push, so its jobs build their own (the gate lets this one be skipped there).
  images:
    name: Test images
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml

  # Ratatoskr's CI (a `needs:` cannot reach a job of another workflow file, so the call is the job). It waits for the
  # images (its Fedora 45 job's and the escape legs' bubblewrap), and runs whatever they did.
  runtime:
    name: Runtime
    needs: [changes, images]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime != '') }}
    permissions:
      contents: read
      packages: read      # its prebuilt images (images.yml)
    uses: ./.github/workflows/runtime.yml
    with:
      fuzz_minutes: ${{ inputs.fuzz_minutes }}
      only: ${{ needs.changes.outputs.runtime }}

  scripts:
    name: Shell scripts and leak scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=warning .githooks/pre-commit test/container/nidhogg.sh test/container/zig.sh .github/ci/changes.sh .github/ci/cargo-prune.sh .github/ci/commit-times.sh .github/ci/ghcr.sh .github/ci/bwrap/build.sh .github/ci/browser-vm.sh test/container/image-tag.sh test/container/image.sh test/container/rust-packages.sh .github/ci/run-checks.sh .github/ci/runtime-skips.sh .github/ci/gate-needs.sh
      - name: The path filter's rules and table (changes.sh --self-test)
        if: ${{ !cancelled() }}
        run: bash .github/ci/changes.sh .github/ci/paths.txt --self-test
      - name: The run checks against their fixtures (run-checks.sh --self-test)
        if: ${{ !cancelled() }}
        run: bash .github/ci/run-checks.sh --self-test
      - name: The runtime gate's allowed skips (runtime-skips.sh --self-test)
        if: ${{ !cancelled() }}
        run: bash .github/ci/runtime-skips.sh --self-test
      - name: The runtime gate's needs and the job table (gate-needs.sh --self-test, --check)
        if: ${{ !cancelled() }}
        run: |
          bash .github/ci/gate-needs.sh --self-test
          bash .github/ci/gate-needs.sh --check .github/workflows/runtime.yml .github/ci/runtime-jobs.txt
      - name: Leak scan (the pre-commit hook's patterns over every tracked file)
        if: ${{ !cancelled() }}
        run: .githooks/pre-commit --all

  # The one check branch protection requires of this workflow: every job above succeeded, or was skipped because the
  # change cannot affect it (the changes job's outputs), or is the images job on a fork's pull request. It always runs,
  # and a failed, cancelled or other skipped job fails it. A narrowed run's is "CI gate (partial)", and main's push,
  # which only builds and saves the caches (main moves only to a head whose pull request run passed), is
  # "CI gate (cache run)": no rule requires either (docs/develop/ci.md, "Gates").
  gate:
    name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'CI gate (cache run)' || (needs.changes.outputs.partial == 'true' && 'CI gate (partial)' || 'CI gate') }}
    if: always()
    needs: [changes, images, runtime, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/gate
        with:
          needs: ${{ toJSON(needs) }}
          allow-skipped: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'images' || '' }}
            ${{ needs.changes.result == 'success' && needs.changes.outputs.runtime == '' && 'runtime' || '' }}
