# Every push to main or a ci/* branch and every pull request: the Rust runtime (runtime.yml, called as the `runtime`
# job), the unit suite in plain and gate mode (formatting, byte-compile with no warnings and the lints are tests in it)
# on the pinned Nidhogg (drgnx-tiers.yml), shellcheck, and the leak scan. The `gate` job ("CI gate") is the check
# branch protection requires. On a joint round's branch (ci/joint/*) the tiers run in Nidhogg's run on its new build
# instead, so they are skipped here and the gate allows exactly that. docs/develop/ci.md
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: Minutes of fuzzing per target (default 10)
        type: string
        default: "10"

permissions:
  contents: read

# a newer push to the same ci/* branch (or pull request) cancels the older run; a run on main is never cancelled
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Ratatoskr's CI (a `needs:` cannot reach a job of another workflow file, so the call is the job)
  runtime:
    name: Runtime
    permissions:
      contents: read
    uses: ./.github/workflows/runtime.yml
    with:
      fuzz_minutes: ${{ inputs.fuzz_minutes }}

  # No `needs:`: the tiers build the Ratatoskr their tests use, so a red runtime job never skips or starves them (a
  # `needs:` on the runtime job skipped this suite on three pushes in a row and failed it for a missing artifact on a fourth).
  tiers:
    name: Tiers
    if: ${{ !startsWith(github.ref, 'refs/heads/ci/joint/') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/drgnx-tiers.yml
    with:
      nidhogg: release
      tiers: unit no-lisp-writes

  scripts:
    name: Shell scripts and leak scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=warning install.sh bin/drgnx .githooks/pre-commit test/container/nidhogg.sh
      - name: Leak scan (the pre-commit hook's patterns over every tracked file)
        if: ${{ !cancelled() }}
        run: .githooks/pre-commit --all

  # The one check branch protection requires of this workflow: every job above succeeded (the tiers may be skipped on
  # a joint round's branch only). It always runs, and a failed, cancelled or other skipped job fails it
  # (docs/develop/ci.md, "Gates").
  gate:
    name: CI gate
    if: always()
    needs: [runtime, tiers, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/gate
        with:
          needs: ${{ toJSON(needs) }}
          allow-skipped: ${{ startsWith(github.ref, 'refs/heads/ci/joint/') && 'tiers' || '' }}
