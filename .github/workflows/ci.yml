# Every push to main and every pull request: the unit suite (formatting, byte-compile with no warnings
# and the lints are tests in it) on Emacs 31.1, shellcheck, and the leak scan.
# docs/develop/ci.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emacs-31:
    name: Emacs 31.1 (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prebuilt image for this Containerfile (else the suite builds it)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/black-dragon-foundation/drgnx-test:$(sha256sum test/container/Containerfile | cut -c1-16)"
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin || true
          if podman pull -q "$image"; then echo "DRGNX_TEST_IMAGE=$image" >> "$GITHUB_ENV"; else echo "no $image yet: building"; fi
      # the files a core each at once, then the :timing tests alone (docs/develop/ci.md, "Parallel files")
      - name: Unit suite in test/container/Containerfile, the files in parallel (all but the :timing tests)
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_SELECTOR: "(not (tag :timing))"
        run: DRGNX_TEST_JOBS="$(nproc)" bin/drgnx test --container
      - name: The :timing tests, a file at a time
        if: ${{ !cancelled() }}
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_SELECTOR: "(tag :timing)"
        run: bin/drgnx test --container

  scripts:
    name: Shell scripts and leak scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=warning install.sh bin/drgnx .githooks/pre-commit
      - name: Leak scan (the pre-commit hook's patterns over every tracked file)
        run: .githooks/pre-commit --all
