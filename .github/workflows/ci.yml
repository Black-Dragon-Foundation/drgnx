# Every push to main and every pull request: the Rust runtime (runtime.yml, called as the `runtime` job), the unit suite
# (formatting, byte-compile with no warnings and the lints are tests in it) on Emacs 31.1 against the `ratatoskr` that
# runtime.yml built in the same run, shellcheck, and the leak scan.
# docs/develop/ci.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: Minutes of fuzzing per target (default 10)
        type: string
        default: "10"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ratatoskr's CI (a `needs:` cannot reach a job of another workflow file, so the call is the job)
  runtime:
    name: Runtime
    permissions:
      contents: read
    uses: ./.github/workflows/runtime.yml
    with:
      fuzz_minutes: ${{ inputs.fuzz_minutes }}

  # It needs only the `ratatoskr` artifact of runtime.yml's Linux job, so it runs whatever runtime's other jobs say
  # (a red macOS escape row must not skip the editor's tests: gate review B1). If the Linux job never uploaded the
  # artifact, the download below fails this job, so it never runs against a missing binary.
  emacs-31:
    name: Nidhogg 31.1 (Fedora 45)
    needs: runtime
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the test-hooks ratatoskr runtime.yml built (Fedora 45, like the image below); the client's tests run against it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ratatoskr
          path: ${{ runner.temp }}/ratatoskr
      - name: DRGNX_RATATOSKR_BIN
        run: |
          chmod +x "$RUNNER_TEMP/ratatoskr/ratatoskr"
          echo "DRGNX_RATATOSKR_BIN=$RUNNER_TEMP/ratatoskr/ratatoskr" >> "$GITHUB_ENV"
      # huginn's dump example (runtime.yml's Linux job): drgnx-huginn/differential-fresh-seed reads a fresh seed of random
      # data with it and with Emacs's reader, and the dumps must agree (it must run, test/no-skip.eld)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huginn-dump
          path: ${{ runner.temp }}/huginn-dump
      - name: DRGNX_HUGINN_DUMP
        run: |
          chmod +x "$RUNNER_TEMP/huginn-dump/dump"
          echo "DRGNX_HUGINN_DUMP=$RUNNER_TEMP/huginn-dump/dump" >> "$GITHUB_ENV"
      - name: Prebuilt image for this Containerfile (else the suite builds it)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/black-dragon-foundation/drgnx-test:$(sha256sum test/container/Containerfile | cut -c1-16)"
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin || true
          if podman pull -q "$image"; then echo "DRGNX_TEST_IMAGE=$image" >> "$GITHUB_ENV"; else echo "no $image yet: building"; fi
      # the files a core each at once, a failed file rerun once, the :timing tests left out by name (docs/develop/ci.md)
      - name: Unit suite in test/container/Containerfile, the files in parallel (no :timing tests)
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_RERUN: "1"
          DRGNX_TEST_NO_TIMING: "1"
        run: DRGNX_TEST_JOBS="$(nproc)" bin/drgnx test --container

  scripts:
    name: Shell scripts and leak scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=warning install.sh bin/drgnx .githooks/pre-commit
      - name: Leak scan (the pre-commit hook's patterns over every tracked file)
        run: .githooks/pre-commit --all
