# Every push to main and every pull request: the unit suite (formatting, byte-compile with no warnings
# and the lints are tests in it) on Emacs 31.1 and 30.2, shellcheck, and the leak scan.
# docs/develop/ci.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emacs-31:
    name: Emacs 31.1 (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prebuilt image for this Containerfile (else the suite builds it)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/black-dragon-foundation/drgnx-test:$(sha256sum test/container/Containerfile | cut -c1-16)"
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin || true
          if podman pull -q "$image"; then echo "DRGNX_TEST_IMAGE=$image" >> "$GITHUB_ENV"; else echo "no $image yet: building"; fi
      - name: Unit suite in test/container/Containerfile
        env:
          DRGNX_CONTAINER: podman
        run: bin/drgnx test --container

  emacs-30:
    name: Emacs 30.2 (Ubuntu 26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: docker.io/library/ubuntu:26.04
    steps:
      - name: Emacs, git, curl (the AI client) and zsh (the shell-file and completion tests; bash is there)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends emacs-nox git ca-certificates curl zsh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the job runs as root on a workspace the runner's user owns: git refuses it ("dubious ownership") once
      # checkout's temporary setting is gone; system-wide, because the tests run git with a HOME of their own
      - name: The checkout is a safe directory for git
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - run: emacs --version | head -1
      - name: Unit suite
        run: bin/drgnx test

  scripts:
    name: Shell scripts and leak scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=warning install.sh bin/drgnx .githooks/pre-commit
      - name: Leak scan (the pre-commit hook's patterns over every tracked file)
        run: .githooks/pre-commit --all
