# Every push to main or a ci/* branch, nightly and on demand: the GUI, live, scenario and perf tiers — real Nidhogg
# sessions under headless mutter, in test/container/Containerfile.gui (drgnx-tiers.yml, on the pinned release). Not on a
# joint round's branch (ci/joint/*): Nidhogg's run tests the GUI tier on its new build. The `gate` job ("GUI tier gate")
# is the check branch protection requires. docs/develop/ci.md
name: GUI tier

on:
  push:
    branches: [main, "ci/**", "!ci/joint/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a ci/* branch cancels the older run; a run on main (push or nightly) is never cancelled
concurrency:
  group: gui-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tiers:
    name: Tiers
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/drgnx-tiers.yml
    with:
      nidhogg: release
      tiers: ui scenario perf

  # The one check branch protection requires of this workflow: the three tiers succeeded. It always runs, and a
  # failed, cancelled or skipped job fails it (docs/develop/ci.md, "Gates").
  gate:
    name: GUI tier gate
    if: always()
    needs: [tiers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/gate
        with:
          needs: ${{ toJSON(needs) }}
