# The design system site (docs/design/), built with Emacs alone (bin/drgnx design --site) and published to GitHub Pages.
# Every run builds the site and checks that the generated pages are current; only a run on main deploys it, so a branch
# or a pull request shows its build without publishing. docs/develop/design-system.md
name: Design system site

on:
  push:
    branches: [main]
    paths:
      - "docs/design/**"
      - "harness/drgnx-design*.el"
      - "themes/**"
      - "core/drgnx-type-faces.el"
      - "modules/ui/drgnx-look-density.el"
      - "etc/icons/**"
      - ".github/workflows/design-pages.yml"
  pull_request:
    paths:
      - "docs/design/**"
      - "harness/drgnx-design*.el"
      - "themes/**"
      - "core/drgnx-type-faces.el"
      - "modules/ui/drgnx-look-density.el"
      - "etc/icons/**"
      - ".github/workflows/design-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    container: fedora:45          # Emacs 31.1, the baseline
    steps:
      - name: Emacs and git
        run: dnf -y -q install emacs-nox git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The generated pages are current
        env:
          DRGNX_EMACS: emacs
        run: bin/drgnx design --check
      - name: Build the site
        env:
          DRGNX_EMACS: emacs
        run: bin/drgnx design --site "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
