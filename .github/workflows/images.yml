# The prebuilt CI images, so jobs pull them instead of installing packages every run: the three test images
# (test/container/Containerfile{,.gui,.tty}), each built on a base of only the Fedora packages published first
# (drgnx-base-{test,gui,tty}, test/container/base/), the Rust job's (Containerfile.rust) and bubblewrap for the escape suite's
# runner jobs (.github/ci/bwrap, one per architecture). Each is tagged with test/container/image-tag.sh: a hash of the
# Containerfile and every file it copies. CI looks the tag of its checkout up (.github/ci/ghcr.sh ref) and pulls that
# digest, else builds the image itself. ci.yml and gui.yml call this first (their `images` job, which the jobs on
# images wait for) on every push and every pull request of this repository, so a round whose inputs changed builds
# each missing tag once and every job of it pulls them; a fork's pull request never calls it (its token cannot push)
# and its jobs build their own image and push nothing. A call or a manual run builds only the tags GHCR lacks; the
# weekly run of this workflow itself rebuilds every one, so distribution updates arrive (each job pins the digest it
# looked up). docs/develop/ci.md
name: Test images

on:
  workflow_call:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# one run at a time per calling workflow and ref, none cancelled (a group shared by ci.yml's and gui.yml's calls would
# cancel a waiting one)
concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The bases of the three test images (test/container/base/): only the Fedora packages, so a change to nidhogg.sh or
  # the child-frame pins rebuilds none of them. The images below build FROM the one of their checkout's base tag.
  bases:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: drgnx-base-test
            file: test/container/base/Containerfile
          - name: drgnx-base-gui
            file: test/container/base/Containerfile.gui
          - name: drgnx-base-tty
            file: test/container/base/Containerfile.tty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and push ghcr.io/black-dragon-foundation/${{ matrix.name }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          NAME: ${{ matrix.name }}
          FILE: ${{ matrix.file }}
          # the weekly rebuild is this workflow's own schedule, not a caller's nightly
          REBUILD: ${{ github.workflow == 'Test images' && github.event_name == 'schedule' }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          image="ghcr.io/black-dragon-foundation/$NAME"
          tag="$(bash test/container/image-tag.sh "$FILE")"
          if [ "$REBUILD" != true ] && [ -n "$(bash .github/ci/ghcr.sh ref "$NAME" "$tag")" ]; then
            echo "$image:$tag is on GHCR already"; exit 0
          fi
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          podman build --pull=always --label "org.opencontainers.image.source=$SOURCE" \
            -t "$image:$tag" -f "$FILE" "$(dirname "$FILE")"
          podman push "$image:$tag"

  build:
    needs: bases
    name: ${{ matrix.name }}${{ matrix.arch && format(' ({0})', matrix.arch) || '' }}
    runs-on: ${{ matrix.runs-on || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: drgnx-test
            file: test/container/Containerfile
            base-name: drgnx-base-test
            base-file: test/container/base/Containerfile
          - name: drgnx-test-gui
            file: test/container/Containerfile.gui
            base-name: drgnx-base-gui
            base-file: test/container/base/Containerfile.gui
          - name: drgnx-test-tty
            file: test/container/Containerfile.tty
            base-name: drgnx-base-tty
            base-file: test/container/base/Containerfile.tty
          - name: drgnx-test-rust
            file: test/container/Containerfile.rust
          - name: drgnx-bwrap
            file: .github/ci/bwrap/Containerfile
            arch: x64
          - name: drgnx-bwrap
            file: .github/ci/bwrap/Containerfile
            arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and push ghcr.io/black-dragon-foundation/${{ matrix.name }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          NAME: ${{ matrix.name }}
          FILE: ${{ matrix.file }}
          BASE_NAME: ${{ matrix.base-name }}
          BASE_FILE: ${{ matrix.base-file }}
          ARCH: ${{ matrix.arch }}
          REBUILD: ${{ github.workflow == 'Test images' && github.event_name == 'schedule' }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          image="ghcr.io/black-dragon-foundation/$NAME"
          tag="$(bash test/container/image-tag.sh "$FILE")${ARCH:+-$ARCH}"
          case "$NAME" in drgnx-test|drgnx-test-gui|drgnx-test-tty) moving=$REF ;; *) moving= ;; esac
          if [ "$REBUILD" != true ] && have="$(bash .github/ci/ghcr.sh ref "$NAME" "$tag")" && [ -n "$have" ]; then
            echo "$image:$tag is on GHCR already"
            # main still moves `f45` to it (a pull request's round built it before main fast-forwarded there)
            if [ "$moving" = refs/heads/main ]; then
              printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
              podman pull -q "$have" >/dev/null; podman tag "$have" "$image:f45"; podman push "$image:f45"
            fi
            exit 0
          fi
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          # an image on a base builds FROM the base GHCR holds for this checkout's base tag (the `bases` job pushed it)
          base_args=()
          if [ -n "$BASE_NAME" ]; then
            base="ghcr.io/black-dragon-foundation/$BASE_NAME:$(bash test/container/image-tag.sh "$BASE_FILE")"
            podman pull -q "$base" >/dev/null
            base_args=(--build-arg "BASE=$base")
          fi
          podman build --pull=always --label "org.opencontainers.image.source=$SOURCE" ${base_args[@]+"${base_args[@]}"} \
            -t "$image:$tag" -f "$FILE" "$(dirname "$FILE")"
          podman push "$image:$tag"
          # the moving name of the test images, for a local `DRGNX_TEST_IMAGE=…:f45` (main only)
          if [ "$moving" = refs/heads/main ]; then podman tag "$image:$tag" "$image:f45"; podman push "$image:f45"; fi
