# The test images, prebuilt so CI pulls them instead of installing packages every run: built from
# test/container/Containerfile{,.gui,.tty} and tagged with the Containerfile's hash (CI pulls the tag of the
# Containerfile it checked out, else builds it itself). Weekly too, so distribution updates arrive. A push to a ci/*
# branch publishes only the hash tag (a Containerfile not on main never moves `f45`). No gate: it makes a cache, not a
# verdict (a job without its image builds it), and its paths filter means most pushes never run it.
# docs/develop/ci.md
name: Test images

on:
  push:
    branches: [main, "ci/**"]
    paths: ["test/container/**", ".github/workflows/images.yml"]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# one run at a time per ref (a ci/* run never queues behind or replaces main's), none cancelled
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: drgnx-test
            file: Containerfile
          - name: drgnx-test-gui
            file: Containerfile.gui
          - name: drgnx-test-tty
            file: Containerfile.tty
            args: --build-arg FEDORA=45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push ghcr.io/black-dragon-foundation/${{ matrix.name }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          NAME: ${{ matrix.name }}
          FILE: ${{ matrix.file }}
          BUILD_ARGS: ${{ matrix.args }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          image="ghcr.io/black-dragon-foundation/$NAME"
          tag="$(sha256sum "test/container/$FILE" | cut -c1-16)"
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          # shellcheck disable=SC2086
          podman build --pull=always $BUILD_ARGS --label "org.opencontainers.image.source=$SOURCE" \
            -t "$image:$tag" -t "$image:f45" -f "test/container/$FILE" test/container
          podman push "$image:$tag"
          if [ "$REF" = refs/heads/main ]; then podman push "$image:f45"; fi
