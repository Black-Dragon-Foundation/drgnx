# macOS 27 (Apple silicon; GitHub names its image after its Xcode: xcode-27). Every push to main and every pull
# request: the unit suite and the install plan, with Nidhogg's release tarball and macOS's own bash 3.2. Weekly and on demand: a real install.sh --yes, then the
# first sync from the shipped lock, the app bundle and a headless start. The GUI tier stays Linux-only.
# docs/develop/ci.md
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name }}-${{ github.ref }}   # a push never cancels the weekly install
  cancel-in-progress: true

jobs:
  unit:
    name: Unit suite and install plan (macOS 27)
    if: github.event_name != 'schedule'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ripgrep (Homebrew)
        run: brew install ripgrep
      - name: install.sh parses under macOS's bash 3.2
        run: /bin/bash -n install.sh
      - name: install.sh prints the macOS plan and changes nothing
        run: /bin/bash install.sh --dry-run
      - name: Nidhogg (the release tarball) for the suite
        run: /bin/bash test/container/nidhogg.sh macos
      # the files a core each at once, a failed file rerun once, the :timing tests left out by name (docs/develop/ci.md)
      - name: Unit suite, the files in parallel (no :timing tests)
        env:
          DRGNX_TEST_RERUN: "1"
          DRGNX_TEST_NO_TIMING: "1"
        run: DRGNX_TEST_JOBS="$(sysctl -n hw.ncpu)" bin/drgnx test

  install:
    name: Real install (macOS 27)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh --yes on this checkout (Homebrew's emacs-plus, the command in ~/.local/bin, the app)
        env:
          DRGNX_INSTALL_TTY: none   # no terminal on a runner: the installer must not try to open the app
        run: /bin/bash install.sh --yes --source-dir "$GITHUB_WORKSPACE"
      - name: Put the drgnx command on the PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: drgnx doctor
        run: drgnx doctor
      - name: drgnx sync (a first sync, from the shipped lock)
        run: drgnx sync
      - name: drgnx macos-app
        run: |
          drgnx macos-app
          test -d "$HOME/Applications/drgnx.app"
      - name: drgnx open --check (a headless start)
        run: drgnx open --check
