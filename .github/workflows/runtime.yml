# The Rust runtime (runtime/), Ratatoskr: on Linux (Fedora 45) and macOS 27 the unit tests, the conformance suite
# against the built binary (every row, the v0 rows through the front too), a release build and the recorded perf
# baseline; plus the oldest supported compiler (MSRV 1.95), the supply-chain policy and the fuzz targets.
#
# Push (main, ci/*) and pull-request runs come from ci.yml, which calls this file (`workflow_call`), so these jobs are
# part of ci.yml's `CI gate`. Running this file on push as well would build everything twice, so its own triggers are
# the daily run (deny, and the fuzz targets for 10 minutes each) and a manual one (`fuzz_minutes` per target).
# Nothing stops early: `cargo test --no-fail-fast`, and each independent step runs whatever the steps before it said
# (`!cancelled()`; a step that needs a build waits only for that build's outcome). docs/develop/ci.md,
# docs/develop/runtime.md
name: Runtime

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: Minutes of fuzzing per target (default 10)
        type: string
        default: "10"
      only:
        description: "Narrowed: the jobs to run, of rt-linux rt-msrv rt-escape rt-containers rt-fleet rt-android rt-deny rt-fuzz rt-macos (empty: all)"
        type: string
        default: ""
  workflow_call:
    inputs:
      fuzz_minutes:
        description: Minutes of fuzzing per target (empty means 1 minute on a push to main, none on a pull request)
        type: string
        default: ""
      only:
        description: "The jobs to run (ci.yml's path filter, .github/ci/paths.txt), as above; empty: all"
        type: string
        default: ""

permissions:
  contents: read

# a push never cancels the daily policy run; a newer push to a ci/* branch cancels the older run, one on main never
concurrency:
  group: runtime-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The cargo caches (docs/develop/ci.md, "What is cached"): keyed by the job, the toolchain and the hash of Cargo.lock
# and the manifests, restored from the newest entry of the same job and toolchain when the lock moved (cargo rebuilds
# whatever is stale); saved at the end of a job whose build passed, after .github/ci/cargo-prune.sh dropped what every
# run rebuilds. Saved by main's runs (CACHE_SAVE), which come first. A pull request from a branch of this repository
# saves only the two families that pay off, `linux` and `macos` (CACHE_SAVE_PR; GitHub scopes its cache to the pull
# request's merge ref: main never restores it); the other jobs restore main's and rebuild only what changed. ci/*
# branches and a fork's pull requests only restore. No incremental data: CI never reuses it. Each entry carries the commit it was built from (runtime/target/.drgnx-built-from): after the
# restore, .github/ci/commit-times.sh gives each tracked file its last commit's time and leaves what changed since
# then new, so cargo rebuilds only that (a checkout's files all carry its time); the checkouts fetch the whole history
# for it (fetch-depth 0, no old file contents). `mt1` in the keys: the entries that carry that commit.
# Line tables only, not full debug info: backtraces keep their file and line, and the kept build (the local crates'
# artifacts too) halves (the linux job's test build: 5.3 GB on disk, 1.1 GB compressed, against 2.6 GB and 0.6 GB),
# so main's entries stay well inside the repository's 10 GB with room for a branch's.
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CACHE_SAVE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  CACHE_SAVE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  # The Fedora 45 job's prebuilt container (`Test images`, images.yml: test/container/Containerfile.rust), by digest: a
  # job's container is named before its steps run, so this job looks it up, by the tag of this checkout's inputs
  # (test/container/image-tag.sh). The output is empty when GHCR has no image for them (a change not yet on main), and
  # the job then installs what the image holds itself. (The escape legs look their bubblewrap up in their own step.)
  images:
    name: Prebuilt image (Fedora 45 job)
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-linux ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      rust: ${{ steps.ref.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/ci
            test/container
      - id: ref
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          rust="$(bash .github/ci/ghcr.sh ref drgnx-test-rust "$(bash test/container/image-tag.sh test/container/Containerfile.rust)")"
          echo "rust=$rust" | tee -a "$GITHUB_OUTPUT"

  linux:
    name: fmt, clippy, tests, conformance, perf (Fedora 45)
    needs: images
    if: ${{ !cancelled() && github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-linux ')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # the prebuilt image (Fedora 45 with rust-packages.sh and Nidhogg), else plain Fedora 45 and the steps install them
    container:
      image: ${{ needs.images.outputs.rust || 'registry.fedoraproject.org/fedora:45' }}
      credentials:
        username: ${{ needs.images.outputs.rust && github.actor || '' }}
        password: ${{ needs.images.outputs.rust && github.token || '' }}
      # a real PID 1 that reaps orphans: draugr's reap tests check a killed group is gone, and an unreaped zombie
      # still answers kill(-pgid, 0) (the same reason ctr.sh runs podman with --init)
      options: --init
    timeout-minutes: 45
    defaults:
      run:
        working-directory: runtime
    env:
      PREBUILT: ${{ needs.images.outputs.rust }}
    steps:
      # root in this container: the `sudo` rows (another uid on the socket) run, through setpriv
      - name: git for the checkout (in the prebuilt image already)
        if: ${{ env.PREBUILT == '' }}
        working-directory: /
        run: dnf -y install git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - name: Tools (in the prebuilt image already)
        if: ${{ env.PREBUILT == '' }}
        working-directory: ${{ github.workspace }}
        run: sh test/container/rust-packages.sh
      - id: rv
        run: echo "v=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - id: registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: cargo-${{ runner.os }}-fedora45-mt1-${{ steps.rv.outputs.v }}-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml', 'runtime/*/Cargo.toml', 'runtime/crates/*/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-fedora45-mt1-${{ steps.rv.outputs.v }}-
      - name: Each tracked file at its last commit's time (cargo rebuilds only what changed since the cache)
        working-directory: ${{ github.workspace }}
        run: bash .github/ci/commit-times.sh runtime/target/.drgnx-built-from
      - run: cargo fmt --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets --features drgnx-ratatoskr/test-hooks -- -D warnings
      # The pinned model files the tests run the built-in model from (they fail without DRGNX_TEST_MODELS), beside the
      # checkout, not in it (the tests that list a checkout would find them): one cache for Linux and macOS, kept by
      # the list's hash; models.sh checks each restored file's sum and fetches what is missing from Hugging Face at its
      # pinned revision. A same-repository pull request saves it too (950 MB a fetch).
      - id: models
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ../test-models
          key: models-${{ hashFiles('.github/ci/models.txt') }}
          enableCrossOsArchive: true
      - name: the model files (DRGNX_TEST_MODELS)
        id: models-fetch
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          bash .github/ci/models.sh ../test-models
          echo "DRGNX_TEST_MODELS=$(cd ../test-models && pwd)" >> "$GITHUB_ENV"
      - if: ${{ !cancelled() && (env.CACHE_SAVE == 'true' || env.CACHE_SAVE_PR == 'true') && steps.models.outputs.cache-hit != 'true' && steps.models-fetch.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ../test-models
          key: ${{ steps.models.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      # --no-fail-fast: every crate's failures in one run. The GPU tests run the real shaders on llvmpipe, Mesa's
      # software Vulkan driver (rust-packages.sh installs it), so they need no GPU
      - if: ${{ !cancelled() }}
        env:
          DRGNX_TEST_ADAPTER: llvmpipe
        run: cargo test --locked --no-fail-fast --workspace --features drgnx-ratatoskr/test-hooks
      # the test-hooks binary and the harness for the steps below
      # (+ gleipnir-probe and gleipnir-escape, the escape suite's two binaries: glibc builds, so the same ones run on a VM)
      - id: build
        if: ${{ !cancelled() }}
        run: cargo build --locked -p drgnx-ratatoskr -p domr -p gleipnir-escape --features drgnx-ratatoskr/test-hooks
      # gleipnir's test hooks (landlock_omit, abi_cap) must never be on in a build without --features (review M5).
      # The inverted form: the forward `cargo tree` does not show gleipnir's feature even when it is on (Task 0).
      # `shell: bash` adds pipefail (a failed `cargo tree` fails the step), and the tree must name gleipnir at all, so
      # an empty file never passes (gate review S14).
      - name: gleipnir has no test-hooks in a default ratatoskr build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo tree --locked -e features -i gleipnir -p drgnx-ratatoskr | tee "$RUNNER_TEMP/gleipnir-features.txt"
          grep -q '^gleipnir v' "$RUNNER_TEMP/gleipnir-features.txt"
          if grep -q 'gleipnir feature "test-hooks"' "$RUNNER_TEMP/gleipnir-features.txt"; then
            echo "gleipnir's test-hooks are on in a default build" >&2; exit 1
          fi
      # The gateway speaks HTTP/1.1 over rustls with the ring provider: neither h2 nor aws-lc-sys may be in any
      # target's graph (all kinds of dependencies). `cargo tree -i` prints nothing and fails when the package is not
      # in the graph, which is what we want; any output means it is.
      - name: h2 and aws-lc-sys are not in the tree
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for crate in h2 aws-lc-sys; do
            found=$(cargo tree --locked --workspace --target all -e normal,build,dev -i "$crate" 2>/dev/null || true)
            if [ -n "$found" ]; then echo "$crate is in the dependency tree:" >&2; echo "$found" >&2; exit 1; fi
          done
      # The escape suite, container tier (docs/develop/gleipnir.md, "Proving it"). As root in this container there are
      # no user namespaces to nest, so the full and reduced rows skip with a listed reason ("inside a container",
      # "Landlock ABI N below 9"); what runs is that the rows parse, the probes reach without a sandbox,
      # check-in-a-container, the floor row, path-bwrap-never-run and fail-closed-no-bwrap. Only listed reasons may skip.
      # No --require-all (a skip here is expected); the VM/host jobs below hold the rest.
      - name: escape suite (container tier)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/escape"
          target/debug/gleipnir-escape --ratatoskr target/debug/ratatoskr --probe target/debug/gleipnir-probe \
            --rows crates/gleipnir-escape/rows --rows crates/gleipnir-escape/rows/container \
            --report "$RUNNER_TEMP/escape/escape-container.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: escape-report-container
          path: ${{ runner.temp }}/escape/escape-container.json
          if-no-files-found: warn
      # the editor's own CLIs that the personal-notes canary row runs need Emacs
      - name: Nidhogg 31.1 (the Emacs drgnx ships on; in the prebuilt image already)
        id: nidhogg
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$PREBUILT" ]; then bash test/container/nidhogg.sh fedora-45; fi
          /usr/local/bin/nidhogg --version | head -n 1
      # every row against Ratatoskr. --require-all: a skipped row fails the job, except a macOS-only row here and the
      # perf rows (they run below)
      - name: conformance
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.nidhogg.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          runtime/target/debug/domr --hub-bin runtime/target/debug/ratatoskr \
            --scenarios test/conformance --require-all
      # the build install.sh makes: no test hooks in it, and it says so
      - name: release build says test_hooks false
        id: release
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --release -p drgnx-ratatoskr -p domr
          target/release/ratatoskr version --json | tee "$RUNNER_TEMP/version.json"
          grep -q '"test_hooks":false' "$RUNNER_TEMP/version.json"
      # a recorded baseline, no budgets (perf regression runs are deferred)
      - name: perf baseline
        id: perf
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          runtime/target/release/domr --hub-bin runtime/target/release/ratatoskr \
            --scenarios test/conformance --only 'perf/*' --perf perf-linux.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.perf.outcome == 'success' }}
        with:
          name: ratatoskr-perf-linux
          path: perf-linux.json
          if-no-files-found: error
      # last, whatever the tests said: a red test keeps the dependencies the build made
      - id: prune
        if: ${{ !cancelled() && (env.CACHE_SAVE == 'true' || env.CACHE_SAVE_PR == 'true') && steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          bash .github/ci/cargo-prune.sh runtime/Cargo.toml runtime/target
          # the commit it was built from, only when every step before passed: after a step that failed some outputs
          # may be older than the sources, so the commit restored stays (or none: the next run rebuilds everything)
          if [ "${{ job.status }}" = success ]; then git -c safe.directory="$PWD" rev-parse HEAD > runtime/target/.drgnx-built-from; fi
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # the registry once per lock and OS, for every job: one already there (main's, for a pull request whose lock is
      # main's) is not saved again
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' && steps.registry.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.registry.outputs.cache-primary-key }}

  msrv:
    name: MSRV 1.95 builds
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-msrv ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - id: registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: cargo-${{ runner.os }}-msrv195-mt1-1.95.0-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml', 'runtime/*/Cargo.toml', 'runtime/crates/*/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-msrv195-mt1-1.95.0-
      - name: Each tracked file at its last commit's time (cargo rebuilds only what changed since the cache)
        run: bash .github/ci/commit-times.sh runtime/target/.drgnx-built-from
      - run: rustup toolchain install 1.95.0 --profile minimal
      - id: build
        run: cargo +1.95.0 build --locked --manifest-path runtime/Cargo.toml
      - id: prune
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          bash .github/ci/cargo-prune.sh runtime/Cargo.toml runtime/target
          # the commit it was built from, only when every step before passed: after a step that failed some outputs
          # may be older than the sources, so the commit restored stays (or none: the next run rebuilds everything)
          if [ "${{ job.status }}" = success ]; then git -c safe.directory="$PWD" rev-parse HEAD > runtime/target/.drgnx-built-from; fi
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # the registry once per lock and OS, for every job: one already there (main's, for a pull request whose lock is
      # main's) is not saved again
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' && steps.registry.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.registry.outputs.cache-primary-key }}

  # The escape suite on the runner itself, no container: the full tier (bubblewrap with user namespaces) and, on the arm64
  # runner (free for public repositories), a real arm64 Linux run of the seccomp tests (GL-T4-2: the aarch64 syscall
  # numbers). Ubuntu 24.04 turns unprivileged user namespaces off through AppArmor, so the job lifts the restriction
  # with sudo (the runner user has passwordless sudo) and installs bubblewrap 0.12.0 (gleipnir's floor; apt has 0.9.0),
  # prebuilt per architecture (`Test images`) or built here.
  # It gates (green on both runners since 74be75cf; a failure here fails the CI gate: docs/develop/ci.md).
  escape-host:
    name: escape suite on the runner (${{ matrix.os }})
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-escape ')) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    # Every runner is pinned (never `ubuntu-latest`, which moves to 26.04 by 2026-11-19). The 24.04 legs lift AppArmor's
    # userns restriction with a global sysctl; the 26.04 legs do not: they test the configuration Gleipnir recommends
    # (bubblewrap 0.12.0 as /usr/bin/bwrap, which 26.04's `bwrap-userns-restrict` profile covers).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      # the prebuilt one of this architecture, looked up by the tag of this checkout's .github/ci/bwrap (its one layer,
      # by digest), else built here (build.sh, the image's own recipe: checksum verified, from source). /usr/bin:
      # Gleipnir trusts a bwrap only where root alone can change it, and the runner image makes /usr/local
      # group-writable (Gleipnir rightly refuses /usr/local/bin/bwrap)
      - name: bubblewrap 0.12.0 (prebuilt, or built from source)
        env:
          ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          REF="$(bash .github/ci/ghcr.sh ref drgnx-bwrap "$(bash test/container/image-tag.sh .github/ci/bwrap/Containerfile)-$ARCH")"
          if [ -n "$REF" ]; then
            bash .github/ci/ghcr.sh file "$REF" bwrap "$RUNNER_TEMP/bwrap"
          else
            sh .github/ci/bwrap/build.sh "$RUNNER_TEMP/bwrap"
          fi
          sudo install -m 0755 "$RUNNER_TEMP/bwrap/bwrap" /usr/bin/bwrap
          ls -l /usr/bin/bwrap; /usr/bin/bwrap --version
      - name: user namespaces for unprivileged processes (AppArmor's restriction lifted)
        if: ${{ !startsWith(matrix.os, 'ubuntu-26.04') }}
        run: |
          uname -r
          cat /sys/kernel/security/lsm; echo
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true
          bwrap --unshare-all --ro-bind / / true
      # 26.04, no sysctl: what the kernel and the profile say about unprivileged user namespaces, for the report
      - name: user namespaces as the image ships them
        if: ${{ startsWith(matrix.os, 'ubuntu-26.04') }}
        run: |
          uname -r
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true
          /usr/bin/bwrap --unshare-all --ro-bind / / true && echo "bwrap: user namespaces work" || echo "bwrap: refused (exit $?)"
      - run: rustup toolchain install stable --profile minimal
      # one cache for the job's builds (the escape suite's and the agent core's tests), saved at its end
      - id: rv
        run: echo "v=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - id: registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-escape-${{ matrix.os }}-mt1-${{ steps.rv.outputs.v }}-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml', 'runtime/*/Cargo.toml', 'runtime/crates/*/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-escape-${{ matrix.os }}-mt1-${{ steps.rv.outputs.v }}-
      - name: Each tracked file at its last commit's time (cargo rebuilds only what changed since the cache)
        run: bash .github/ci/commit-times.sh runtime/target/.drgnx-built-from
      # the seccomp real-install cases and everything else of the three Linux crates, on this architecture
      - run: cargo test --locked --no-fail-fast --manifest-path runtime/Cargo.toml -p gleipnir -p draugr -p eitri -p gleipnir-escape
      - id: build
        if: ${{ !cancelled() }}
        run: cargo build --locked --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr -p gleipnir-escape --features drgnx-ratatoskr/test-hooks
      # No --require-all: a Landlock ABI below 9 skips the reduced rows ("Landlock ABI N below 9"), as the harness lists.
      - name: escape suite (full tier on the runner)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/escape"
          runtime/target/debug/gleipnir-escape --ratatoskr runtime/target/debug/ratatoskr \
            --probe runtime/target/debug/gleipnir-probe \
            --rows runtime/crates/gleipnir-escape/rows/linux --rows runtime/crates/gleipnir-escape/rows/any \
            --report "$RUNNER_TEMP/escape/escape-${{ runner.arch }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: escape-report-host-${{ matrix.os }}
          path: ${{ runner.temp }}/escape/escape-${{ runner.arch }}.json
          if-no-files-found: warn
      # The agent core's sandbox lane (agent system part 1): the tests marked #[ignore] because they need the real
      # bubblewrap (exec runs in the starter's sandbox). The provider and gateway rows of tests/launch_sandboxed.rs
      # run domr's ratatoskr-mock (the mock LLM), which they find beside the ratatoskr binary: built first.
      - name: build the agent core's tests (test hooks)
        id: core-build
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --manifest-path runtime/Cargo.toml -p domr --bin ratatoskr-mock
          cargo test --locked --no-fail-fast --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr --features drgnx-ratatoskr/test-hooks --no-run
      # Landlock ABI 9 is the reduced tier's floor; on a runner kernel below it the launch rows of the reduced tier run
      # on the full tier (tests/launch_sandboxed.rs), which needs bubblewrap 0.12 only. --no-fail-fast: every test
      # binary's failures in one run. The crate's timing rows (#[ignore = "timing: …"], test/timing-rust.txt) are
      # ignored too, but they are the timing lane's: a debug build on a shared runner judges no budget, so they are skipped.
      - name: agent core, sandbox lane (--ignored)
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' }}
        run: |
          skips=$(sed 's/#.*//' test/timing-rust.txt | awk '$1 == "drgnx-ratatoskr" { printf " --skip %s", $3 }')
          cargo test --locked --no-fail-fast --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr --features drgnx-ratatoskr/test-hooks -- --ignored --test-threads 1 $skips
      # The real-start rows (docs/develop/runtime.md, "The real-start rows"): a release hub, no test hooks, so each
      # agents/start goes through the real launch, Gleipnir's validation and bwrap. --require-all: a row that cannot
      # start sandboxed fails here; the browser row is an excused skip on this runner (no Chromium, and a Landlock ABI
      # below 9), as is the internet row.
      - name: real-start rows (release hub)
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' }}
        run: |
          cargo build --locked --release --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr -p domr
          runtime/target/release/domr --hub-bin runtime/target/release/ratatoskr \
            --scenarios test/conformance --only 'real-start/*' --require-all
      # last, whatever the tests said
      - id: prune
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cache.outputs.cache-hit != 'true' && (steps.build.outcome == 'success' || steps.core-build.outcome == 'success') }}
        run: |
          bash .github/ci/cargo-prune.sh runtime/Cargo.toml runtime/target
          # the commit it was built from, only when every step before passed: after a step that failed some outputs
          # may be older than the sources, so the commit restored stays (or none: the next run rebuilds everything)
          if [ "${{ job.status }}" = success ]; then git -c safe.directory="$PWD" rev-parse HEAD > runtime/target/.drgnx-built-from; fi
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # the registry once per lock and OS, for every job: one already there (main's, for a pull request whose lock is
      # main's) is not saved again
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' && steps.registry.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.registry.outputs.cache-primary-key }}

  # The agent core's container rows (agent system part 1, Tasks 11b/11c): a container job runs only an allowed image,
  # with only its worktree mounted, inside its caps, and every escape row is refused. GitHub's Ubuntu runners ship
  # podman; the rows pull busybox (digest-pinned at run time) and skip without podman.
  agent-containers:
    name: agent core container rows (podman)
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-containers ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - run: podman --version
      - run: rustup toolchain install stable --profile minimal
      - id: rv
        run: echo "v=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - id: registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - name: cargo cache (containers)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-agent-containers-mt1-${{ steps.rv.outputs.v }}-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml', 'runtime/*/Cargo.toml', 'runtime/crates/*/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-agent-containers-mt1-${{ steps.rv.outputs.v }}-
      - name: Each tracked file at its last commit's time (cargo rebuilds only what changed since the cache)
        run: bash .github/ci/commit-times.sh runtime/target/.drgnx-built-from
      # + the forwarder a job granted network runs, static (as `drgnx runtime build` makes it: its own target dir) and
      # beside the hub, where the hub looks for it
      - id: build
        run: |
          cargo build --locked --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr -p domr --features drgnx-ratatoskr/test-hooks
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --manifest-path runtime/Cargo.toml -p drgnx-fwd --target x86_64-unknown-linux-musl --target-dir runtime/target/fwd
          cp runtime/target/fwd/x86_64-unknown-linux-musl/debug/drgnx-fwd runtime/target/debug/drgnx-fwd
      # sleipnir in jobq's shape (`linux,sync`: docs/develop/sleipnir.md) builds static too, in the forwarder's target dir
      - if: ${{ !cancelled() }}
        run: cargo build --locked --manifest-path runtime/Cargo.toml -p sleipnir --no-default-features --features linux,sync --target x86_64-unknown-linux-musl --target-dir runtime/target/fwd
      # The runner's user has no systemd user session, so rootless podman would fall back to cgroupfs and drop the
      # caps (the hub refuses container jobs then: exec/container.rs, check_limits). Lingering starts the user's
      # systemd; the hub's podman reaches it over the session bus (domr passes DBUS_SESSION_BUS_ADDRESS through).
      - name: a systemd user session for podman
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          timeout 60 sh -c "until [ -S /run/user/$uid/bus ]; do sleep 0.5; done"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR=/run/user/$uid DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus \
            podman info --format '{{.Host.CgroupsVersion}} {{.Host.CgroupManager}} {{.Host.CgroupControllers}}'
      # --require-all: a skipped container row fails here (podman is on the runner)
      - name: container and container-escape rows
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          runtime/target/debug/domr --hub-bin runtime/target/debug/ratatoskr \
            --scenarios test/conformance --only 'container*/*' --require-all
      # the runner bundles of both architectures, static (`bin/drgnx build runner-bundle`, docs/develop/sleipnir.md),
      # and the x86_64 one run in an image of another libc (Alpine's musl, pinned by the digest pulled now)
      - name: runner bundles, and the bundle in a musl image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          bin/drgnx build runner-bundle --arch x86_64
          bin/drgnx build runner-bundle --arch aarch64
          podman pull -q docker.io/library/alpine:3.22
          img="docker.io/library/alpine@$(podman image inspect docker.io/library/alpine:3.22 --format '{{.Digest}}')"
          DRGNX_TEST_BUNDLE="$PWD/runtime/target/bundle/x86_64" DRGNX_TEST_FOREIGN_IMAGE="$img" \
            cargo test --locked --no-fail-fast --manifest-path runtime/Cargo.toml -p sleipnir --test bundle_host -- --ignored
      # last, whatever the rows said
      - id: prune
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        run: |
          bash .github/ci/cargo-prune.sh runtime/Cargo.toml runtime/target
          # the commit it was built from, only when every step before passed: after a step that failed some outputs
          # may be older than the sources, so the commit restored stays (or none: the next run rebuilds everything)
          if [ "${{ job.status }}" = success ]; then git -c safe.directory="$PWD" rev-parse HEAD > runtime/target/.drgnx-built-from; fi
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # the registry once per lock and OS, for every job: one already there (main's, for a pull request whose lock is
      # main's) is not saved again
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' && steps.registry.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.registry.outputs.cache-primary-key }}

  # The fake fleet (test/runners/README.md): containers with sshd and rootless podman inside, as SSH runners. On demand
  # only until the spike's verdict is in (`only: rt-fleet`); it is never part of a push's gate.
  fleet:
    name: fake runner fleet
    if: ${{ github.event_name == 'workflow_dispatch' && contains(format(' {0} ', inputs.only), ' rt-fleet ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRGNX_ORG: ${{ github.workspace }}
      DRGNX_FLEET_HOST_RUSTC: "1"
      DRGNX_FLEET_HUB_IMAGE: localhost/drgnx-fake-runner:f45   # built by `up`; has the ssh client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: podman --version
      - run: rustup toolchain install stable --profile minimal
      - name: runners up
        run: bash test/runners/fleet.sh up --runners 2
      - name: the spike's checks in every runner
        run: bash test/runners/fleet.sh s1
      - name: linger over ssh
        run: bash test/runners/fleet.sh check-linger
      - name: down
        if: ${{ always() }}
        run: bash test/runners/fleet.sh down

  # The Android type-check (Android is not a target; the door stays open: docs/develop/runtime.md). The fake C compiler
  # is for urdr's bundled SQLite: a type-check does not link.
  android:
    name: Android type-check
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-android ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC_aarch64_linux_android: /usr/bin/true
      AR_aarch64_linux_android: /usr/bin/true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - run: rustup target add aarch64-linux-android
      - id: rv
        run: echo "v=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - id: registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: cargo-${{ runner.os }}-android-mt1-${{ steps.rv.outputs.v }}-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml', 'runtime/*/Cargo.toml', 'runtime/crates/*/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-android-mt1-${{ steps.rv.outputs.v }}-
      - name: Each tracked file at its last commit's time (cargo rebuilds only what changed since the cache)
        run: bash .github/ci/commit-times.sh runtime/target/.drgnx-built-from
      # + the runner's protocol and sync alone: the shape jobq and the Android door take (docs/develop/sleipnir.md)
      - id: build
        run: |
          cargo check --locked --manifest-path runtime/Cargo.toml --target aarch64-linux-android -p runstav -p draugr -p eitri -p gleipnir -p huginn -p heimdall -p drgnx-ratatoskr -p forseti
          cargo check --locked --manifest-path runtime/Cargo.toml --target aarch64-linux-android -p sleipnir --no-default-features --features proto,sync
      # the pure-Rust crates' tests too: only clippy's test build shows code that is dead on Android (gate review M21)
      - if: ${{ !cancelled() }}
        run: |
          cargo clippy --locked --manifest-path runtime/Cargo.toml --target aarch64-linux-android --all-targets -p runstav -p draugr -p eitri -p gleipnir -p mimir -p bifrost -p huginn -p heimdall -p forseti -- -D warnings
          cargo clippy --locked --manifest-path runtime/Cargo.toml --target aarch64-linux-android --all-targets -p sleipnir --no-default-features --features proto,sync -- -D warnings
      - id: prune
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        run: |
          bash .github/ci/cargo-prune.sh runtime/Cargo.toml runtime/target
          # the commit it was built from, only when every step before passed: after a step that failed some outputs
          # may be older than the sources, so the commit restored stays (or none: the next run rebuilds everything)
          if [ "${{ job.status }}" = success ]; then git -c safe.directory="$PWD" rev-parse HEAD > runtime/target/.drgnx-built-from; fi
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # the registry once per lock and OS, for every job: one already there (main's, for a pull request whose lock is
      # main's) is not saved again
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' && steps.registry.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.registry.outputs.cache-primary-key }}

  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' rt-deny ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - name: cargo-deny 0.20.2 (checksum verified)
        run: |
          url=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          sha256=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -fsSL -o "$RUNNER_TEMP/cargo-deny.tgz" "$url"
          echo "$sha256  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tgz" -C "$RUNNER_TEMP" --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo-deny --manifest-path runtime/Cargo.toml check

  # libFuzzer targets on the pinned nightly (the ledger's: nightly-2026-10-15, cargo-fuzz 0.13.2). The ubuntu runner has
  # g++ for libfuzzer-sys. 60 s a target on a push to main, 10 minutes a target nightly, `fuzz_minutes` when dispatched;
  # a pull request runs none. A crash uploads its input. The targets are built once (`fuzz-build`: `cargo fuzz build`,
  # the build `cargo fuzz run` makes) and the four shards of `cargo fuzz list`'s targets each download their own and
  # run them as `cargo fuzz run` does, so a nightly takes about 70 minutes, and a new target runs with no change here.
  fuzz-build:
    name: fuzz targets (build)
    if: ${{ github.event_name != 'pull_request' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-fuzz ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIGHTLY: nightly-2026-10-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      # the key names the nightly and the cargo-fuzz version (the step below), so a bump is a new cache
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            runtime/fuzz/target
          key: cargo-${{ runner.os }}-fuzz-${{ env.NIGHTLY }}-cargo-fuzz-0.13.2-${{ hashFiles('runtime/fuzz/Cargo.lock', 'runtime/Cargo.toml', 'runtime/*/Cargo.toml', 'runtime/crates/*/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-fuzz-${{ env.NIGHTLY }}-cargo-fuzz-0.13.2-
      - name: cargo-fuzz 0.13.2
        id: tool
        run: test -x ~/.cargo/bin/cargo-fuzz || cargo "+$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      # every target (release, debug assertions, AddressSanitizer: cargo-fuzz's defaults, as `cargo fuzz run` builds),
      # then each shard's binaries and list in a directory of its own (the shard's artifact)
      - name: Build every target
        id: build
        run: |
          cargo "+$NIGHTLY" fuzz build --fuzz-dir runtime/fuzz
          out="runtime/fuzz/target/$(rustc "+$NIGHTLY" -vV | sed -n 's/^host: //p')/release"
          for shard in 0 1 2 3; do mkdir -p "$RUNNER_TEMP/fuzz-bins/$shard"; done
          cargo "+$NIGHTLY" fuzz list --fuzz-dir runtime/fuzz | sort | awk '{ print > (ENVIRON["RUNNER_TEMP"] "/fuzz-bins/" (NR % 4) "/targets") }'
          for shard in 0 1 2 3; do
            while read -r target; do cp "$out/$target" "$RUNNER_TEMP/fuzz-bins/$shard/"; done < "$RUNNER_TEMP/fuzz-bins/$shard/targets"
          done
          du -sh "$RUNNER_TEMP"/fuzz-bins/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-bins-0
          path: ${{ runner.temp }}/fuzz-bins/0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-bins-1
          path: ${{ runner.temp }}/fuzz-bins/1
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-bins-2
          path: ${{ runner.temp }}/fuzz-bins/2
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-bins-3
          path: ${{ runner.temp }}/fuzz-bins/3
          if-no-files-found: error
          retention-days: 1
      - id: prune
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY }}
        run: bash .github/ci/cargo-prune.sh runtime/fuzz/Cargo.toml runtime/fuzz/target
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            runtime/fuzz/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  fuzz:
    name: fuzz (shard ${{ matrix.shard }} of 4)
    needs: fuzz-build
    if: ${{ github.event_name != 'pull_request' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-fuzz ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      EVENT: ${{ github.event_name }}
      MINUTES: ${{ inputs.fuzz_minutes }}
    steps:
      # the committed inputs (runtime/fuzz/corpus) and the lock the corpus key hashes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: runtime/fuzz
      - name: How long
        run: |
          case "$EVENT" in
            schedule) secs=600 ;;
            workflow_dispatch) m=${MINUTES:-10}; case "$m" in ''|*[!0-9]*) echo "fuzz_minutes is a whole number" >&2; exit 2 ;; esac; secs=$((m * 60)) ;;
            *) secs=60 ;;
          esac
          echo "FUZZ_SECONDS=$secs" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-bins-${{ matrix.shard }}
          path: ${{ runner.temp }}/fuzz-bins
      # the corpora the fuzzers grew (runtime/fuzz/corpus/TARGET, beside the committed inputs; a file's name is its
      # hash, so an old one restored over a committed one is the same input): a longer run starts where the last
      # stopped. More inputs only reach further; a corpus cannot turn a crash into a pass. Grown by the daily run and
      # main only, restored everywhere.
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/fuzz/corpus
          key: fuzz-corpus-${{ matrix.shard }}-${{ hashFiles('runtime/fuzz/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.shard }}-
      # every target of the shard runs, whatever an earlier one found; the step fails at the end naming each that failed.
      # As `cargo fuzz run` runs it: its artifact prefix and corpus directory, ASan without the ODR check
      - name: Run each target
        id: run
        run: |
          failed=""
          bins="$RUNNER_TEMP/fuzz-bins"
          targets=$(cat "$bins/targets")
          test -n "$targets"
          for target in $targets; do
            echo "::group::$target ($FUZZ_SECONDS s)"
            chmod +x "$bins/$target"
            mkdir -p "runtime/fuzz/corpus/$target" "runtime/fuzz/artifacts/$target"
            ASAN_OPTIONS="${ASAN_OPTIONS:+$ASAN_OPTIONS:}detect_odr_violation=0" "$bins/$target" \
              "-artifact_prefix=runtime/fuzz/artifacts/$target/" "-max_total_time=$FUZZ_SECONDS" "runtime/fuzz/corpus/$target" ||
              failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed" >&2; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes-${{ matrix.shard }}
          path: runtime/fuzz/artifacts
          if-no-files-found: ignore
      - if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/fuzz/corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}

  macos:
    name: tests, conformance, perf (macOS 27)
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-macos ')) }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      # the image's rustup (as the Linux runner jobs), not Homebrew's rust: no formula download and install per run
      - run: rustup toolchain install stable --profile minimal --component clippy
      - id: rv
        run: echo "v=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - id: registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: cargo-${{ runner.os }}-rustup-mt1-${{ steps.rv.outputs.v }}-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml', 'runtime/*/Cargo.toml', 'runtime/crates/*/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-rustup-mt1-${{ steps.rv.outputs.v }}-
      - name: Each tracked file at its last commit's time (cargo rebuilds only what changed since the cache)
        run: bash .github/ci/commit-times.sh runtime/target/.drgnx-built-from
      # draugr runs only the git of the developer dir xcode-select's link names, and refuses Xcode under the
      # admin-writable /Applications (on the runner even its git is the runner user's); the Command Line Tools, which
      # the image installs, pass. Before the tests: draugr's git tests and the escape rows run that git.
      - name: xcode-select points at the Command Line Tools (the git draugr trusts)
        run: |
          xcode-select -p
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
      # the model files, as the Fedora 45 job (one cache for both)
      - id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ../test-models
          key: models-${{ hashFiles('.github/ci/models.txt') }}
          enableCrossOsArchive: true
      - name: the model files (DRGNX_TEST_MODELS)
        id: models-fetch
        run: |
          /bin/bash .github/ci/models.sh ../test-models
          echo "DRGNX_TEST_MODELS=$(cd ../test-models && pwd)" >> "$GITHUB_ENV"
      - if: ${{ !cancelled() && (env.CACHE_SAVE == 'true' || env.CACHE_SAVE_PR == 'true') && steps.models.outputs.cache-hit != 'true' && steps.models-fetch.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ../test-models
          key: ${{ steps.models.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      # --no-fail-fast: every crate's failures in one run (no Mac to try them on before CI). No DRGNX_TEST_ADAPTER: the
      # GPU tests are ignored on macOS (the runner has no GPU; Metal parity is a real Mac's)
      - run: cargo test --locked --no-fail-fast --manifest-path runtime/Cargo.toml --workspace --features drgnx-ratatoskr/test-hooks
      # (+ gleipnir-probe and gleipnir-escape for the Seatbelt rows below). The workspace tests above already run
      # `eitri` and `draugr` on macOS (their O_NOFOLLOW_ANY, xcode-select-link and CLOEXEC-loop paths).
      - id: build
        if: ${{ !cancelled() }}
        run: cargo build --locked --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr -p domr -p gleipnir-escape --features drgnx-ratatoskr/test-hooks
      # the pinned release tarball, kept by the hash of nidhogg.sh (which holds the version and the checksums; the
      # tarball is checked against them on every use); main saves it once per pin, every run restores it
      - id: nidhogg-tarball
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nidhogg-downloads
          key: nidhogg-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/container/nidhogg.sh') }}
      - name: Nidhogg 31.1 (writes DRGNX_EMACS to the environment)
        id: nidhogg
        if: ${{ !cancelled() }}
        env:
          NIDHOGG_DOWNLOADS: ${{ runner.temp }}/nidhogg-downloads
        run: /bin/bash test/container/nidhogg.sh macos
      - if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.nidhogg.outcome == 'success' && steps.nidhogg-tarball.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nidhogg-downloads
          key: ${{ steps.nidhogg-tarball.outputs.cache-primary-key }}
      # as the runner user; the `sudo` rows reach the socket as nobody through passwordless `sudo -n -u nobody`, so
      # security/another-uid-is-refused covers tokio's getpeereid path. --require-all fails it if it is skipped
      - name: conformance
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.nidhogg.outcome == 'success' }}
        run: |
          sudo -n true
          runtime/target/debug/domr --hub-bin runtime/target/debug/ratatoskr \
            --scenarios test/conformance --require-all
      - name: perf baseline (release build)
        id: perf
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --release --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr -p domr
          runtime/target/release/domr --hub-bin runtime/target/release/ratatoskr \
            --scenarios test/conformance --only 'perf/*' --perf perf-macos.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.perf.outcome == 'success' }}
        with:
          name: ratatoskr-perf-macos
          path: perf-macos.json
          if-no-files-found: error
      # The Seatbelt rows run for real, with the real /usr/bin/sandbox-exec. --require-all: a skip fails the job. It
      # runs whatever the conformance and perf steps said, and they whatever it says. mac-works-git needs the git
      # draugr trusts: xcode-select points at the Command Line Tools since the step before the tests.
      # mac-net-* need a non-loopback address (the fixture takes the one the default route uses); the step prints
      # what the runner has.
      - name: escape suite (Seatbelt, required)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcode-select -p
          route -n get default | grep -E 'interface|gateway' || true
          ifconfig | grep 'inet ' || true
          mkdir -p "$RUNNER_TEMP/escape"
          runtime/target/debug/gleipnir-escape --ratatoskr runtime/target/debug/ratatoskr \
            --probe runtime/target/debug/gleipnir-probe \
            --rows runtime/crates/gleipnir-escape/rows/macos --rows runtime/crates/gleipnir-escape/rows/any \
            --require-all --report "$RUNNER_TEMP/escape/escape-macos.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: escape-report-macos
          path: ${{ runner.temp }}/escape/escape-macos.json
          if-no-files-found: warn
      # The pure-Rust crates' tests through clippy on darwin: only clippy's test build shows code that is dead on macOS
      # (gate review M21). After the escape rows, whatever they say, so neither hides the other.
      - name: clippy on darwin (the pure-Rust crates)
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path runtime/Cargo.toml --all-targets -p runstav -p draugr -p eitri -p gleipnir -p mimir -p bifrost -p huginn -p heimdall -- -D warnings
      - id: prune
        if: ${{ !cancelled() && (env.CACHE_SAVE == 'true' || env.CACHE_SAVE_PR == 'true') && steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        run: |
          bash .github/ci/cargo-prune.sh runtime/Cargo.toml runtime/target
          # the commit it was built from, only when every step before passed: after a step that failed some outputs
          # may be older than the sources, so the commit restored stays (or none: the next run rebuilds everything)
          if [ "${{ job.status }}" = success ]; then git -c safe.directory="$PWD" rev-parse HEAD > runtime/target/.drgnx-built-from; fi
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # the registry once per lock and OS, for every job: one already there (main's, for a pull request whose lock is
      # main's) is not saved again
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' && steps.registry.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ steps.registry.outputs.cache-primary-key }}
