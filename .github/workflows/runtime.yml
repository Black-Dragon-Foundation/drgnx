# The Rust runtime (runtime/), Ratatoskr: on Linux (Fedora 45) and macOS 27 the unit tests, the conformance suite
# against the built binary (every row, the v0 rows through the front too), a release build and the recorded perf
# baseline; plus the oldest supported compiler (MSRV 1.88), the supply-chain policy and the fuzz targets.
#
# Push (main, ci/*) and pull-request runs come from ci.yml, which calls this file (`workflow_call`), so these jobs are
# part of ci.yml's `CI gate`. Running this file on push as well would build everything twice, so its own triggers are
# the daily run (deny, and the fuzz targets for 10 minutes each) and a manual one (`fuzz_minutes` per target).
# Nothing stops early: `cargo test --no-fail-fast`, and each independent step runs whatever the steps before it said
# (`!cancelled()`; a step that needs a build waits only for that build's outcome). docs/develop/ci.md,
# docs/develop/runtime.md
name: Runtime

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: Minutes of fuzzing per target (default 10)
        type: string
        default: "10"
  workflow_call:
    inputs:
      fuzz_minutes:
        description: Minutes of fuzzing per target (empty means 1 minute on a push to main, none on a pull request)
        type: string
        default: ""

permissions:
  contents: read

# a push never cancels the daily policy run; a newer push to a ci/* branch cancels the older run, one on main never
concurrency:
  group: runtime-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    name: fmt, clippy, tests, conformance, perf (Fedora 45)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
      # a real PID 1 that reaps orphans: draugr's reap tests check a killed group is gone, and an unreaped zombie
      # still answers kill(-pgid, 0) (the same reason ctr.sh runs podman with --init)
      options: --init
    timeout-minutes: 45
    defaults:
      run:
        working-directory: runtime
    steps:
      # root in this container: the `sudo` rows (another uid on the socket) run, through setpriv. setpriv is in
      # util-linux; the fedora image has only util-linux-core (draugr's pdeathsig test runs it too)
      - name: Tools
        working-directory: /
        run: dnf -y install git cargo rust gcc clippy rustfmt tar zstd gzip procps-ng util-linux bubblewrap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            runtime/target
          key: cargo-${{ runner.os }}-fedora45-${{ hashFiles('runtime/Cargo.lock') }}
      - run: cargo fmt --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets --features drgnx-ratatoskr/test-hooks -- -D warnings
      # --no-fail-fast: every crate's failures in one run
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast --workspace --features drgnx-ratatoskr/test-hooks
      # the test-hooks binary and the harness for the steps below
      # (+ gleipnir-probe and gleipnir-escape, the escape suite's two binaries: glibc builds, so the same ones run on a VM)
      - id: build
        if: ${{ !cancelled() }}
        run: cargo build --locked -p drgnx-ratatoskr -p domr -p gleipnir-escape --features drgnx-ratatoskr/test-hooks
      # gleipnir's test hooks (landlock_omit, abi_cap) must never be on in a build without --features (review M5).
      # The inverted form: the forward `cargo tree` does not show gleipnir's feature even when it is on (Task 0).
      # `shell: bash` adds pipefail (a failed `cargo tree` fails the step), and the tree must name gleipnir at all, so
      # an empty file never passes (gate review S14).
      - name: gleipnir has no test-hooks in a default ratatoskr build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo tree --locked -e features -i gleipnir -p drgnx-ratatoskr | tee "$RUNNER_TEMP/gleipnir-features.txt"
          grep -q '^gleipnir v' "$RUNNER_TEMP/gleipnir-features.txt"
          if grep -q 'gleipnir feature "test-hooks"' "$RUNNER_TEMP/gleipnir-features.txt"; then
            echo "gleipnir's test-hooks are on in a default build" >&2; exit 1
          fi
      # The gateway speaks HTTP/1.1 over rustls with the ring provider: neither h2 nor aws-lc-sys may be in any
      # target's graph (all kinds of dependencies). `cargo tree -i` prints nothing and fails when the package is not
      # in the graph, which is what we want; any output means it is.
      - name: h2 and aws-lc-sys are not in the tree
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for crate in h2 aws-lc-sys; do
            found=$(cargo tree --locked --workspace --target all -e normal,build,dev -i "$crate" 2>/dev/null || true)
            if [ -n "$found" ]; then echo "$crate is in the dependency tree:" >&2; echo "$found" >&2; exit 1; fi
          done
      # The escape suite, container tier (docs/develop/gleipnir.md, "Proving it"). As root in this container there are
      # no user namespaces to nest, so the full and reduced rows skip with a listed reason ("inside a container",
      # "Landlock ABI N below 9"); what runs is that the rows parse, the probes reach without a sandbox,
      # check-in-a-container, the floor row, path-bwrap-never-run and fail-closed-no-bwrap. Only listed reasons may skip.
      # No --require-all (a skip here is expected); the VM/host jobs below hold the rest.
      - name: escape suite (container tier)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/escape"
          target/debug/gleipnir-escape --ratatoskr target/debug/ratatoskr --probe target/debug/gleipnir-probe \
            --rows crates/gleipnir-escape/rows --rows crates/gleipnir-escape/rows/container \
            --report "$RUNNER_TEMP/escape/escape-container.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: escape-report-container
          path: ${{ runner.temp }}/escape/escape-container.json
          if-no-files-found: warn
      - name: Nidhogg 31.1 (the Emacs drgnx ships on)
        id: nidhogg
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          dnf -y install curl tar xz
          bash test/container/nidhogg.sh fedora-45
      - name: conformance-lisp (the v0 rows against the Lisp hub)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.nidhogg.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: runtime/target/debug/domr --target lisp --hub-bin test/conformance/lisp-hub.sh --scenarios test/conformance
      # every row against Ratatoskr, the v0 rows through the front against the Lisp backend (design 8.4, "both ways").
      # --require-all: a skipped row fails the job, except a macOS-only row here and the perf rows (they run below)
      - name: conformance (Ratatoskr in front of the Lisp backend and the fake backend)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.nidhogg.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          runtime/target/debug/domr --target ratatoskr --hub-bin runtime/target/debug/ratatoskr \
            --lisp-hub test/conformance/lisp-hub.sh --fake-backend runtime/target/debug/ratatoskr-fake-backend \
            --scenarios test/conformance --require-all
      # the build install.sh makes: no test hooks in it, and it says so
      - name: release build says test_hooks false
        id: release
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --release -p drgnx-ratatoskr -p domr
          target/release/ratatoskr version --json | tee "$RUNNER_TEMP/version.json"
          grep -q '"test_hooks":false' "$RUNNER_TEMP/version.json"
      # a recorded baseline, no budgets (perf regression runs are deferred)
      - name: perf baseline
        id: perf
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          runtime/target/release/domr --target ratatoskr --hub-bin runtime/target/release/ratatoskr \
            --fake-backend runtime/target/release/ratatoskr-fake-backend --scenarios test/conformance \
            --only 'perf/*' --perf perf-linux.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.perf.outcome == 'success' }}
        with:
          name: ratatoskr-perf-linux
          path: perf-linux.json
          if-no-files-found: error

  msrv:
    name: MSRV 1.88 builds
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            runtime/target
          key: cargo-${{ runner.os }}-msrv188-${{ hashFiles('runtime/Cargo.lock') }}
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 build --locked --manifest-path runtime/Cargo.toml

  # The escape suite on the runner itself, no container: the full tier (bubblewrap with user namespaces) and, on the arm64
  # runner (free for public repositories), a real arm64 Linux run of the seccomp tests (GL-T4-2: the aarch64 syscall
  # numbers). Ubuntu 24.04 turns unprivileged user namespaces off through AppArmor, so the job lifts the restriction
  # with sudo (the runner user has passwordless sudo) and builds bubblewrap 0.12.0 (gleipnir's floor; apt has 0.9.0).
  # It gates (green on both runners since 74be75cf; a failure here fails the CI gate: docs/develop/ci.md).
  escape-host:
    name: escape suite on the runner (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            runtime/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-escape-${{ hashFiles('runtime/Cargo.lock') }}
      - name: bubblewrap 0.12.0 (checksum verified, built from source)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config libcap-dev
          curl -fsSL -o "$RUNNER_TEMP/bwrap.tar.xz" https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz
          echo "9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314  $RUNNER_TEMP/bwrap.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/bwrap.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/bubblewrap-0.12.0"
          # --prefix=/usr: Gleipnir trusts a bwrap only where root alone can change it, and the runner image makes
          # /usr/local group-writable (Gleipnir rightly refuses /usr/local/bin/bwrap there)
          meson setup _build --prefix=/usr -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled -Dselinux=disabled -Dtests=false
          ninja -C _build
          sudo ninja -C _build install
          ls -l /usr/bin/bwrap; /usr/bin/bwrap --version
      - name: user namespaces for unprivileged processes (AppArmor's restriction lifted)
        run: |
          uname -r
          cat /sys/kernel/security/lsm; echo
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true
          bwrap --unshare-all --ro-bind / / true
      - run: rustup toolchain install stable --profile minimal
      # the seccomp real-install cases and everything else of the three Linux crates, on this architecture
      - run: cargo test --locked --no-fail-fast --manifest-path runtime/Cargo.toml -p gleipnir -p draugr -p eitri -p gleipnir-escape
      - id: build
        if: ${{ !cancelled() }}
        run: cargo build --locked --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr -p gleipnir-escape --features drgnx-ratatoskr/test-hooks
      # No --require-all: a Landlock ABI below 9 skips the reduced rows ("Landlock ABI N below 9"), as the harness lists.
      - name: escape suite (full tier on the runner)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/escape"
          runtime/target/debug/gleipnir-escape --ratatoskr runtime/target/debug/ratatoskr \
            --probe runtime/target/debug/gleipnir-probe \
            --rows runtime/crates/gleipnir-escape/rows/linux --rows runtime/crates/gleipnir-escape/rows/any \
            --report "$RUNNER_TEMP/escape/escape-${{ runner.arch }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: escape-report-host-${{ runner.arch }}
          path: ${{ runner.temp }}/escape/escape-${{ runner.arch }}.json
          if-no-files-found: warn

  # The Android type-check (Android is not a target; the door stays open: docs/develop/runtime.md). The fake C compiler
  # is for urdr's bundled SQLite: a type-check does not link.
  android:
    name: Android type-check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC_aarch64_linux_android: /usr/bin/true
      AR_aarch64_linux_android: /usr/bin/true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-linux-android
      - run: cargo check --locked --manifest-path runtime/Cargo.toml --target aarch64-linux-android -p runstav -p draugr -p eitri -p gleipnir -p drgnx-ratatoskr
      # the pure-Rust crates' tests too: only clippy's test build shows code that is dead on Android (gate review M21)
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path runtime/Cargo.toml --target aarch64-linux-android --all-targets -p runstav -p draugr -p eitri -p gleipnir -p mimir -p bifrost -- -D warnings

  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny 0.20.2 (checksum verified)
        run: |
          url=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          sha256=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -fsSL -o "$RUNNER_TEMP/cargo-deny.tgz" "$url"
          echo "$sha256  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tgz" -C "$RUNNER_TEMP" --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo-deny --manifest-path runtime/Cargo.toml check

  # libFuzzer targets on the pinned nightly (the ledger's: nightly-2026-10-15, cargo-fuzz 0.13.2). The ubuntu runner has
  # g++ for libfuzzer-sys. 60 s a target on a push to main, 10 minutes a target nightly, `fuzz_minutes` when dispatched;
  # a pull request runs none. A crash uploads its input.
  fuzz:
    name: fuzz (line_codec, request_prelude, hello, connect_head, host_target, sbpl_quote, bwrap_version, inner_spec, mcp_message, jsonrpc_parse, text_one_line, put_parsed, task_write_args, graph_read_args, trust_fence, sqlro_sql, sse_usage, provider_merge, gateway_admit)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      NIGHTLY: nightly-2026-10-15
      EVENT: ${{ github.event_name }}
      MINUTES: ${{ inputs.fuzz_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: How long
        run: |
          case "$EVENT" in
            schedule) secs=600 ;;
            workflow_dispatch) m=${MINUTES:-10}; case "$m" in ''|*[!0-9]*) echo "fuzz_minutes is a whole number" >&2; exit 2 ;; esac; secs=$((m * 60)) ;;
            *) secs=60 ;;
          esac
          echo "FUZZ_SECONDS=$secs" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      # the key hashes this file too: it names the nightly and the cargo-fuzz version, so a bump is a new cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            runtime/fuzz/target
          key: cargo-${{ runner.os }}-fuzz-${{ hashFiles('runtime/fuzz/Cargo.lock', '.github/workflows/runtime.yml') }}
      - name: cargo-fuzz 0.13.2
        run: test -x ~/.cargo/bin/cargo-fuzz || cargo "+$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      # every target runs, whatever an earlier one found; the step fails at the end naming each that failed
      - name: Run each target
        run: |
          failed=""
          for target in line_codec request_prelude hello connect_head host_target sbpl_quote bwrap_version inner_spec mcp_message jsonrpc_parse text_one_line put_parsed task_write_args graph_read_args trust_fence sqlro_sql sse_usage provider_merge gateway_admit; do
            echo "::group::$target ($FUZZ_SECONDS s)"
            cargo "+$NIGHTLY" fuzz run "$target" --fuzz-dir runtime/fuzz -- "-max_total_time=$FUZZ_SECONDS" || failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed" >&2; exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashes
          path: runtime/fuzz/artifacts
          if-no-files-found: ignore

  macos:
    name: tests, conformance, perf (macOS 27)
    if: github.event_name != 'schedule'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            runtime/target
          key: cargo-${{ runner.os }}-brew-${{ hashFiles('runtime/Cargo.lock') }}
      # draugr runs only the git of the developer dir xcode-select's link names, and refuses Xcode under the
      # admin-writable /Applications (on the runner even its git is the runner user's); the Command Line Tools, which
      # the image installs, pass. Before the tests: draugr's git tests and the escape rows run that git.
      - name: xcode-select points at the Command Line Tools (the git draugr trusts)
        run: |
          xcode-select -p
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
      # --no-fail-fast: every crate's failures in one run (no Mac to try them on before CI)
      - run: cargo test --locked --no-fail-fast --manifest-path runtime/Cargo.toml --workspace --features drgnx-ratatoskr/test-hooks
      # (+ gleipnir-probe and gleipnir-escape for the Seatbelt rows below). The workspace tests above already run
      # `eitri` and `draugr` on macOS (their O_NOFOLLOW_ANY, xcode-select-link and CLOEXEC-loop paths).
      - id: build
        if: ${{ !cancelled() }}
        run: cargo build --locked --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr -p domr -p gleipnir-escape --features drgnx-ratatoskr/test-hooks
      - name: Nidhogg 31.1 (writes DRGNX_EMACS to the environment)
        id: nidhogg
        if: ${{ !cancelled() }}
        run: /bin/bash test/container/nidhogg.sh macos
      - name: conformance-lisp (the v0 rows against the Lisp hub)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.nidhogg.outcome == 'success' }}
        run: runtime/target/debug/domr --target lisp --hub-bin test/conformance/lisp-hub.sh --scenarios test/conformance
      # as the runner user; the `sudo` rows reach the socket as nobody through passwordless `sudo -n -u nobody`, so
      # security/another-uid-is-refused covers tokio's getpeereid path. --require-all fails it if it is skipped
      - name: conformance (Ratatoskr in front of the Lisp backend and the fake backend)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.nidhogg.outcome == 'success' }}
        run: |
          sudo -n true
          runtime/target/debug/domr --target ratatoskr --hub-bin runtime/target/debug/ratatoskr \
            --lisp-hub test/conformance/lisp-hub.sh --fake-backend runtime/target/debug/ratatoskr-fake-backend \
            --scenarios test/conformance --require-all
      - name: perf baseline (release build)
        id: perf
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --release --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr -p domr
          runtime/target/release/domr --target ratatoskr --hub-bin runtime/target/release/ratatoskr \
            --fake-backend runtime/target/release/ratatoskr-fake-backend --scenarios test/conformance \
            --only 'perf/*' --perf perf-macos.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.perf.outcome == 'success' }}
        with:
          name: ratatoskr-perf-macos
          path: perf-macos.json
          if-no-files-found: error
      # The Seatbelt rows run for real, with the real /usr/bin/sandbox-exec. --require-all: a skip fails the job. It
      # runs whatever the conformance and perf steps said, and they whatever it says. mac-works-git needs the git
      # draugr trusts: xcode-select points at the Command Line Tools since the step before the tests.
      # mac-net-* need a non-loopback address (the fixture takes the one the default route uses); the step prints
      # what the runner has.
      - name: escape suite (Seatbelt, required)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcode-select -p
          route -n get default | grep -E 'interface|gateway' || true
          ifconfig | grep 'inet ' || true
          mkdir -p "$RUNNER_TEMP/escape"
          runtime/target/debug/gleipnir-escape --ratatoskr runtime/target/debug/ratatoskr \
            --probe runtime/target/debug/gleipnir-probe \
            --rows runtime/crates/gleipnir-escape/rows/macos --rows runtime/crates/gleipnir-escape/rows/any \
            --require-all --report "$RUNNER_TEMP/escape/escape-macos.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: escape-report-macos
          path: ${{ runner.temp }}/escape/escape-macos.json
          if-no-files-found: warn
      # The pure-Rust crates' tests through clippy on darwin: only clippy's test build shows code that is dead on macOS
      # (gate review M21). After the escape rows, whatever they say, so neither hides the other.
      - name: clippy on darwin (the pure-Rust crates)
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path runtime/Cargo.toml --all-targets -p runstav -p draugr -p eitri -p gleipnir -p mimir -p bifrost -- -D warnings
