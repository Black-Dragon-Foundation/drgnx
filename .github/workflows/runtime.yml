# The Rust runtime (runtime/), Ratatoskr: on Linux (Fedora 45) and macOS 27 the unit tests, the conformance suite
# against the built binary (every row, the v0 rows through the front too), a release build and the recorded perf
# baseline; plus the oldest supported compiler (MSRV 1.95), the supply-chain policy and the fuzz targets.
#
# Push (main, ci/*) and pull-request runs come from ci.yml, which calls this file (`workflow_call`), so these jobs are
# part of ci.yml's `CI gate`. Running this file on push as well would build everything twice, so its own triggers are
# the daily run (deny, and the fuzz targets for 10 minutes each) and a manual one (`fuzz_minutes` per target).
# Nothing stops early: `cargo test --no-fail-fast`, and each independent step runs whatever the steps before it said
# (`!cancelled()`; a step that needs a build waits only for that build's outcome). docs/develop/ci.md,
# docs/develop/runtime.md
name: Runtime

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: Minutes of fuzzing per target (default 10)
        type: string
        default: "10"
      only:
        description: "Narrowed: the jobs to run, of rt-linux rt-msrv rt-escape rt-containers rt-fleet rt-android rt-deny rt-fuzz rt-macos (empty: all but the on-demand rt-fleet)"
        type: string
        default: ""
  workflow_call:
    inputs:
      fuzz_minutes:
        description: Minutes of fuzzing per target (empty means 10 on a dispatch; none on a pull request or main's push)
        type: string
        default: ""
      only:
        description: "The jobs to run (ci.yml's path filter, .github/ci/paths.txt), as above; empty: all"
        type: string
        default: ""

permissions:
  contents: read

# a push never cancels the daily policy run; a newer push to a ci/* branch cancels the older run, one on main never
concurrency:
  group: runtime-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The cargo caches (docs/develop/ci.md, "What is cached"): one target entry per build job, through one action
# (.github/actions/cargo-target). The key is the job, the toolchain (`rustc -V`), the hash of Cargo.lock and
# .cargo/config.toml, and the commit (.github/ci/cache-key.sh); a run restores the newest entry of its job, toolchain
# and lock, else of its toolchain, never another one's, and cargo rebuilds whatever is stale. Saved at the end of a job
# whose build passed, after .github/ci/cargo-prune.sh dropped what every run rebuilds, and only by a push or a manual
# run on main, ci/* or scratch/drgnx-mac-rounds (.github/ci/cache-policy.sh; the `cache-prune` job then deletes the
# ref's superseded entries). A pull request and a fork never save: their entries (scoped to their merge refs, read by
# no other run) pushed main's out of the repository's 10 GB (2026-11-06: 9.2 GB of PR 3's entries, none of main's
# left). No incremental data: CI never reuses it. Each entry carries the commit it was built from
# (target/.drgnx-built-from): after the restore, .github/ci/commit-times.sh gives each tracked file its last commit's
# time and leaves what changed since then new, so cargo rebuilds only that (a checkout's files all carry its time); the
# checkouts fetch the whole history for it (fetch-depth 0, no old file contents). `mt1` in the keys: the entries that
# carry that commit. No per-unit compiler cache: one build per job leaves nothing for it to share, and it wrote one entry per unit.
# Line tables only, not full debug info: backtraces keep their file and line, and the kept build (the local crates'
# artifacts too) halves (the linux job's test build: 5.3 GB on disk, 1.1 GB compressed, against 2.6 GB and 0.6 GB),
# so the entries stay well inside the repository's 10 GB.
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The Fedora 45 job's prebuilt container (`Test images`, images.yml: test/container/Containerfile.rust), by digest: a
  # job's container is named before its steps run, so this job looks it up, by the tag of this checkout's inputs
  # (test/container/image-tag.sh). ci.yml's `images` job built and pushed any missing tag before this workflow ran; the
  # output is empty when GHCR still has none (a fork's pull request), and the job then installs what the image holds
  # itself. (The escape legs look their bubblewrap up in their own step.) The same lookup finds the prebuilt assets
  # (`drgnx-assets`: the model files, the libghostty-vt and Zig tarballs, the macOS Nidhogg tarball, .github/ci/assets.sh)
  # for the jobs that unpack them (the Fedora job, the live debug adapters and the macOS jobs): none of them downloads
  # from Hugging Face or the tarballs' sites, whose transfers cancelled on every Mac job of PR 5's round 5.
  images:
    name: Prebuilt image (Fedora 45 job)
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-linux ') || contains(format(' {0} ', inputs.only), ' rt-macos ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      rust: ${{ steps.ref.outputs.rust }}
      assets: ${{ steps.ref.outputs.assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/ci
            test/container
            crates/hub/ghostty-vt-sys
      - id: ref
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          rust="$(bash .github/ci/ghcr.sh ref drgnx-test-rust "$(bash test/container/image-tag.sh test/container/Containerfile.rust)")"
          echo "rust=$rust" | tee -a "$GITHUB_OUTPUT"
          assets="$(bash .github/ci/ghcr.sh ref drgnx-assets "$(bash .github/ci/assets.sh tag)")"
          echo "assets=$assets" | tee -a "$GITHUB_OUTPUT"

  linux:
    name: fmt, clippy, tests, conformance, perf (Fedora 45)
    needs: images
    if: ${{ !cancelled() && github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-linux ')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # the prebuilt image (Fedora 45 with rust-packages.sh and Nidhogg) with a token to pull it, else plain Fedora 45
    # and the steps install them. One expression for the whole container: GitHub refuses a job whose `credentials`
    # come out empty ("Unexpected value ''") before any step runs, so the fallback names none.
    # --init: a real PID 1 that reaps orphans: draugr's reap tests check a killed group is gone, and an unreaped zombie
    # still answers kill(-pgid, 0) (the same reason ctr.sh runs podman with --init)
    container: >-
      ${{ needs.images.outputs.rust
      && fromJSON(format('{{"image":"{0}","options":"--init","credentials":{{"username":"{1}","password":"{2}"}}}}',
      needs.images.outputs.rust, github.actor, github.token))
      || fromJSON('{"image":"registry.fedoraproject.org/fedora:45","options":"--init"}') }}
    # 120 until the build-once redesign (docs: the CI flow redesign, 2026-11-22). With no warm cache, clippy, grammars,
    # the test build and the tests alone took 43 of the old 45 minutes, so conformance, release and perf never ran.
    timeout-minutes: 120
    env:
      PREBUILT: ${{ needs.images.outputs.rust }}
    steps:
      # root in this container: the `sudo` rows (another uid on the socket) run, through setpriv
      - name: git for the checkout (in the prebuilt image already)
        if: ${{ env.PREBUILT == '' }}
        working-directory: /
        run: dnf -y install git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - name: Tools (in the prebuilt image already)
        if: ${{ env.PREBUILT == '' }}
        working-directory: ${{ github.workspace }}
        run: sh test/container/rust-packages.sh
      - name: Zig (in the prebuilt image already; the terminal engine's build tool)
        if: ${{ env.PREBUILT == '' }}
        working-directory: ${{ github.workspace }}
        run: bash test/container/zig.sh linux
      # The prebuilt assets (`drgnx-assets`, by digest): the pinned model files the tests run the built-in model from
      # (they fail without DRGNX_TEST_MODELS), beside the checkout, not in it (the tests that list a checkout would find
      # them), and the libghostty-vt tarballs (build.rs never downloads). models.sh checks each file's sum and fetches
      # only what is missing (a fork's run, with no GHCR token for the image)
      - name: the prebuilt assets (models, libghostty-vt tarballs)
        working-directory: ${{ github.workspace }}
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: bash .github/ci/assets.sh use "${{ needs.images.outputs.assets }}"
      - name: libghostty-vt's pinned tarballs (build.rs never downloads)
        working-directory: ${{ github.workspace }}
        run: bash crates/hub/ghostty-vt-sys/fetch.sh
      - name: the model files (DRGNX_TEST_MODELS)
        id: models-fetch
        working-directory: ${{ github.workspace }}
        run: |
          bash .github/ci/models.sh ../test-models
          echo "DRGNX_TEST_MODELS=$(cd ../test-models && pwd)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/cargo-target
        with:
          job: fedora45
          mode: restore
      - run: cargo fmt --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets --features ratatoskr/test-hooks,ferja/test-hooks -- -D warnings
      # the plugin tests load WASM components built for wasm32-wasip2 (Fedora's packaged Rust has no wasip2 standard
      # library and cannot use an upstream one: wasm-target.sh installs the same rustc version with rustup-init, checked
      # by its SHA-256, for the fixtures alone and sets DRGNX_WASM_CARGO): built first, so a missing target or a broken
      # fixture is named here, before the tests
      - name: wasm32-wasip2 and the plugin fixtures
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: bash .github/ci/wasm-target.sh
      # cargo-nextest runs the workspace's tests, each in a process of its own (the same tests by name as libtest's runner,
      # the ignored ones still ignored), with no retries; it runs no doc tests, so they have their own step
      - name: cargo-nextest 0.9.151 (checksum verified)
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: bash .github/ci/nextest.sh
      # the test-hooks binary and the harness for the steps below, first: the pack grammars below are built with this
      # hub (no second `cargo run` build of it)
      # (+ gleipnir-probe and gleipnir-escape, the escape suite's two binaries: glibc builds, so the same ones run on a VM;
      # + drgnx-key beside the hub, which a keyed job here runs in front of its command)
      - id: build
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked -p ratatoskr -p domr -p gleipnir-escape --features ratatoskr/test-hooks
          cargo build --locked -p sleipnir --no-default-features --bin drgnx-key
      # the hub parses code with the pack-built grammars (language packs): built once by the pack job, with the hub the
      # build above made (RATATOSKR, as the macOS jobs do), and handed to the tests as DRGNX_PACK_LOCK /
      # DRGNX_PACK_GRAMMARS (test/packs/hub-grammars.sh)
      - name: Pack grammars for the tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          [ -x target/debug/ratatoskr ] || { echo "::error::the build made no hub binary"; exit 1; }
          line="$(RATATOSKR="$PWD/target/debug/ratatoskr" bash test/packs/hub-grammars.sh "$RUNNER_TEMP/hub-grammars" | grep '^export DRGNX_PACK_LOCK=')"
          eval "$line"
          echo "DRGNX_PACK_LOCK=$DRGNX_PACK_LOCK" >> "$GITHUB_ENV"
          echo "DRGNX_PACK_GRAMMARS=$DRGNX_PACK_GRAMMARS" >> "$GITHUB_ENV"
      # --no-fail-fast: every crate's failures in one run. The GPU tests run the real shaders on llvmpipe, Mesa's
      # software Vulkan driver (rust-packages.sh installs it), so they need no GPU
      - if: ${{ !cancelled() }}
        env:
          DRGNX_TEST_ADAPTER: llvmpipe
        run: cargo nextest run --locked --no-fail-fast --retries 0 --workspace --features ratatoskr/test-hooks,ferja/test-hooks
      - if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast --workspace --doc --features ratatoskr/test-hooks,ferja/test-hooks
      # gleipnir's test hooks (landlock_omit, abi_cap) must never be on in a build without --features (review M5).
      # The inverted form: the forward `cargo tree` does not show gleipnir's feature even when it is on (Task 0).
      # `shell: bash` adds pipefail (a failed `cargo tree` fails the step), and the tree must name gleipnir at all, so
      # an empty file never passes (gate review S14).
      - name: gleipnir has no test-hooks in a default ratatoskr build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo tree --locked -e features -i gleipnir -p ratatoskr | tee "$RUNNER_TEMP/gleipnir-features.txt"
          grep -q '^gleipnir v' "$RUNNER_TEMP/gleipnir-features.txt"
          if grep -q 'gleipnir feature "test-hooks"' "$RUNNER_TEMP/gleipnir-features.txt"; then
            echo "gleipnir's test-hooks are on in a default build" >&2; exit 1
          fi
      # The gateway speaks HTTP/1.1 over rustls with the ring provider: neither h2 nor aws-lc-sys may be in any
      # target's graph (all kinds of dependencies). `cargo tree -i` prints nothing and fails when the package is not
      # in the graph, which is what we want; any output means it is.
      - name: h2 and aws-lc-sys are not in the tree
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for crate in h2 aws-lc-sys; do
            found=$(cargo tree --locked --workspace --target all -e normal,build,dev -i "$crate" 2>/dev/null || true)
            if [ -n "$found" ]; then echo "$crate is in the dependency tree:" >&2; echo "$found" >&2; exit 1; fi
          done
      # The escape suite, container tier (docs/develop/gleipnir.md, "Proving it"). As root in this container there are
      # no user namespaces to nest, so the full and reduced rows skip with a listed reason ("inside a container",
      # "Landlock ABI N below 9"); what runs is that the rows parse, the probes reach without a sandbox,
      # check-in-a-container, the floor row, path-bwrap-never-run and fail-closed-no-bwrap. Only listed reasons may skip.
      # No --require-all (a skip here is expected); the VM/host jobs below hold the rest.
      - name: escape suite (container tier)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/escape"
          target/debug/gleipnir-escape --ratatoskr target/debug/ratatoskr --probe target/debug/gleipnir-probe \
            --rows crates/hub/gleipnir-escape/rows/any --rows crates/hub/gleipnir-escape/rows/container \
            --report "$RUNNER_TEMP/escape/escape-container.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: escape-report-container
          path: ${{ runner.temp }}/escape/escape-container.json
          if-no-files-found: warn
      # the editor's own CLIs that the personal-notes canary row runs need Emacs
      - name: Nidhogg 31.1 (the Emacs drgnx ships on; in the prebuilt image already)
        id: nidhogg
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$PREBUILT" ]; then bash test/container/nidhogg.sh fedora-45; fi
          /usr/local/bin/nidhogg --version | head -n 1
      # every row against Ratatoskr. --require-all: a skipped row fails the job, except a macOS-only row here and the
      # perf rows (they run below)
      - name: conformance
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.nidhogg.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          target/debug/domr --hub-bin target/debug/ratatoskr \
            --scenarios test/conformance --require-all
      # the build install.sh makes: no test hooks in it, and it says so
      - name: release build says test_hooks false
        id: release
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --release -p ratatoskr -p domr
          target/release/ratatoskr version --json | tee "$RUNNER_TEMP/version.json"
          grep -q '"test_hooks":false' "$RUNNER_TEMP/version.json"
      # a recorded baseline, no budgets (perf regression runs are deferred)
      - name: perf baseline
        id: perf
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          target/release/domr --hub-bin target/release/ratatoskr \
            --scenarios test/conformance --only 'perf/*' --perf perf-linux.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.perf.outcome == 'success' }}
        with:
          name: ratatoskr-perf-linux
          path: perf-linux.json
          if-no-files-found: error
      # last, whatever the tests said: a red test keeps the dependencies the build made
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/cargo-target
        with:
          job: fedora45
          mode: save
          build-outcome: ${{ steps.build.outcome }}
          status: ${{ job.status }}

  msrv:
    name: MSRV 1.95 builds
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-msrv ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      # the toolchain first: its `rustc -V` names the cache's key
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: ./.github/actions/cargo-target
        with:
          job: msrv195
          mode: restore
          toolchain: 1.95.0
      - name: Zig and libghostty-vt's pinned tarballs (the terminal engine's build)
        run: |
          sudo bash test/container/zig.sh linux
          bash crates/hub/ghostty-vt-sys/fetch.sh
      - name: the Wayland client, xkbcommon and pixman headers (skel and ritari link them)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libwayland-dev libxkbcommon-dev libpixman-1-dev
      - id: build
        run: cargo +1.95.0 build --locked --manifest-path Cargo.toml
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/cargo-target
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        with:
          job: msrv195
          mode: save
          build-outcome: ${{ steps.build.outcome }}
          status: ${{ job.status }}

  # The escape suite on the runner itself, no container: the full tier (bubblewrap with user namespaces) and, on the arm64
  # runner (free for public repositories), a real arm64 Linux run of the seccomp tests (GL-T4-2: the aarch64 syscall
  # numbers). Ubuntu 24.04 turns unprivileged user namespaces off through AppArmor, so the job lifts the restriction
  # with sudo (the runner user has passwordless sudo) and installs bubblewrap 0.12.0 (gleipnir's floor; apt has 0.9.0),
  # prebuilt per architecture (`Test images`) or built here.
  # It gates (green on both runners since 74be75cf; a failure here fails the CI gate: docs/develop/ci.md).
  escape-host:
    name: escape suite on the runner (${{ matrix.os }})
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-escape ')) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    # 75 until the build-once redesign (docs: the CI flow redesign, 2026-11-22). Each leg builds the hub three ways
    # (tests, release, the sandbox lane's); on ubuntu-24.04 a green leg took 38.5 minutes, the real-start rows alone
    # 16.5, and the other leg of the same commit was cut at 45 inside them.
    timeout-minutes: 75
    # ubuntu-24.04-arm's runner shut down 4 of 4 times about 3.5 minutes into the hub's test build (rounds 1-2 of PR 5),
    # read as running out of memory; two compile jobs there until the build-once redesign. 4 is the runners' core count.
    env:
      CARGO_BUILD_JOBS: ${{ matrix.os == 'ubuntu-24.04-arm' && '2' || '4' }}
    # Every runner is pinned (never `ubuntu-latest`, which moves to 26.04 by 2026-11-19). The 24.04 legs lift AppArmor's
    # userns restriction with a global sysctl; the 26.04 legs do not: they test the configuration Gleipnir recommends
    # (bubblewrap 0.12.0 as /usr/bin/bwrap, which 26.04's `bwrap-userns-restrict` profile covers).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      # the prebuilt one of this architecture, looked up by the tag of this checkout's .github/ci/bwrap (its one layer,
      # by digest), else built here (build.sh, the image's own recipe: checksum verified, from source). /usr/bin:
      # Gleipnir trusts a bwrap only where root alone can change it, and the runner image makes /usr/local
      # group-writable (Gleipnir rightly refuses /usr/local/bin/bwrap)
      - name: bubblewrap 0.12.0 (prebuilt, or built from source)
        env:
          ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          REF="$(bash .github/ci/ghcr.sh ref drgnx-bwrap "$(bash test/container/image-tag.sh .github/ci/bwrap/Containerfile)-$ARCH")"
          if [ -n "$REF" ]; then
            bash .github/ci/ghcr.sh file "$REF" bwrap "$RUNNER_TEMP/bwrap"
          else
            sh .github/ci/bwrap/build.sh "$RUNNER_TEMP/bwrap"
          fi
          sudo install -m 0755 "$RUNNER_TEMP/bwrap/bwrap" /usr/bin/bwrap
          ls -l /usr/bin/bwrap; /usr/bin/bwrap --version
      - name: user namespaces for unprivileged processes (AppArmor's restriction lifted)
        if: ${{ !startsWith(matrix.os, 'ubuntu-26.04') }}
        run: |
          uname -r
          cat /sys/kernel/security/lsm; echo
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true
          bwrap --unshare-all --ro-bind / / true
      # 26.04, no sysctl: what the kernel and the profile say about unprivileged user namespaces, for the report
      - name: user namespaces as the image ships them
        if: ${{ startsWith(matrix.os, 'ubuntu-26.04') }}
        run: |
          uname -r
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true
          /usr/bin/bwrap --unshare-all --ro-bind / / true && echo "bwrap: user namespaces work" || echo "bwrap: refused (exit $?)"
      - run: bash .github/ci/rust.sh
      # one cache for the job's builds (the escape suite's and the agent core's tests), saved at its end. One entry an
      # architecture, shared by its 24.04 and 26.04 legs and saved by the 24.04 one (the oldest glibc, as the build-once
      # design's x64-build): four entries of 2.7 GB each would not fit the repository's 10 GB beside the others
      - uses: ./.github/actions/cargo-target
        with:
          job: escape
          mode: restore
      # the seccomp real-install cases and everything else of the three Linux crates, on this architecture
      - run: cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p gleipnir -p draugr -p eitri -p gleipnir-escape
      # eitri's trust checks chown their fixtures: they run as root, in a target dir of their own (root's files stay out of
      # target and its cache), and DRGNX_REQUIRE_ROOT_TESTS turns a skipped one into a failure
      - name: eitri's trust tests as root
        run: sudo env "PATH=$PATH" "HOME=$HOME" DRGNX_REQUIRE_ROOT_TESTS=1 "CARGO_HOME=$HOME/.cargo" cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p eitri --target-dir "$RUNNER_TEMP/eitri-root-target"
      # ghostty-vt-sys's builds_offline builds the crate in a network namespace of its own (unshare --net): a runner can,
      # Docker's default seccomp profile (the Fedora job's container) refuses it, so this is where the row runs;
      # DRGNX_REQUIRE_NETNS=1 makes a namespace it cannot make a failure rather than a skip. (Zig is the terminal
      # engine's build tool; the pinned tarballs come from fetch.sh)
      - name: ghostty-vt-sys builds offline, in a network namespace
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' }}
        env:
          DRGNX_REQUIRE_NETNS: "1"
        run: |
          sudo bash test/container/zig.sh linux
          bash crates/hub/ghostty-vt-sys/fetch.sh
          cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p ghostty-vt-sys --test link_rows builds_offline -- --exact
      - id: build
        if: ${{ !cancelled() }}
        run: cargo build --locked --manifest-path Cargo.toml -p ratatoskr -p gleipnir-escape --features ratatoskr/test-hooks
      # No --require-all: a Landlock ABI below 9 skips the reduced rows ("Landlock ABI N below 9"), as the harness lists.
      - name: escape suite (full tier on the runner)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/escape"
          target/debug/gleipnir-escape --ratatoskr target/debug/ratatoskr \
            --probe target/debug/gleipnir-probe \
            --rows crates/hub/gleipnir-escape/rows/linux --rows crates/hub/gleipnir-escape/rows/any \
            --report "$RUNNER_TEMP/escape/escape-${{ runner.arch }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: escape-report-host-${{ matrix.os }}
          path: ${{ runner.temp }}/escape/escape-${{ runner.arch }}.json
          if-no-files-found: warn
      # The agent core's sandbox lane (agent system part 1): the tests marked #[ignore] because they need the real
      # bubblewrap (exec runs in the starter's sandbox). The provider and gateway rows of tests/launch_sandboxed.rs
      # run domr's ratatoskr-mock (the mock LLM), which they find beside the ratatoskr binary: built first.
      # The debug adapters the ignored debug rows (tests_blocked_live, tests_fork_live) run against, at the hub's pins:
      # the lane runs every ignored test of the crate, so it has them (a lane without them reads red on them). Not
      # skipped by an earlier step's failure (the unit step above): the rows would then fail on a missing adapter that
      # is no fault of theirs.
      - name: debug adapters (debugpy and js-debug at the hub's pins)
        if: ${{ !cancelled() }}
        run: bash .github/ci/debug-adapters.sh "$RUNNER_TEMP/debug-adapters" >> "$GITHUB_ENV"
      # a JS fork's origin trail finds the stores to log with the JavaScript grammar (origin::stores): without the
      # pack-built grammars the lane's tests_fork_live JS row traces nothing and its trail comes back empty
      - name: Pack grammars for the tests
        if: ${{ !cancelled() }}
        run: |
          line="$(bash test/packs/hub-grammars.sh "$RUNNER_TEMP/hub-grammars" | grep '^export DRGNX_PACK_LOCK=')"
          eval "$line"
          echo "DRGNX_PACK_LOCK=$DRGNX_PACK_LOCK" >> "$GITHUB_ENV"
          echo "DRGNX_PACK_GRAMMARS=$DRGNX_PACK_GRAMMARS" >> "$GITHUB_ENV"
      - name: build the agent core's tests (test hooks)
        id: core-build
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --manifest-path Cargo.toml -p domr --bin ratatoskr-mock
          cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p ratatoskr --features ratatoskr/test-hooks --no-run
      # Landlock ABI 9 is the reduced tier's floor; on a runner kernel below it the launch rows of the reduced tier run
      # on the full tier (tests/launch_sandboxed.rs), which needs bubblewrap 0.12 only. --no-fail-fast: every test
      # binary's failures in one run. The crate's timing rows (#[ignore = "timing: …"], test/timing-rust.txt) are
      # ignored too, but they are the timing lane's: a debug build on a shared runner judges no budget, so they are skipped.
      # The agent browser's rows (tests/browser_sandboxed.rs) need Landlock ABI 9 on both tiers, which these runners'
      # Linux 7.0 lacks (ABI 8): they run in the Fedora 45 VM of the next step instead (x64 only), by the names their
      # binary lists.
      - name: agent core, sandbox lane (--ignored)
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' }}
        run: |
          skips=$(sed 's/#.*//' test/timing-rust.txt | awk '$1 == "ratatoskr" { printf " --skip %s", $3 }')
          vm=$(cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p ratatoskr --features ratatoskr/test-hooks --test sandbox -- --list --format terse --ignored browser_sandboxed:: | sed -n 's/: test$//p')
          [ -n "$vm" ] || { echo "browser_sandboxed lists no rows" >&2; exit 1; }
          skips="$skips$(printf '%s\n' "$vm" | awk '{ printf " --skip %s", $1 }')"
          # the Mac runner's end-to-end rows (tests/mac_runner.rs) need a Mac's ssh account (DRGNX_TEST_MAC_RUNNER): the
          # macOS lane's `mac-runner` job runs them
          skips="$skips --skip mac_runner::"
          # the generated ssh config against a localhost sshd (tests/macos.rs) needs the macOS lane's Remote Login
          # (DRGNX_TEST_SSHD_HOST, .github/ci/macos-sshd.sh): that lane runs it
          skips="$skips --skip macos::the_generated_config_against_a_localhost_sshd"
          # the debug rows that run in the `debug-live` job instead (the adapter image's adapters, CAP_SYS_PTRACE, a
          # network namespace of its own): tests_live_adapters and tests_blocked_live. tests_fork_live, the Python and JS
          # forks in the sandbox, runs here against the adapters installed above
          skips="$skips --skip debug::tests_live_adapters --skip debug::tests_blocked_live"
          # the live notebook rows (a real ipykernel, hash-pinned for the adapter image's Python 3.15, which a runner's
          # Python is not) run in the `debug-live` job as well
          skips="$skips --skip notebook::kernel::tests_live"
          cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p ratatoskr --features ratatoskr/test-hooks -- --ignored --test-threads 1 $skips
      # The agent browser's rows where they can run: a Fedora 45 VM on the x64 runners (Linux 7.1 or later, Landlock ABI 9
      # or later, as the Fedora hosts drgnx supports have), booted under QEMU with KVM by .github/ci/browser-vm.sh, with
      # this job's bubblewrap and the binaries copied in at their own paths (the test binary names its data and the hub by
      # their absolute paths). docs/develop/ci.md, "The browser rows in a VM"
      - name: the agent browser's rows in a Fedora 45 VM (Landlock ABI 9)
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' && runner.arch == 'X64' }}
        run: |
          bin=$(cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p ratatoskr --features ratatoskr/test-hooks --test sandbox --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .executable != null and .target.name == "sandbox" and (.target.kind | index("test"))) | .executable')
          # the build also reports the ratatoskr bin (the test depends on it): exactly one path must be the test binary
          [ -n "$bin" ] && [ "$(printf '%s\n' "$bin" | wc -l)" = 1 ] || { echo "expected one sandbox test binary, got: ${bin:-none}" >&2; exit 1; }
          t=$PWD/target/debug
          bash .github/ci/browser-vm.sh up "$RUNNER_TEMP/vm"
          bash .github/ci/browser-vm.sh put "$RUNNER_TEMP/vm" /usr/bin/bwrap "$t/ratatoskr" "$t/gleipnir-probe" "$t/ratatoskr-mock" \
            "$PWD/crates/hub/ratatoskr/tests/data" "$bin"
          bash .github/ci/browser-vm.sh run "$RUNNER_TEMP/vm" "cd '$PWD' && '$bin' --ignored --test-threads 1 browser_sandboxed::"
      # The arm runners have no KVM, and an emulated guest never answered within 20 minutes. The rows' only arm64-specific
      # part, the browser host's seccomp filter, is installed for real by gleipnir's own tests above
      # (`installed_filter_denies`, its `browser-` cases); the rest is the same code as on x64, whose VM runs it.
      - name: the agent browser's rows skip on arm64 (Landlock ABI 8 here; they run in the x64 legs' VM)
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' && runner.arch == 'ARM64' }}
        run: |
          echo "::notice title=browser rows skipped::the arm runners have no KVM for the Fedora 45 VM and boot Linux $(uname -r), whose Landlock ABI the browser's rows need at 9 or later: tests/browser_sandboxed.rs runs in the x64 legs' VM"
      # The real-start rows (docs/develop/runtime.md, "The real-start rows"): a release hub, no test hooks, so each
      # agents/start goes through the real launch, Gleipnir's validation and bwrap. --require-all: a row that cannot
      # start sandboxed fails here; the browser row is an excused skip on this runner (no Chromium, and a Landlock ABI
      # below 9), as is the internet row.
      - name: real-start rows (release hub)
        if: ${{ !cancelled() && steps.core-build.outcome == 'success' }}
        run: |
          cargo build --locked --release --manifest-path Cargo.toml -p ratatoskr -p domr
          target/release/domr --hub-bin target/release/ratatoskr \
            --scenarios test/conformance --only 'real-start/*' --require-all
      # last, whatever the tests said
      - if: ${{ !cancelled() && !startsWith(matrix.os, 'ubuntu-26.04') }}
        uses: ./.github/actions/cargo-target
        with:
          job: escape
          mode: save
          build-outcome: ${{ steps.build.outcome == 'success' && 'success' || steps.core-build.outcome }}
          status: ${{ job.status }}

  # The agent core's container rows (agent system part 1, Tasks 11b/11c): a container job runs only an allowed image,
  # with only its worktree mounted, inside its caps, and every escape row is refused. GitHub's Ubuntu runners ship
  # podman; the rows pull busybox (digest-pinned at run time) and skip without podman. 26.04, not 24.04: the hub needs
  # podman 5 (`podman pull --policy`, networked jobs), and 24.04's is 4.9.
  # The debug rows that need the adapter image (docs/develop/debugging.md, "Live adapters: the image") and a network
  # namespace of their own: tests_live_adapters starts delve, CodeLLDB, lldb-dap, debugpy and js-debug for real (the
  # native debuggers trace their debuggee, so the container has CAP_SYS_PTRACE), and tests_blocked_live asserts that
  # every TCP listener in the namespace is in its port block, which a shared runner's never are: a job container's
  # namespace is ours. The Python and JS fork rows (tests_fork_live) need bubblewrap and run in escape-host's sandbox lane. It runs with
  # rt-linux, whose image it takes (and whose test build it will take).
  debug-live:
    name: live debug adapters (Fedora 45, the adapter image's adapters)
    needs: images
    if: ${{ !cancelled() && github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-linux ')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container: >-
      ${{ needs.images.outputs.rust
      && fromJSON(format('{{"image":"{0}","options":"--init --cap-add SYS_PTRACE","credentials":{{"username":"{1}","password":"{2}"}}}}',
      needs.images.outputs.rust, github.actor, github.token))
      || fromJSON('{"image":"registry.fedoraproject.org/fedora:45","options":"--init --cap-add SYS_PTRACE"}') }}
    timeout-minutes: 45
    env:
      PREBUILT: ${{ needs.images.outputs.rust }}
    steps:
      - name: git for the checkout (in the prebuilt image already)
        if: ${{ env.PREBUILT == '' }}
        working-directory: /
        run: dnf -y install git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Tools (in the prebuilt image already)
        if: ${{ env.PREBUILT == '' }}
        working-directory: ${{ github.workspace }}
        run: sh test/container/rust-packages.sh
      - name: Zig (in the prebuilt image already; the terminal engine's build tool)
        if: ${{ env.PREBUILT == '' }}
        working-directory: ${{ github.workspace }}
        run: bash test/container/zig.sh linux
      - name: libghostty-vt's pinned tarballs (build.rs never downloads)
        working-directory: ${{ github.workspace }}
        run: bash crates/hub/ghostty-vt-sys/fetch.sh
      - name: the adapter image's adapters (debugpy, delve, js-debug, lldb-dap, CodeLLDB, at their pins)
        working-directory: ${{ github.workspace }}
        run: bash test/container/debug-adapters-image.sh
      # lldb-dap's launches set disableASLR: false, since a container may not turn address randomisation off
      # the adapter image's ipykernel (the step above makes /opt/nb-kernel) is the live notebook rows' kernel
      - name: debug::tests_live_adapters, debug::tests_blocked_live and notebook::kernel::tests_live (--ignored)
        env:
          DRGNX_NB_KERNEL_PYTHON: /opt/nb-kernel/bin/python3
        run: cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p ratatoskr --features ratatoskr/test-hooks --lib -- --ignored --test-threads 1 debug::tests_live_adapters debug::tests_blocked_live notebook::kernel::tests_live

  agent-containers:
    name: agent core container rows (podman)
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-containers ')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - run: podman --version
      - run: bash .github/ci/rust.sh
      - uses: ./.github/actions/cargo-target
        with:
          job: agent-containers
          mode: restore
      # + the relay sidecar a job granted network runs, static (as `drgnx runtime build` makes it: its own target dir)
      # and beside the hub under the name the hub looks for (ferja::image::binary_for); and drgnx-key the same way,
      # the entrypoint of a keyed container job (exec::keys::static_key_name)
      - id: build
        run: |
          cargo build --locked --manifest-path Cargo.toml -p ratatoskr -p domr --features ratatoskr/test-hooks
          cargo build --locked --manifest-path Cargo.toml -p sleipnir --no-default-features --bin drgnx-key
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --manifest-path Cargo.toml -p ferja --bin drgnx-px --target x86_64-unknown-linux-musl --target-dir target/fwd
          cp target/fwd/x86_64-unknown-linux-musl/debug/drgnx-px target/debug/drgnx-px-x86_64-linux-musl
          cargo build --locked --manifest-path Cargo.toml -p sleipnir --no-default-features --bin drgnx-key --target x86_64-unknown-linux-musl --target-dir target/fwd
          cp target/fwd/x86_64-unknown-linux-musl/debug/drgnx-key target/debug/drgnx-key-x86_64-linux-musl
      # sleipnir in jobq's shape (`linux,sync`: docs/develop/sleipnir.md) builds static too, in the same musl target dir
      - if: ${{ !cancelled() }}
        run: cargo build --locked --manifest-path Cargo.toml -p sleipnir --no-default-features --features linux,sync --target x86_64-unknown-linux-musl --target-dir target/fwd
      # The runner's user has no systemd user session, so rootless podman would fall back to cgroupfs and drop the
      # caps (the hub refuses container jobs then: exec/container.rs, check_limits). Lingering starts the user's
      # systemd; the hub's podman reaches it over the session bus (domr passes DBUS_SESSION_BUS_ADDRESS through).
      - name: a systemd user session for podman
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          timeout 60 sh -c "until [ -S /run/user/$uid/bus ]; do sleep 0.5; done"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR=/run/user/$uid DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus \
            podman info --format '{{.Host.CgroupsVersion}} {{.Host.CgroupManager}} {{.Host.CgroupControllers}}'
      # --require-all: a skipped container row fails here (podman is on the runner)
      - name: container and container-escape rows
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          target/debug/domr --hub-bin target/debug/ratatoskr \
            --scenarios test/conformance --only 'container*/*' --require-all
      # the runner bundles of both architectures, static (xtask/runner-bundle.sh, docs/develop/sleipnir.md),
      # and the x86_64 one run in an image of another libc (Alpine's musl, pinned by the digest pulled now)
      - name: runner bundles, and the bundle in a musl image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          bash xtask/runner-bundle.sh --arch x86_64
          bash xtask/runner-bundle.sh --arch aarch64
          podman pull -q docker.io/library/alpine:3.22
          img="docker.io/library/alpine@$(podman image inspect docker.io/library/alpine:3.22 --format '{{.Digest}}')"
          DRGNX_TEST_BUNDLE="$PWD/target/bundle/x86_64" DRGNX_TEST_FOREIGN_IMAGE="$img" \
            cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p sleipnir --test bundle_host -- --ignored
      # the sidecar's tar imported by podman, and the image run (the bundle above holds drgnx-px-<arch>-linux-musl)
      - name: the relay sidecar's image runs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          DRGNX_TEST_PX_DIR="$PWD/target/bundle/x86_64" \
            cargo test --locked --manifest-path Cargo.toml -p ferja --lib --no-fail-fast -- --ignored an_imported_image_runs_px
      # last, whatever the rows said
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/cargo-target
        with:
          job: agent-containers
          mode: save
          build-outcome: ${{ steps.build.outcome }}
          status: ${{ job.status }}

  # The fake fleet (test/runners/README.md): containers with sshd and rootless podman inside, as SSH runners. On demand
  # only until the spike's verdict is in (`only: rt-fleet`); it is never part of a push's gate.
  fleet:
    name: fake runner fleet
    if: ${{ github.event_name == 'workflow_dispatch' && contains(format(' {0} ', inputs.only), ' rt-fleet ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRGNX_ORG: ${{ github.workspace }}
      DRGNX_FLEET_HOST_RUSTC: "1"
      DRGNX_FLEET_HUB_IMAGE: localhost/drgnx-fake-runner:f45   # built by `up`; has the ssh client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: podman --version
      - run: bash .github/ci/rust.sh
      - name: runners up
        run: bash test/runners/fleet.sh up --runners 2
      - name: the spike's checks in every runner
        run: bash test/runners/fleet.sh s1
      - name: linger over ssh
        run: bash test/runners/fleet.sh check-linger
      - name: down
        if: ${{ always() }}
        run: bash test/runners/fleet.sh down

  # The Android type-check (Android is not a target; the door stays open: docs/develop/runtime.md). The fake C compiler
  # is for urdr's bundled SQLite: a type-check does not link.
  android:
    name: Android type-check
    if: ${{ github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-android ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC_aarch64_linux_android: /usr/bin/true
      AR_aarch64_linux_android: /usr/bin/true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - run: bash .github/ci/rust.sh --target aarch64-linux-android --component clippy
      - uses: ./.github/actions/cargo-target
        with:
          job: android
          mode: restore
      # + the runner's protocol and sync alone: the shape jobq and the Android door take (docs/develop/sleipnir.md)
      - id: build
        run: |
          cargo check --locked --manifest-path Cargo.toml --target aarch64-linux-android -p runstav -p draugr -p eitri -p gleipnir -p huginn -p heimdall -p ratatoskr -p forseti
          cargo check --locked --manifest-path Cargo.toml --target aarch64-linux-android -p sleipnir --no-default-features --features proto,sync
          # the terminal worker without its engine until the NDK link row passes (docs/develop/terminal.md)
          cargo check --locked --manifest-path Cargo.toml --target aarch64-linux-android -p glugg --no-default-features
      # the pure-Rust crates' tests too: only clippy's test build shows code that is dead on Android (gate review M21)
      - if: ${{ !cancelled() }}
        run: |
          cargo clippy --locked --manifest-path Cargo.toml --target aarch64-linux-android --all-targets -p runstav -p draugr -p eitri -p gleipnir -p mimir -p bifrost -p huginn -p heimdall -p forseti -- -D warnings
          cargo clippy --locked --manifest-path Cargo.toml --target aarch64-linux-android --all-targets -p sleipnir --no-default-features --features proto,sync -- -D warnings
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/cargo-target
        with:
          job: android
          mode: save
          build-outcome: ${{ steps.build.outcome }}
          status: ${{ job.status }}

  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    if: ${{ !inputs.only || contains(format(' {0} ', inputs.only), ' rt-deny ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - name: cargo-deny 0.20.2 (checksum verified)
        run: |
          url=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          sha256=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -fsSL -o "$RUNNER_TEMP/cargo-deny.tgz" "$url"
          echo "$sha256  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tgz" -C "$RUNNER_TEMP" --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash .github/ci/rust.sh   # cargo-deny reads the workspace with cargo metadata
      - run: cargo-deny --manifest-path Cargo.toml check

  # libFuzzer targets on the pinned nightly (the ledger's: nightly-2026-10-15, cargo-fuzz 0.13.2). The ubuntu runner has
  # g++ for libfuzzer-sys. 10 minutes a target nightly, `fuzz_minutes` when dispatched; a pull request runs none, and
  # main's push (the cache run) only builds them. A crash uploads its input. The targets are built once (`fuzz-build`: `cargo fuzz build`,
  # the build `cargo fuzz run` makes) and the four shards of `cargo fuzz list`'s targets each download their own and
  # run them as `cargo fuzz run` does, so a nightly takes about 70 minutes, and a new target runs with no change here.
  fuzz-build:
    name: fuzz targets (build)
    if: ${{ github.event_name != 'pull_request' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-fuzz ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIGHTLY: nightly-2026-10-15
      # its runner shut down 2 of 2 push runs mid-build (PR 5), read as running out of memory: two compile jobs
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      # the key names the nightly (its `rustc -V`) and the cargo-fuzz version (the step below), so a bump is a new cache;
      # the entry holds the built cargo-fuzz and its own registry. A shallow checkout: no commit times
      - uses: ./.github/actions/cargo-target
        with:
          job: fuzz-cargo-fuzz-0.13.2
          mode: restore
          toolchain: ${{ env.NIGHTLY }}
          lock: crates/hub/hrista/Cargo.lock
          target: crates/hub/hrista/target
          registry: "false"
          commit-times: "false"
          paths: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
      - name: cargo-fuzz 0.13.2
        id: tool
        run: test -x ~/.cargo/bin/cargo-fuzz || cargo "+$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      # every target (release, debug assertions, AddressSanitizer: cargo-fuzz's defaults, as `cargo fuzz run` builds),
      # then each shard's binaries and list in a directory of its own (the shard's artifact)
      - name: Build every target
        id: build
        run: |
          cargo "+$NIGHTLY" fuzz build --fuzz-dir crates/hub/hrista
          out="crates/hub/hrista/target/$(rustc "+$NIGHTLY" -vV | sed -n 's/^host: //p')/release"
          for shard in 0 1 2 3; do mkdir -p "$RUNNER_TEMP/fuzz-bins/$shard"; done
          cargo "+$NIGHTLY" fuzz list --fuzz-dir crates/hub/hrista | sort | awk '{ print > (ENVIRON["RUNNER_TEMP"] "/fuzz-bins/" (NR % 4) "/targets") }'
          for shard in 0 1 2 3; do
            while read -r target; do cp "$out/$target" "$RUNNER_TEMP/fuzz-bins/$shard/"; done < "$RUNNER_TEMP/fuzz-bins/$shard/targets"
          done
          du -sh "$RUNNER_TEMP"/fuzz-bins/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-bins-0
          path: ${{ runner.temp }}/fuzz-bins/0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-bins-1
          path: ${{ runner.temp }}/fuzz-bins/1
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-bins-2
          path: ${{ runner.temp }}/fuzz-bins/2
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-bins-3
          path: ${{ runner.temp }}/fuzz-bins/3
          if-no-files-found: error
          retention-days: 1
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/cargo-target
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY }}
        with:
          job: fuzz-cargo-fuzz-0.13.2
          mode: save
          build-outcome: ${{ steps.build.outcome }}
          status: ${{ job.status }}
          manifest: crates/hub/hrista/Cargo.toml
          target: crates/hub/hrista/target
          registry: "false"
          commit-times: "false"
          paths: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index
            ~/.cargo/registry/cache

  # A consumer of fuzz-build's artifacts: it runs (and fails) when that build failed. Not on a pull request, and not on
  # main's push, which only builds and saves the caches (the daily run fuzzes main).
  fuzz:
    name: fuzz (shard ${{ matrix.shard }} of 4)
    needs: fuzz-build
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-fuzz ')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      EVENT: ${{ github.event_name }}
      MINUTES: ${{ inputs.fuzz_minutes }}
    steps:
      # the committed inputs (crates/hub/hrista/corpus) and the lock the corpus key hashes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            crates/hub/hrista
            .github/actions
            .github/ci
      - name: How long
        run: |
          case "$EVENT" in
            schedule) secs=600 ;;
            workflow_dispatch) m=${MINUTES:-10}; case "$m" in ''|*[!0-9]*) echo "fuzz_minutes is a whole number" >&2; exit 2 ;; esac; secs=$((m * 60)) ;;
            *) secs=60 ;;
          esac
          echo "FUZZ_SECONDS=$secs" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-bins-${{ matrix.shard }}
          path: ${{ runner.temp }}/fuzz-bins
      # the corpora the fuzzers grew (crates/hub/hrista/corpus/TARGET, beside the committed inputs; a file's name is its
      # hash, so an old one restored over a committed one is the same input): a longer run starts where the last
      # stopped. More inputs only reach further; a corpus cannot turn a crash into a pass. Grown by the daily run and
      # main only, restored everywhere.
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/hub/hrista/corpus
          key: fuzz-corpus-${{ matrix.shard }}-${{ hashFiles('crates/hub/hrista/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.shard }}-
      # every target of the shard runs, whatever an earlier one found; the step fails at the end naming each that failed.
      # As `cargo fuzz run` runs it: its artifact prefix and corpus directory, ASan without the ODR check
      - name: Run each target
        id: run
        run: |
          failed=""
          bins="$RUNNER_TEMP/fuzz-bins"
          targets=$(cat "$bins/targets")
          test -n "$targets"
          for target in $targets; do
            echo "::group::$target ($FUZZ_SECONDS s)"
            chmod +x "$bins/$target"
            mkdir -p "crates/hub/hrista/corpus/$target" "crates/hub/hrista/artifacts/$target"
            ASAN_OPTIONS="${ASAN_OPTIONS:+$ASAN_OPTIONS:}detect_odr_violation=0" "$bins/$target" \
              "-artifact_prefix=crates/hub/hrista/artifacts/$target/" "-max_total_time=$FUZZ_SECONDS" "crates/hub/hrista/corpus/$target" ||
              failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed" >&2; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes-${{ matrix.shard }}
          path: crates/hub/hrista/artifacts
          if-no-files-found: ignore
      # saved by the daily run (main) and by the writer runs (cache-policy: a manual run on main, ci/* or
      # scratch/drgnx-mac-rounds), after the targets ran, whatever they found; never by a pull request
      - id: corpus-policy
        if: ${{ !cancelled() && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') }}
        uses: ./.github/actions/cache-policy
        with:
          build-outcome: success
      - if: ${{ !cancelled() && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') && (steps.corpus-policy.outputs.save == 'true' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/hub/hrista/corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}

  # macOS 27 runs as four jobs at once (of the five macOS slots), each well inside its 45 minutes: one job ran all
  # of it in about 105 (tests 19 min, conformance 21, the release build and perf 20, the builds between). Each job
  # sets itself up through .github/actions/macos-runtime and builds what it runs; the target cache (one entry, `macos-dev`) shares the compiled crates
  # between them. docs/develop/ci.md
  macos:
    name: tests (macOS 27)
    needs: images
    if: ${{ !cancelled() && github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-macos ')) }}
    runs-on: xcode-27
    permissions:
      contents: read
      packages: read      # the prebuilt assets (drgnx-assets)
    # 90 until the build-once redesign (docs: the CI flow redesign, 2026-11-22). The test build alone took 17 minutes
    # with a warm compiler cache from a run of the same commit, and was cut at 45 after 43 without it (the pull
    # request's run)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # the whole history, for commit-times.sh
          filter: blob:none       # without old file contents
          persist-credentials: false
      - uses: ./.github/actions/macos-runtime
        with:
          assets: ${{ needs.images.outputs.assets }}
      # The dependencies' debug info is line tables only: file and line in a backtrace, without each crate's full
      # DWARF, which is a large part of a cold build's compile and link time. The workspace's crates keep full debug
      # info, so a debugger session on a Mac still steps through drgnx's code (the test profile inherits the dev one's)
      - name: dependencies' debug info is line tables only
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '[profile.dev.package."*"]\ndebug = "line-tables-only"\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # --no-fail-fast: every crate's failures in one run (no Mac to try them on before CI). No GPU adapter is named: the
      # GPU tests are ignored on macOS (the runner has no GPU; Metal parity is a real Mac's)
      # The build first, on its own: its time apart from the tests', and the list of test binaries (test-bins.json) the
      # later steps run as they are. Every step after it reuses this build: another feature set (`-p` alone resolves
      # one) or another profile would rebuild the hub, four minutes a step on a cold runner. --timings: where a cold
      # build's time goes (the `cargo-timings` artifact), before the job is split any further. skel and ritari
      # are the Wayland shell and its test compositor (libwayland, Smithay): Linux only; macOS gets its own shell later
      # (D8), so every step of this job leaves them out the same way
      - id: build
        run: |
          cargo test --locked --no-fail-fast --manifest-path Cargo.toml --workspace --exclude skel --exclude ritari --features ratatoskr/test-hooks \
            --no-run --timings --message-format=json-render-diagnostics > "$RUNNER_TEMP/test-bins.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cargo-timings-macos
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: warn
      # the hub parses code with the pack-built grammars: built once with the build's own hub (the pack job, `packs sync
      # --builtin`, as the Linux job does with cargo run) and handed to the tests as DRGNX_PACK_LOCK / DRGNX_PACK_GRAMMARS
      - name: Pack grammars for the tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          [ -x target/debug/ratatoskr ] || { echo "::error::the build made no hub binary"; exit 1; }
          line="$(RATATOSKR="$PWD/target/debug/ratatoskr" bash test/packs/hub-grammars.sh "$RUNNER_TEMP/hub-grammars" | grep '^export DRGNX_PACK_LOCK=')"
          eval "$line"
          echo "DRGNX_PACK_LOCK=$DRGNX_PACK_LOCK" >> "$GITHUB_ENV"
          echo "DRGNX_PACK_GRAMMARS=$DRGNX_PACK_GRAMMARS" >> "$GITHUB_ENV"
      # Each test binary of the build, as cargo test runs them (from its package's folder, in the build's order, every
      # one whatever the others said), each under its own bound: a binary that hangs is stopped and named, and the rest
      # still run (the slowest, the hub's lib, takes about 3 minutes). The `Running` lines are cargo's, for the step
      # after it (tests.log); the doc tests after them through cargo
      - id: test
        env:
          PER_BINARY_SECONDS: "600"
        run: |
          set +e -o pipefail
          export CARGO; CARGO=$(command -v cargo)
          (
            rc=0
            while IFS=$'\t' read -r src manifest bin; do
              dir=$(dirname "$manifest")
              echo "     Running ${src#"$dir"/} ($bin)"
              # macOS has no timeout(1): perl runs the binary in a process group of its own and at the bound kills the
              # group (exit 142), so a child the binary started cannot keep the log's pipe open
              (cd "$dir" && perl -e '
                my $t = shift; my $pid = fork // die "fork: $!";
                if ($pid == 0) { setpgrp(0, 0); exec @ARGV or die "exec: $!" }
                $SIG{ALRM} = sub { kill "KILL", -$pid; waitpid($pid, 0); exit 142 };
                alarm $t; waitpid($pid, 0); alarm 0;
                exit($? & 127 ? 128 + ($? & 127) : $? >> 8);' "$PER_BINARY_SECONDS" "$bin")
              r=$?
              if [ "$r" -eq 142 ]; then
                echo "::error::${bin##*/} ran past its $PER_BINARY_SECONDS s and was stopped"
                echo "- \`${bin##*/}\` ran past its $PER_BINARY_SECONDS s and was stopped" >> "$GITHUB_STEP_SUMMARY"
              fi
              [ "$r" -eq 0 ] || rc=1
            done < <(jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null)
                       | [.target.src_path, .manifest_path, .executable] | @tsv' "$RUNNER_TEMP/test-bins.json")
            exit $rc
          ) 2>&1 | tee "$RUNNER_TEMP/tests.log"
          rc=$?
          cargo test --locked --no-fail-fast --manifest-path Cargo.toml --workspace --exclude skel --exclude ritari --features ratatoskr/test-hooks \
            --doc 2>&1 | tee -a "$RUNNER_TEMP/tests.log" || rc=1
          exit $rc
      # A crash report from a macOS row reads the line tables: one panic's full backtrace names a file and a line in
      # drgnx's frames (full debug info) and in a dependency's (tokio's, line tables only)
      - name: a backtrace names files and lines
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bin=$(jq -r 'select(.profile.test == true and .target.name == "draugr" and (.target.kind | index("lib"))) | .executable' \
            "$RUNNER_TEMP/test-bins.json" | tail -n 1)
          [ -x "$bin" ] || { echo "::error::no test binary for draugr's lib"; exit 1; }
          out=$(cd crates/hub/draugr && RUST_BACKTRACE=full "$bin" --exact spawn::tests::a_hubs_listening_socket_is_never_passed --nocapture 2>&1)
          echo "$out" | tail -n 80
          grep -qE 'at .*draugr/src/spawn\.rs:[0-9]+' <<< "$out" || { echo "::error::draugr's frames name no file and line"; exit 1; }
          grep -qE 'at .*/tokio-[0-9][^/]*/src/.*\.rs:[0-9]+' <<< "$out" || { echo "::error::tokio's frames name no file and line"; exit 1; }
      # The hub's lib's failures, each run again alone with its output (--exact --nocapture): which fail only beside
      # the others, and each one's whole message, in the job's summary. Seconds, where running the whole lib one test at a
      # time again took six minutes and cut the job at its 45 (round 4). When the lib's binary died instead (no `test
      # result` line in its part of the run: a signal; wasmtime's SIGABRT was one), the lib runs one test at a time,
      # which names the test running when it dies (libtest prints a name before it runs it on one thread), and the
      # crash report of this run's binary, written after the step started, is printed: an abort libsystem raises says
      # why only there (os_log, not stderr)
      - name: the hub's lib's failures, each alone
        if: ${{ !cancelled() && steps.test.outcome == 'failure' }}
        run: |
          set +e
          : > lib-serial.start
          # the lib's binary the workspace build made (test-bins.json), run from the crate's folder as cargo runs it
          bin=$(jq -r 'select(.profile.test == true and .target.name == "ratatoskr" and (.target.kind | index("lib"))) | .executable' \
            "$RUNNER_TEMP/test-bins.json" | tail -n 1)
          [ -x "$bin" ] || { echo "::error::no test binary for the hub's lib"; exit 1; }
          run() { (cd crates/hub/ratatoskr && "$bin" "$@"); }
          # the lib's part of the workspace run: from its `Running unittests src/lib.rs (…/ratatoskr-…)` on
          awk -v b="${bin##*/}" '/^ *Running /{on = index($0, b) > 0} on' "$RUNNER_TEMP/tests.log" > lib-run.log
          if grep -q '^test result: ' lib-run.log; then
            rc=0
            for name in $(sed -nE 's/^test (.*) \.\.\. FAILED$/\1/p' lib-run.log); do
              echo "--- $name alone"
              run --exact "$name" --nocapture --test-threads 1; r=$?
              echo "- \`$name\` alone: exit $r" >> "$GITHUB_STEP_SUMMARY"
              [ "$r" -eq 0 ] || rc=1
            done
            exit $rc
          fi
          run --test-threads 1 --nocapture > lib-serial.log 2>&1
          rc=$?
          tail -n 40 lib-serial.log
          last=$(grep -E '^test .* \.\.\. ' lib-serial.log | tail -n 1)
          echo "- the hub's lib died; one at a time: exit $rc; last line: \`${last:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          # ReportCrash writes the report a few seconds after the process dies; its name is the binary's and the time
          for _ in $(seq 30); do
            ips=$(find "$HOME/Library/Logs/DiagnosticReports" -name "${bin##*/}-*.ips" -newer lib-serial.start 2>/dev/null | sort | tail -n 1)
            [ -n "$ips" ] && break
            sleep 1
          done
          echo "--- the crash report of ${bin##*/} in this run: ${ips:-none}"
          [ -n "$ips" ] && head -c 60000 "$ips"
          exit 1
      # The terminal worker's peer check on a Mac (getpeereid): the workspace run above checks that this user's
      # connection is served; another uid's needs root, so the same test runs again under sudo (the runner's user has
      # passwordless sudo), and a run that did not check (no root) fails. The worker's log goes to the job's log.
      - name: a terminal worker drops another uid's connection (getpeereid, as root)
        if: ${{ !cancelled() }}
        run: |
          bin=$(jq -r 'select(.profile.test == true and .target.name == "it" and (.manifest_path | endswith("/crates/hub/glugg/Cargo.toml"))) | .executable' "$RUNNER_TEMP/test-bins.json" | tail -n 1)
          [ -x "$bin" ] || { echo "::error::no test binary for drgnx-term's integration tests"; exit 1; }
          out=$(sudo env RUST_LOG=debug "$bin" --exact running::the_socket_is_private_and_another_uid_is_dropped --nocapture 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if grep -q "not checked" <<< "$out"; then echo "::error::another uid's connection was not checked"; exit 1; fi
      # The hub on a Mac: the runner rows of tests/macos.rs ran above with the workspace; this is the one that needs a
      # real sshd. Remote Login on with a throwaway key (.github/ci/macos-sshd.sh), then the generated ssh config and
      # the transport against it. The key's folder is removed with the step, whatever it said.
      - name: the generated ssh config against a localhost sshd
        if: ${{ !cancelled() }}
        env:
          SSHD_DIR: ${{ runner.temp }}/drgnx-sshd
        run: |
          trap 'bash .github/ci/macos-sshd.sh down "$SSHD_DIR"; rm -rf "$SSHD_DIR"' EXIT
          DRGNX_TEST_SSHD_HOST=$(bash .github/ci/macos-sshd.sh up "$SSHD_DIR" | tail -n 1)
          export DRGNX_TEST_SSHD_HOST
          # the timing rows are #[ignore] too: a debug build on a shared runner would judge a release budget
          skips=$(sed 's/#.*//' test/timing-rust.txt | awk '$1 == "ratatoskr" { printf " --skip %s", $3 }')
          # --workspace and the workspace's features (tests/macos.rs is the only `macos` test target): the build above
          cargo test --locked --no-fail-fast --manifest-path Cargo.toml --workspace --exclude skel --exclude ritari --features ratatoskr/test-hooks --test macos -- --ignored $skips
      # Debug forks on a Mac (spec §21): each fork's adapter and program in Seatbelt with only their block of loopback
      # ports. lsof sweeps their sockets while the Python and the JS fork run (tests_fork_live's mac row). debugpy and
      # js-debug at the hub's pins (etc/debug-adapters.eld), installed as Debug: Install Adapter does; the lib's test
      # binary from the build above, the hub beside it as the sandbox's helper
      - name: debug forks keep to their port block (Seatbelt, lsof)
        if: ${{ !cancelled() }}
        # two forks of seconds each; a stuck one prints its processes, sockets and stacks at 90 s (FORK_WITHIN)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          set -a
          # not the runner's tool-cache python: a venv on it is one the fork's Seatbelt profile cannot exec
          # Homebrew's python: debugpy needs 3.10 or later (/usr/bin/python3 is 3.9) and the fork's Seatbelt profile
          # execs under /opt/homebrew; read into a variable first, so a failed install stops the step
          adapters=$(DRGNX_ADAPTER_PYTHON=/opt/homebrew/bin/python3 bash .github/ci/debug-adapters.sh "$RUNNER_TEMP/debug-adapters")
          printf '%s\n' "$adapters" >> "$GITHUB_ENV"
          eval "$adapters"
          set +a
          bin=$(jq -r 'select(.profile.test == true and .target.name == "ratatoskr" and (.target.kind | index("lib"))) | .executable' \
            "$RUNNER_TEMP/test-bins.json" | tail -n 1)
          [ -x "$bin" ] || { echo "::error::no test binary for the hub's lib"; exit 1; }
          cd crates/hub/ratatoskr
          "$bin" --ignored --exact debug::tests_fork_live::mac_forks_keep_to_their_port_block --nocapture --test-threads 1
      # recorded runs' key (spec §19.2): a throwaway keychain, the only one searched and the default, unlocked then
      # locked; the runner's own keychains are put back after, whatever happened
      - name: debug runs' key in the Keychain (made, read back, locked without a dialog)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bin=$(jq -r 'select(.profile.test == true and .target.name == "ratatoskr" and (.target.kind | index("lib"))) | .executable' \
            "$RUNNER_TEMP/test-bins.json" | tail -n 1)
          [ -x "$bin" ] || { echo "::error::no test binary for the hub's lib"; exit 1; }
          kc="$RUNNER_TEMP/drgnx-runs.keychain-db"
          pw=$(uuidgen)
          old_default=$(security default-keychain -d user | tr -d ' "')
          old_list=$(security list-keychains -d user | tr -d '"')
          restore() {
            # shellcheck disable=SC2086
            security list-keychains -d user -s $old_list
            security default-keychain -d user -s "$old_default"
            security delete-keychain "$kc" || true
          }
          trap restore EXIT
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc"
          security default-keychain -d user -s "$kc"
          "$bin" --ignored --exact debug::tests_keychain::the_key_is_made_in_an_unlocked_keychain_and_reads_back --test-threads 1
          security lock-keychain "$kc"
          "$bin" --ignored --exact debug::tests_keychain::a_locked_keychain_answers_locked_without_a_dialog --test-threads 1
      # the relay sidecar of a networked container job (and a keyed one's drgnx-key) is a Linux binary: build-only here
      # (no podman machine to run it in).
      # Apple Silicon builds aarch64 musl with Rust's self-contained musl and rust-lld, as `drgnx runtime build` does
      - name: the relay sidecar cross-builds (Linux musl, no C toolchain)
        if: ${{ !cancelled() }}
        run: |
          arch=$(uname -m); [ "$arch" = arm64 ] && arch=aarch64
          rustup target add "$arch-unknown-linux-musl"
          l=$(printf '%s' "$arch-unknown-linux-musl" | tr 'a-z-' 'A-Z_')
          env "CARGO_TARGET_${l}_LINKER=rust-lld" "CARGO_TARGET_${l}_RUSTFLAGS=-C link-self-contained=yes" \
            cargo build --locked --manifest-path Cargo.toml -p ferja --bin drgnx-px --target "$arch-unknown-linux-musl"
          env "CARGO_TARGET_${l}_LINKER=rust-lld" "CARGO_TARGET_${l}_RUSTFLAGS=-C link-self-contained=yes" \
            cargo build --locked --manifest-path Cargo.toml -p sleipnir --no-default-features --bin drgnx-key --target "$arch-unknown-linux-musl"
      # (clippy on darwin runs in conformance 1/2: here it was cut at this job's 45 minutes)
      # the one saver of the macOS dev entry (the setup action restored it for every macOS job)
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/cargo-target
        with:
          job: macos-dev
          mode: save
          build-outcome: ${{ steps.build.outcome }}
          status: ${{ job.status }}

  # The conformance suite in two halves (domr --shard K/2: every other row, so both take about as long), each against
  # its own debug build; the Seatbelt escape rows and clippy on darwin with the first half.
  macos-conformance:
    name: conformance ${{ matrix.shard }}/2 (macOS 27)
    needs: images
    if: ${{ !cancelled() && github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-macos ')) }}
    runs-on: xcode-27
    permissions:
      contents: read
      packages: read      # the prebuilt assets (drgnx-assets)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/macos-runtime
        with:
          nidhogg: "true"
          assets: ${{ needs.images.outputs.assets }}
      # as the tests job: the dependencies' debug info is line tables only, the workspace's crates keep theirs
      - name: dependencies' debug info is line tables only
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '[profile.dev.package."*"]\ndebug = "line-tables-only"\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # (+ gleipnir-probe and gleipnir-escape for the Seatbelt rows below). The tests job runs `eitri` and `draugr` on
      # macOS (their O_NOFOLLOW_ANY, xcode-select-link and CLOEXEC-loop paths). + drgnx-key beside the hub (keyed jobs).
      - id: build
        run: |
          cargo build --locked --manifest-path Cargo.toml -p ratatoskr -p domr -p gleipnir-escape --features ratatoskr/test-hooks
          cargo build --locked --manifest-path Cargo.toml -p sleipnir --no-default-features --bin drgnx-key
      # the hub parses code with the pack-built grammars: built once with the build's own hub (the pack job, `packs sync
      # --builtin`, as the Linux job does with cargo run) and handed to the tests as DRGNX_PACK_LOCK / DRGNX_PACK_GRAMMARS
      - name: Pack grammars for the tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          [ -x target/debug/ratatoskr ] || { echo "::error::the build made no hub binary"; exit 1; }
          line="$(RATATOSKR="$PWD/target/debug/ratatoskr" bash test/packs/hub-grammars.sh "$RUNNER_TEMP/hub-grammars" | grep '^export DRGNX_PACK_LOCK=')"
          eval "$line"
          echo "DRGNX_PACK_LOCK=$DRGNX_PACK_LOCK" >> "$GITHUB_ENV"
          echo "DRGNX_PACK_GRAMMARS=$DRGNX_PACK_GRAMMARS" >> "$GITHUB_ENV"
      # the hooks/* rows load the fixture plugins from target/plugin-fixtures, which brokkr's test support
      # installs; in one job the unit tests did that first, here one test of it does
      - name: the plugin fixtures
        id: fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast --manifest-path Cargo.toml -p brokkr --features test-support --lib fixtures_build_once
      # as the runner user; the `sudo` rows reach the socket as nobody through passwordless `sudo -n -u nobody`, so
      # security/another-uid-is-refused covers tokio's getpeereid path. --require-all fails it if it is skipped
      - name: conformance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo -n true
          target/debug/domr --hub-bin target/debug/ratatoskr \
            --scenarios test/conformance --require-all --shard ${{ matrix.shard }}/2
      # The Seatbelt rows run for real, with the real /usr/bin/sandbox-exec. --require-all: a skip fails the job. It
      # runs whatever the conformance step said, and it whatever this says. mac-works-git needs the git draugr trusts:
      # xcode-select points at the Command Line Tools since the setup. mac-net-* need a non-loopback address (the
      # fixture takes the one the default route uses); the step prints what the runner has.
      - name: escape suite (Seatbelt, required)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 1 }}
        run: |
          xcode-select -p
          route -n get default | grep -E 'interface|gateway' || true
          ifconfig | grep 'inet ' || true
          mkdir -p "$RUNNER_TEMP/escape"
          target/debug/gleipnir-escape --ratatoskr target/debug/ratatoskr \
            --probe target/debug/gleipnir-probe \
            --rows crates/hub/gleipnir-escape/rows/macos --rows crates/hub/gleipnir-escape/rows/any \
            --require-all --report "$RUNNER_TEMP/escape/escape-macos.json"
      # The pure-Rust crates' tests through clippy on darwin: only clippy's test build shows code that is dead on macOS
      # (gate review M21). In the shorter conformance half (about 20 minutes), not the tests job, whose cargo test
      # alone takes 30 of its 45. Whatever the rows said, so neither hides the other.
      - name: clippy on darwin (the pure-Rust crates)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: cargo clippy --locked --manifest-path Cargo.toml --all-targets -p runstav -p draugr -p eitri -p gleipnir -p mimir -p bifrost -p huginn -p heimdall -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.shard == 1 }}
        with:
          name: escape-report-macos
          path: ${{ runner.temp }}/escape/escape-macos.json
          if-no-files-found: warn

  # The perf baseline on a release build (a recorded baseline, no budgets, as on Linux)
  macos-perf:
    name: perf (macOS 27)
    needs: images
    if: ${{ !cancelled() && github.event_name != 'schedule' && (!inputs.only || contains(format(' {0} ', inputs.only), ' rt-macos ')) }}
    runs-on: xcode-27
    permissions:
      contents: read
      packages: read      # the prebuilt assets (drgnx-assets)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/macos-runtime
        with:
          nidhogg: "true"
          assets: ${{ needs.images.outputs.assets }}
      - name: perf baseline (release build)
        id: perf
        run: |
          cargo build --locked --release --manifest-path Cargo.toml -p ratatoskr -p domr
          target/release/domr --hub-bin target/release/ratatoskr \
            --scenarios test/conformance --only 'perf/*' --perf perf-macos.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.perf.outcome == 'success' }}
        with:
          name: ratatoskr-perf-macos
          path: perf-macos.json
          if-no-files-found: error
      # The CPU embedder against the reference vectors on Apple Silicon (its NEON path), in release: a debug build ignores
      # these rows on macOS (an unoptimised run took over a minute of the tests job's budget), so they run here, beside
      # the release build. The models come from the setup action (DRGNX_TEST_MODELS)
      - name: the CPU embedder's parity (release)
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast --release --manifest-path Cargo.toml -p hrafn-embed --test parity_cpu

  # After the builds: this ref's superseded target caches go (.github/ci/cache-prune.sh keeps the newest entry of each job,
  # toolchain and lock). Each commit's run saves a new entry per job (the key ends in the commit), so without this a
  # branch's old ones fill the repository's 10 GB. Only on the runs that save (cache-policy: a push or a manual run on
  # main, ci/* or scratch/drgnx-mac-rounds, never a pull request), and the only job with `actions: write` (it deletes
  # caches). It runs whichever builds ran or failed: a prune after a failed build still finds the entries of earlier runs.
  cache-prune:
    name: Prune superseded caches
    needs: [linux, msrv, escape-host, agent-containers, android, fuzz-build, macos]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/') || github.ref == 'refs/heads/scratch/drgnx-mac-rounds') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: .github/ci
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: bash .github/ci/cache-prune.sh

  # This workflow's gate: every job above succeeded, or is one this run may skip (.github/ci/runtime-skips.sh over the
  # job table .github/ci/runtime-jobs.txt: a job the narrowed or path-filtered `only` leaves out and no running job
  # needs, a pull request's fuzzing, main's push's consumers, the on-demand fleet). A called workflow whose jobs were
  # skipped still reads as a success to its caller, so without this a skipped job would pass `CI gate`; with it, this
  # job fails and ci.yml's `runtime` with it. `gate-needs.sh --check` (ci.yml's `scripts`) holds `needs` to every job.
  gate:
    name: Runtime gate
    if: always()
    needs: [images, linux, msrv, escape-host, debug-live, agent-containers, fleet, android, deny, fuzz-build, fuzz, macos, macos-conformance, macos-perf, cache-prune]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            .github/ci
            .github/workflows
      - id: skips
        name: The jobs this run may skip
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ONLY: ${{ inputs.only }}
        run: |
          allow=$(bash .github/ci/runtime-skips.sh)
          echo "allow=$allow" | tee -a "$GITHUB_OUTPUT"
      - uses: ./.github/actions/gate
        with:
          needs: ${{ toJSON(needs) }}
          allow-skipped: ${{ steps.skips.outputs.allow }}
