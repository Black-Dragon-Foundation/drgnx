# drgnx's Emacs-side tiers on one Nidhogg: the one definition of them. drgnx's ci.yml, gui.yml, tty.yml and macos.yml call it on
# a released Nidhogg (`nidhogg: release`, the pin) or on Nidhogg's integration line (`nidhogg: line`, below); Nidhogg's CI calls it at a pinned commit on the tarballs its run just built
# (`nidhogg: artifact`, the run's tarball-fedora-45 and tarball-macos), so a joint round of both repositories tests
# each pair once. While drgnx's next release is unreleased, drgnx's callers use `nidhogg: line`: the tarballs of
# Nidhogg's green build of its integration branch's head (.github/ci/nidhogg-line), copied into this run by the
# `nidhogg-line` job and installed as `artifact` installs them; no such build fails the run, never the release instead. `tiers` picks the jobs; the others are skipped. Every job checks drgnx out into drgnx/ (in Nidhogg's
# run the caller's checkout is Nidhogg) and takes the local actions from there. docs/develop/ci.md, "The tiers workflow"
name: drgnx tiers

on:
  workflow_call:
    inputs:
      drgnx_ref:
        description: "drgnx commit, branch or tag to test; empty: the caller's own commit (drgnx calling itself)"
        type: string
        default: ""
      nidhogg:
        description: "release: the images' pinned release (test/container/nidhogg.sh); artifact: this run's tarballs; line: the tarballs of Nidhogg's green build of its integration branch's head (.github/ci/nidhogg-line)"
        type: string
        default: release
      tiers:
        description: "Space-separated jobs to run: unit no-lisp-writes hub-chaos ui scenario perf tty ssh timing macos"
        type: string
        required: true
      selector:
        description: "Narrowed: the ERT selector of each test job (DRGNX_TEST_SELECTOR, an Emacs regexp or a selector form); empty: every test"
        type: string
        default: ""
    secrets:
      NIDHOGG_LINE_APP_ID:
        description: "nidhogg: line: the App that reads Nidhogg's Actions artifacts (Actions: read, installed on nidhogg)"
        required: false
      NIDHOGG_LINE_APP_KEY:
        description: "nidhogg: line: that App's private key"
        required: false
    outputs:
      drgnx_commit:
        description: The drgnx commit tested
        value: ${{ jobs.unit.outputs.commit || jobs.macos.outputs.commit }}

permissions:
  contents: read

# On Nidhogg's own build (`line`, `artifact`) a test whose Nidhogg primitive is missing fails instead of skipping, as in
# the local runs; empty otherwise (drgnx-test-require-nidhogg compares to "1"). bin/drgnx passes it into the containers.
env:
  DRGNX_NIDHOGG_STRICT: ${{ (inputs.nidhogg == 'line' || inputs.nidhogg == 'artifact') && '1' || '' }}

jobs:
  # nidhogg: line: Nidhogg's integration branch head (.github/ci/nidhogg-line), its newest build run whose tarball jobs passed, with the
  # tarballs the asked tiers need, and those tarballs copied into this run under their own names, so every job
  # installs them as `nidhogg: artifact` does. Reading another repository's artifacts needs a token even when it is
  # public: an App token with Actions: read on nidhogg (docs/develop/ci.md, "Nidhogg's integration line")
  nidhogg-line:
    name: Nidhogg's integration line
    if: ${{ inputs.nidhogg == 'line' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - name: The tarballs the asked tiers need
        id: want
        env:
          TIERS: ${{ inputs.tiers }}
          APP_ID: ${{ secrets.NIDHOGG_LINE_APP_ID }}
        run: |
          [ -n "$APP_ID" ] || { echo "::error::nidhogg: line needs the NIDHOGG_LINE_APP_ID and NIDHOGG_LINE_APP_KEY secrets (docs/develop/ci.md, \"Nidhogg's integration line\")"; exit 1; }
          linux=0 mac=0
          for t in $TIERS; do if [ "$t" = macos ]; then mac=1; else linux=1; fi; done
          names=""; [ "$linux" = 0 ] || names="tarball-fedora-45"; [ "$mac" = 0 ] || names="$names tarball-macos"
          { echo "names=$names"; echo "linux=$linux"; echo "mac=$mac"; } >> "$GITHUB_OUTPUT"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.NIDHOGG_LINE_APP_ID }}
          private-key: ${{ secrets.NIDHOGG_LINE_APP_KEY }}
          owner: Black-Dragon-Foundation
          repositories: nidhogg
          permission-actions: read
      - name: Nidhogg's line head and its green build run
        id: line
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NAMES: ${{ steps.want.outputs.names }}
        run: |
          # shellcheck disable=SC2086
          bash drgnx/.github/ci/nidhogg-line.sh $NAMES | tee -a "$GITHUB_OUTPUT"
      - if: ${{ steps.want.outputs.linux == '1' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-fedora-45
          path: ${{ runner.temp }}/line/fedora-45
          repository: Black-Dragon-Foundation/nidhogg
          run-id: ${{ steps.line.outputs.run }}
          github-token: ${{ steps.token.outputs.token }}
      - if: ${{ steps.want.outputs.mac == '1' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-macos
          path: ${{ runner.temp }}/line/macos
          repository: Black-Dragon-Foundation/nidhogg
          run-id: ${{ steps.line.outputs.run }}
          github-token: ${{ steps.token.outputs.token }}
      - if: ${{ steps.want.outputs.linux == '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-fedora-45
          path: ${{ runner.temp }}/line/fedora-45
          if-no-files-found: error
          retention-days: 1
      - if: ${{ steps.want.outputs.mac == '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-macos
          path: ${{ runner.temp }}/line/macos
          if-no-files-found: error
          retention-days: 1
      - name: Summary
        env:
          SHA: ${{ steps.line.outputs.commit }}
          RUN: ${{ steps.line.outputs.run }}
        run: echo "Nidhogg's line at $SHA, build run https://github.com/Black-Dragon-Foundation/nidhogg/actions/runs/$RUN" >> "$GITHUB_STEP_SUMMARY"

  # the test binaries, built once for every Linux job that needs them (fetch-test-bins)
  bins-linux:
    name: Test binaries (Linux)
    if: ${{ contains(format(' {0} ', inputs.tiers), ' unit ') || contains(format(' {0} ', inputs.tiers), ' no-lisp-writes ') || contains(format(' {0} ', inputs.tiers), ' hub-chaos ') || contains(format(' {0} ', inputs.tiers), ' ui ') || contains(format(' {0} ', inputs.tiers), ' perf ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, without old file contents: build-test-bins sets each file to its last commit's time
          fetch-depth: 0
          filter: blob:none
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - uses: ./drgnx/.github/actions/build-test-bins
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drgnx-test-bins-linux
          path: |
            drgnx/runtime/target/debug/ratatoskr
            drgnx/runtime/target/debug/ratatoskr-mock
            drgnx/runtime/target/debug/examples/dump
          if-no-files-found: error
          retention-days: 1

  # the files a core each at once, a failed file rerun once, the :timing tests left out by name (docs/develop/ci.md).
  # Whatever the binaries' job said: without them only the tests that need them fail. The runtime audit is on and
  # failing: a :det test that really waits or starts a process is red (docs/develop/harness.md, "The audit")
  unit:
    name: Unit suite (Linux, Fedora 45)
    needs: [bins-linux, nidhogg-line]
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' unit ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - id: commit
        run: echo "commit=$(git -C drgnx rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./drgnx/.github/actions/fetch-test-bins
      - if: ${{ !cancelled() }}
        uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile
          image: drgnx-test
          variable: DRGNX_TEST_IMAGE
          nidhogg-artifact: ${{ (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') && 'tarball-fedora-45' || '' }}
      - name: The pinned evil and kkp, for the modal and kitty tests (they skip without them)
        if: ${{ !cancelled() }}
        uses: ./drgnx/.github/actions/test-elpa
      - name: Unit suite in test/container/Containerfile, the files in parallel (no :timing tests)
        if: ${{ !cancelled() }}
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_RERUN: "1"
          DRGNX_TEST_NO_TIMING: "1"
          DRGNX_TEST_LOCALE: C.UTF-8      # the one job under a UTF-8 locale; the others run with none
          DRGNX_TEST_AUDIT: "1"
          DRGNX_TEST_AUDIT_FAIL: "1"
          DRGNX_TEST_SELECTOR: ${{ inputs.selector }}
        run: DRGNX_TEST_JOBS="$(nproc)" bin/drgnx test --container

  # The one-writer gate (Urdr schema 7, storage §9 step 4): the whole unit suite once with DRGNX_WORK_DB_GATE=1, where
  # opening work.db read-write signals (test/support/work-db-gate.el) and only the tests tagged :work-db-writer (the
  # hub's stand-in, kept to the read layer's tests by a lint) are left out. Same steps as unit; the evidence that no
  # Lisp path writes the tracker's database. docs/develop/ci.md
  no-lisp-writes:
    name: No Lisp writes work.db (gate mode)
    needs: [bins-linux, nidhogg-line]
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' no-lisp-writes ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - uses: ./drgnx/.github/actions/fetch-test-bins
      - if: ${{ !cancelled() }}
        uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile
          image: drgnx-test
          variable: DRGNX_TEST_IMAGE
          nidhogg-artifact: ${{ (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') && 'tarball-fedora-45' || '' }}
      # the same packages as unit: test/no-skip.eld holds here too, and without them Quick Open's vertico rows skip
      - name: The pinned evil, kkp, vertico and orderless, as unit has them (they skip without them)
        if: ${{ !cancelled() }}
        uses: ./drgnx/.github/actions/test-elpa
      - name: Unit suite in gate mode, the files in parallel (no :timing tests)
        if: ${{ !cancelled() }}
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_RERUN: "1"
          DRGNX_TEST_NO_TIMING: "1"
          DRGNX_WORK_DB_GATE: "1"
          DRGNX_TEST_AUDIT: "1"
          DRGNX_TEST_AUDIT_FAIL: "1"
          DRGNX_TEST_SELECTOR: ${{ inputs.selector }}
        run: DRGNX_TEST_JOBS="$(nproc)" bin/drgnx test --container

  # Hub chaos (docs/develop/ci.md, "Hub chaos"): the hub-client and ai-gateway files once per seed, 1 to 3, with each hub
  # connection's answers delivered after its own seeded delay (DRGNX_TEST_HUB_CHAOS, test/fixtures/hub-chaos-fixture.el),
  # against the run's test-hooks Ratatoskr. No rerun: a red under chaos is a race, not a flake. A red names its seed,
  # and the same variable replays it
  hub-chaos:
    name: Hub chaos (hub client and gateway, seeds 1-3)
    needs: [bins-linux, nidhogg-line]
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' hub-chaos ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - uses: ./drgnx/.github/actions/fetch-test-bins
      - if: ${{ !cancelled() }}
        uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile
          image: drgnx-test
          variable: DRGNX_TEST_IMAGE
          nidhogg-artifact: ${{ (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') && 'tarball-fedora-45' || '' }}
      - name: The hub-client and ai-gateway files under hub chaos, seeds 1 to 3 (no rerun)
        if: ${{ !cancelled() }}
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_NO_TIMING: "1"
          DRGNX_TEST_SELECTOR: '"^drgnx-\\(hub-client\\|ai-gateway\\)/"'
        run: |
          red=""
          for seed in 1 2 3; do
            echo "::group::Hub chaos seed $seed"
            log="$RUNNER_TEMP/hub-chaos-$seed.log" rc=0
            DRGNX_TEST_HUB_CHAOS=$seed DRGNX_TEST_JOBS="$(nproc)" bin/drgnx test --container 2>&1 | tee "$log" || rc=$?
            echo "::endgroup::"
            ran=$(sed -nE 's/^drgnx: [0-9]+ test files.*: ([0-9]+) tests,.*/\1/p' "$log" | tail -n 1)
            replay="DRGNX_TEST_HUB_CHAOS=$seed DRGNX_TEST_SELECTOR='$DRGNX_TEST_SELECTOR' bin/drgnx test --container"
            if [ "$rc" != 0 ]; then
              echo "::error title=Hub chaos seed $seed::red under hub chaos seed $seed (exit $rc); replay: $replay"
              red="$red $seed"
            elif [ "${ran:-0}" -eq 0 ]; then
              echo "::error title=Hub chaos seed $seed::seed $seed ran no test (a vacuous pass proves nothing); replay: $replay"
              red="$red $seed"
            else
              echo "hub chaos seed $seed: green, $ran tests"
            fi
          done
          [ -z "$red" ] || { echo "red under hub chaos seed(s):$red"; exit 1; }
      # after the seeds, whatever they said: each gated file once per swapped pair of lines across connections (--orders)
      # stops at its first red and names the K; DRGNX_TEST_GATE_SWAP=K replays it. No rerun
      - name: The gated files, one run per swapped pair of lines across connections (no rerun)
        if: ${{ !cancelled() }}
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_NO_TIMING: "1"
        run: bin/drgnx test --orders --container

  # The GUI tier: real Nidhogg sessions under headless mutter, in test/container/Containerfile.gui; the live tests that
  # need the hub start their own against the run's Ratatoskr (test/no-skip.eld)
  ui:
    name: GUI tests (headless mutter)
    needs: [bins-linux, nidhogg-line]
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' ui ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90          # the Glitnir child-frame matrix (test/ui/childframe-chrome-test.el) runs here once Nidhogg ships it
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - uses: ./drgnx/.github/actions/fetch-test-bins
      - if: ${{ !cancelled() }}
        uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile.gui
          image: drgnx-test-gui
          variable: DRGNX_TEST_GUI_IMAGE
          nidhogg-artifact: ${{ (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') && 'tarball-fedora-45' || '' }}
      # the pinned child-frame packages (test/container/childframe-packages.eld) are baked into this image, so the tier
      # reaches no archive; a row that finds them missing fails (bin/drgnx sets DRGNX_CHILDFRAME_REQUIRED)
      - name: The pinned evil and kkp, for the live tier's Vim-key tests (they skip without them)
        if: ${{ !cancelled() }}
        uses: ./drgnx/.github/actions/test-elpa
      - name: GUI tier in test/container/Containerfile.gui (the :timing tests left out by name)
        if: ${{ !cancelled() }}
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_NO_TIMING: "1"
          DRGNX_UI_TEST_TIMEOUT: "3000"
          DRGNX_TEST_SELECTOR: ${{ inputs.selector }}
        run: bin/drgnx test --container --ui

  scenario:
    name: Scenario tier, frame budget reported (headless mutter)
    needs: nidhogg-line
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' scenario ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile.gui
          image: drgnx-test-gui
          variable: DRGNX_TEST_GUI_IMAGE
          nidhogg-artifact: ${{ (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') && 'tarball-fedora-45' || '' }}
      - name: Scenario tier in test/container/Containerfile.gui (the frame budget reported, not judged)
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_NO_TIMING: "1"
          DRGNX_TEST_SELECTOR: ${{ inputs.selector }}
        run: bin/drgnx test --container --scenario

  # Some scenarios start a hub and a mock agent (harness/drgnx-perf-run.el): Ratatoskr and `ratatoskr-mock` come from
  # bins-linux like the unit and GUI tiers'. Whatever that job said: without them only those scenarios fail
  perf:
    name: Perf lab (headless mutter)
    needs: [bins-linux, nidhogg-line]
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' perf ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - uses: ./drgnx/.github/actions/fetch-test-bins
      - if: ${{ !cancelled() }}
        uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile.gui
          image: drgnx-test-gui
          variable: DRGNX_TEST_GUI_IMAGE
          nidhogg-artifact: ${{ (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') && 'tarball-fedora-45' || '' }}
      - name: Perf lab in test/container/Containerfile.gui, judged against test/perf/budgets.eld
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
          DRGNX_PERF_CPU_FACTOR: "2"
          DRGNX_PERF_RESULTS: perf-results.json
        run: bin/drgnx test --container --perf
      - name: Upload the perf results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: drgnx/perf-results.json
          if-no-files-found: warn

  # The terminal tier: Emacs in tmux sessions, in test/container/Containerfile.tty (Fedora 45). Needs no test binaries
  tty:
    name: Terminal tests (Fedora 45, tmux)
    needs: nidhogg-line
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' tty ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile.tty
          image: drgnx-test-tty
          variable: DRGNX_TEST_TTY_IMAGE
          nidhogg-artifact: ${{ (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') && 'tarball-fedora-45' || '' }}
      - name: The pinned kkp, for the kitty and keys tests (they skip without it)
        uses: ./drgnx/.github/actions/test-elpa
      - name: Terminal tier in test/container/Containerfile.tty
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_SELECTOR: ${{ inputs.selector }}
        run: bin/drgnx test --container --tty --fedora 45

  # The remote-terminal rows (test/ssh/; docs/develop/terminal.md, "Remote terminals"): test/container/ssh-row.sh on
  # the run's test image plus Containerfile.ssh, with the hub (test hooks) and the terminal worker built here (the
  # worker's engine needs Zig and libghostty-vt's pinned tarballs). sshd listens on 127.0.0.1 inside the container;
  # every key and user is made there per run. An image the script cannot have exits 75, which fails the job: never a skip
  ssh:
    name: Remote terminals (ssh row, Fedora 45)
    needs: nidhogg-line
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' ssh ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - name: Zig and libghostty-vt's pinned tarballs (the terminal worker's engine)
        working-directory: drgnx
        run: |
          sudo bash test/container/zig.sh linux
          bash runtime/crates/ghostty-vt-sys/fetch.sh
      - name: Ratatoskr (test hooks) and the terminal worker beside it
        working-directory: drgnx
        run: cargo build --locked --manifest-path runtime/Cargo.toml -p drgnx-ratatoskr -p drgnx-term --bins --features drgnx-ratatoskr/test-hooks
      - uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile
          image: drgnx-test
          variable: DRGNX_TEST_IMAGE
          nidhogg-artifact: ${{ (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') && 'tarball-fedora-45' || '' }}
      - name: The ssh row in test/container/Containerfile.ssh (on the test image)
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
          DRGNX_TEST_SELECTOR: ${{ inputs.selector }}
        run: DRGNX_RATATOSKR_BIN="$PWD/runtime/target/debug/ratatoskr" bash test/container/ssh-row.sh

  # The timing lane (report only): the tests tagged :timing, which every other tier leaves out (DRGNX_TEST_NO_TIMING),
  # judged against the runner's own speed (test/timing-lane.sh). Report only because the lane script reports and exits 0
  # (a red job would make the run red); `CI gate` does not need it. The calibration runs in the test image the step
  # below sets (DRGNX_TEST_IMAGE), one row per area's prefix (test/timing-rows.txt), 20 samples each
  timing:
    name: Timing tests (report only)
    needs: nidhogg-line
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' timing ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile
          image: drgnx-test
          variable: DRGNX_TEST_IMAGE
          nidhogg-artifact: ${{ (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') && 'tarball-fedora-45' || '' }}
      - name: Timing lane
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
        run: test/timing-lane.sh --report "$RUNNER_TEMP/timing-report.txt"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drgnx-timing-report
          path: ${{ runner.temp }}/timing-report.txt
          if-no-files-found: ignore
      # The Rust timing tests (#[ignore = "timing: …"], test/timing-rust.txt), alone, in a Fedora 45 container (the
      # prebuilt Rust image, else plain Fedora and dnf's Rust); report only
      - if: ${{ !cancelled() }}
        uses: ./drgnx/.github/actions/test-image
        with:
          containerfile: Containerfile.rust
          image: drgnx-test-rust
          variable: DRGNX_TEST_RUST_IMAGE
      - name: Rust timing tests
        if: ${{ !cancelled() }}
        working-directory: drgnx
        env:
          DRGNX_CONTAINER: podman
        run: test/timing-rust.sh --report "$RUNNER_TEMP/timing-rust-report.txt"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drgnx-timing-rust-report
          path: ${{ runner.temp }}/timing-rust-report.txt
          if-no-files-found: ignore

  # macOS 27 (Apple silicon; GitHub names its image after its Xcode: xcode-27): the unit suite and the install plan,
  # with macOS's own bash 3.2. The test binaries are built here (one macOS job: no second macOS runner for them)
  macos:
    name: Unit suite and install plan (macOS 27)
    needs: nidhogg-line
    if: ${{ !cancelled() && needs.nidhogg-line.result != 'failure' && contains(format(' {0} ', inputs.tiers), ' macos ') }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"      # the image's formulae as they are: no self-update or cleanup minutes in a run
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, without old file contents: build-test-bins sets each file to its last commit's time
          fetch-depth: 0
          filter: blob:none
          repository: ${{ inputs.drgnx_ref && 'Black-Dragon-Foundation/drgnx' || '' }}
          ref: ${{ inputs.drgnx_ref || github.event.pull_request.head.sha }}
          path: drgnx
          persist-credentials: false
      - name: drgnx_ref is a commit on one of drgnx's own branches
        if: ${{ inputs.drgnx_ref != '' }}
        env:
          ASKED: ${{ inputs.drgnx_ref }}
        run: |
          case "$ASKED" in refs/pull/*|pull/*) echo "::error::drgnx_ref $ASKED is a pull request's, not a branch of drgnx's"; exit 1 ;; esac
          sha=$(git -C drgnx rev-parse HEAD)
          git clone -q --bare --no-tags --filter=tree:0 https://github.com/Black-Dragon-Foundation/drgnx.git "$RUNNER_TEMP/drgnx-branches"
          [ -n "$(git -C "$RUNNER_TEMP/drgnx-branches" branch --contains "$sha" 2>/dev/null)" ] ||
            { echo "::error::drgnx_ref $ASKED ($sha) is on none of drgnx's branches (a fork's or a pull request's commit)"; exit 1; }
      - id: commit
        run: echo "commit=$(git -C drgnx rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Rust from the image's rustup (no Homebrew formula per run), ripgrep from Homebrew
      - name: ripgrep (Homebrew) and Rust (rustup)
        run: |
          brew install ripgrep
          rustup toolchain install stable --profile minimal
      - uses: ./drgnx/.github/actions/build-test-bins
      - name: install.sh parses under macOS's bash 3.2
        if: ${{ !cancelled() }}
        working-directory: drgnx
        run: /bin/bash -n install.sh
      - name: install.sh prints the macOS plan and changes nothing
        if: ${{ !cancelled() }}
        working-directory: drgnx
        run: /bin/bash install.sh --dry-run
      - name: This run's Nidhogg tarball
        if: ${{ !cancelled() && (inputs.nidhogg == 'artifact' || inputs.nidhogg == 'line') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-macos
          path: ${{ runner.temp }}/nidhogg-dist
      # the pinned release tarball, kept by the hash of nidhogg.sh (runtime.yml's macos job uses the same entry; the
      # tarball is checked against the pin on every use); saved by main's own run only
      - id: nidhogg-tarball
        if: ${{ !cancelled() && inputs.nidhogg == 'release' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nidhogg-downloads
          key: nidhogg-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('drgnx/test/container/nidhogg.sh') }}
      - name: Nidhogg for the suite (the pinned release, or this run's tarball)
        id: nidhogg
        if: ${{ !cancelled() }}
        working-directory: drgnx
        env:
          MODE: ${{ inputs.nidhogg }}
          NIDHOGG_DOWNLOADS: ${{ runner.temp }}/nidhogg-downloads
        run: |
          if [ "$MODE" = artifact ] || [ "$MODE" = line ]; then
            tarball="$(ls "$RUNNER_TEMP"/nidhogg-dist/*.tar.xz)"   # none: the step fails (never the release instead)
            /bin/bash test/container/nidhogg.sh macos "$tarball"
          else
            /bin/bash test/container/nidhogg.sh macos
          fi
      - if: ${{ !cancelled() && inputs.nidhogg == 'release' && steps.nidhogg.outcome == 'success' && steps.nidhogg-tarball.outputs.cache-hit != 'true' && steps.commit.outputs.commit == (github.event.pull_request.head.sha || github.sha) && github.repository == 'Black-Dragon-Foundation/drgnx' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nidhogg-downloads
          key: ${{ steps.nidhogg-tarball.outputs.cache-primary-key }}
      # the hub runs only the git of the developer dir xcode-select's link names, and refuses the image's Xcode under
      # the admin-writable /Applications: without the Command Line Tools no folder is a project, so the tests that make
      # tasks through the hub find none (runtime.yml's macos job does the same before its tests)
      - name: xcode-select points at the Command Line Tools (the git the hub trusts)
        if: ${{ !cancelled() }}
        run: |
          xcode-select -p
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
      # the files a core each at once, a failed file rerun once, the :timing tests left out by name (docs/develop/ci.md).
      # Whatever the steps before said, once there is an Emacs: without Ratatoskr only the tests that need it fail
      - name: Unit suite, the files in parallel (no :timing tests)
        if: ${{ !cancelled() && steps.nidhogg.outcome == 'success' }}
        working-directory: drgnx
        env:
          DRGNX_TEST_RERUN: "1"
          DRGNX_TEST_NO_TIMING: "1"
          DRGNX_TEST_SELECTOR: ${{ inputs.selector }}
        run: DRGNX_TEST_JOBS="$(sysctl -n hw.ncpu)" bin/drgnx test
