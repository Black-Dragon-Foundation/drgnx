# The binaries drgnx's tests run against, built from the checkout and cached by its Cargo.lock: Ratatoskr with the test
# hooks (some client tests need --idle-tick-ms) and ratatoskr-mock beside it (the gateway tests' provider,
# test/unit/ai-gateway-test.el), and huginn's dump example (drgnx-huginn/differential-fresh-seed). The tests that need
# them fail rather than skip (test/no-skip.eld). Sets DRGNX_RATATOSKR_BIN and DRGNX_HUGINN_DUMP. Built on the runner
# (its glibc is older than Fedora 45's, so they run in the test container). docs/develop/ci.md
name: drgnx test binaries (build)
description: Build Ratatoskr (test hooks), ratatoskr-mock and huginn's dump example from a drgnx checkout
inputs:
  dir:
    description: The drgnx checkout
    default: drgnx
runs:
  using: composite
  steps:
    # Keyed by the toolchain and the hash of Cargo.lock and the manifests, restored from the newest entry of the same
    # toolchain when they moved (cargo rebuilds whatever is stale). Saved, without what every run rebuilds
    # (.github/ci/cargo-prune.sh), by a push or a manual run of `main` or a `ci/*` branch, and only when the checkout is
    # the workflow's own commit; never by a pull request, and never for another repository's run (Nidhogg's calls
    # drgnx-tiers.yml with a drgnx commit of its choosing: it restores, it never writes).
    - id: own
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: echo "commit=$(git -C "$DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - id: rv
      shell: bash
      run: echo "v=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
    - id: bins-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ${{ inputs.dir }}/runtime/target
        key: cargo-${{ runner.os }}-drgnx-test-bins-${{ steps.rv.outputs.v }}-${{ hashFiles(format('{0}/runtime/Cargo.lock', inputs.dir), format('{0}/runtime/Cargo.toml', inputs.dir), format('{0}/runtime/*/Cargo.toml', inputs.dir), format('{0}/runtime/crates/*/Cargo.toml', inputs.dir)) }}
        restore-keys: cargo-${{ runner.os }}-drgnx-test-bins-${{ steps.rv.outputs.v }}-
    - name: Ratatoskr (test hooks), ratatoskr-mock, huginn's dump example
      id: build
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        CARGO_INCREMENTAL: "0"
      run: |
        cargo build --locked --manifest-path "$DIR/runtime/Cargo.toml" -p drgnx-ratatoskr -p domr \
          --features drgnx-ratatoskr/test-hooks --bin ratatoskr --bin ratatoskr-mock
        cargo build --locked --manifest-path "$DIR/runtime/Cargo.toml" -p huginn --example dump
        t="$(cd "$DIR/runtime/target/debug" && pwd)"
        echo "DRGNX_RATATOSKR_BIN=$t/ratatoskr" >> "$GITHUB_ENV"
        echo "DRGNX_HUGINN_DUMP=$t/examples/dump" >> "$GITHUB_ENV"
    # --keep-bins: the job uploads or runs them next
    - id: prune
      if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/')) && steps.own.outputs.commit == github.sha && github.repository == 'Black-Dragon-Foundation/drgnx' && steps.bins-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: bash "$DIR/.github/ci/cargo-prune.sh" "$DIR/runtime/Cargo.toml" "$DIR/runtime/target" --keep-bins
    - if: ${{ steps.prune.outcome == 'success' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ${{ inputs.dir }}/runtime/target
        key: ${{ steps.bins-cache.outputs.cache-primary-key }}
