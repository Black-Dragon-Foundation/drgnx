# The binaries drgnx's tests run against, built from the checkout and cached by its Cargo.lock: Ratatoskr with the test
# hooks (some client tests need --idle-tick-ms) and ratatoskr-mock beside it (the gateway tests' provider,
# test/unit/ai-gateway-test.el), and huginn's dump example (drgnx-huginn/differential-fresh-seed). The tests that need
# them fail rather than skip (test/no-skip.eld). Sets DRGNX_RATATOSKR_BIN and DRGNX_HUGINN_DUMP. Built on the runner
# (its glibc is older than Fedora 45's, so they run in the test container). docs/develop/ci.md
name: drgnx test binaries (build)
description: Build Ratatoskr (test hooks), ratatoskr-mock and huginn's dump example from a drgnx checkout
inputs:
  dir:
    description: The drgnx checkout
    default: drgnx
runs:
  using: composite
  steps:
    # Keyed by the toolchain and the hash of Cargo.lock and the manifests, restored from the newest entry of the same
    # toolchain when they moved (cargo rebuilds whatever is stale). Saved, without what every run rebuilds
    # (.github/ci/cargo-prune.sh), by a push or a manual run of `main` (first), or a pull request from a
    # branch of this repository (GitHub scopes its cache to the pull request's merge ref: main never restores it), and
    # only when the checkout is the run's own commit; never by a `ci/*` branch or a fork's pull request (they restore),
    # and never for another repository's run (Nidhogg's calls drgnx-tiers.yml with a drgnx commit of its choosing: it
    # restores, never writes).
    # `mt1` in the key: the entries carry the commit they were built from (.drgnx-built-from, for commit-times.sh).
    - id: own
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: echo "commit=$(git -C "$DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - id: rv
      shell: bash
      run: echo "v=$(rustc -V | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
    # the registry once per lock and OS, shared with runtime.yml's jobs; the target per job
    - id: registry
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: cargo-registry-${{ runner.os }}-${{ hashFiles(format('{0}/runtime/Cargo.lock', inputs.dir)) }}
        restore-keys: cargo-registry-${{ runner.os }}-
    - id: bins-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.dir }}/runtime/target
        key: cargo-${{ runner.os }}-drgnx-test-bins-mt1-${{ steps.rv.outputs.v }}-${{ hashFiles(format('{0}/runtime/Cargo.lock', inputs.dir), format('{0}/runtime/Cargo.toml', inputs.dir), format('{0}/runtime/*/Cargo.toml', inputs.dir), format('{0}/runtime/crates/*/Cargo.toml', inputs.dir)) }}
        restore-keys: cargo-${{ runner.os }}-drgnx-test-bins-mt1-${{ steps.rv.outputs.v }}-
    # what the cached build was built from stays as old as its last commit, so cargo rebuilds only what changed
    - name: Each tracked file at its last commit's time
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: bash .github/ci/commit-times.sh runtime/target/.drgnx-built-from
    # sccache (GitHub's cache as its store) for what the target cache above lacks; inline, not .github/actions/sccache:
    # a composite action cannot name a sibling by a path that depends on `dir` (Nidhogg's calls check drgnx out elsewhere)
    - if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.11
    - if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GHA_ENABLED=true"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
        } >> "$GITHUB_ENV"
    - name: Ratatoskr (test hooks), ratatoskr-mock, huginn's dump example
      id: build
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        CARGO_INCREMENTAL: "0"
        CARGO_PROFILE_DEV_DEBUG: line-tables-only   # as runtime.yml: half the kept build
      run: |
        cargo build --locked --manifest-path "$DIR/runtime/Cargo.toml" -p drgnx-ratatoskr -p domr \
          --features drgnx-ratatoskr/test-hooks --bin ratatoskr --bin ratatoskr-mock
        cargo build --locked --manifest-path "$DIR/runtime/Cargo.toml" -p huginn --example dump
        t="$(cd "$DIR/runtime/target/debug" && pwd)"
        echo "DRGNX_RATATOSKR_BIN=$t/ratatoskr" >> "$GITHUB_ENV"
        echo "DRGNX_HUGINN_DUMP=$t/examples/dump" >> "$GITHUB_ENV"
    # --keep-bins: the job uploads or runs them next
    - id: prune
      if: ${{ ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && steps.own.outputs.commit == (github.event.pull_request.head.sha || github.sha) && github.repository == 'Black-Dragon-Foundation/drgnx' && steps.bins-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: |
        bash "$DIR/.github/ci/cargo-prune.sh" "$DIR/runtime/Cargo.toml" "$DIR/runtime/target" --keep-bins
        # the commit it was built from, only when the build passed (this step runs only then; said again here)
        if [ "${{ steps.build.outcome }}" = success ]; then git -C "$DIR" rev-parse HEAD > "$DIR/runtime/target/.drgnx-built-from"; fi
    - if: ${{ steps.prune.outcome == 'success' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.dir }}/runtime/target
        key: ${{ steps.bins-cache.outputs.cache-primary-key }}
    - if: ${{ steps.prune.outcome == 'success' && steps.registry.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: ${{ steps.registry.outputs.cache-primary-key }}
