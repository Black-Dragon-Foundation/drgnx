# What every macOS job of runtime.yml needs before its own steps (the tests, the conformance shards, the perf
# baseline run as separate jobs so each fits its limit): the prebuilt assets (the model files, the libghostty-vt, Zig
# and Nidhogg tarballs: one pull of `drgnx-assets` by digest, .github/ci/assets.sh), the image's rustup with clippy, the
# cargo caches (the one `macos-dev` entry, through .github/actions/cargo-target: the `tests` job saves it), the git
# draugr trusts, the plugin fixtures, Zig, vttest and, with `nidhogg: true`, Nidhogg (DRGNX_EMACS). No step downloads
# from Hugging Face or the tarballs' sites when the assets are there: PR 5's round 5 lost all four Mac jobs to a
# cancelled Hugging Face transfer. docs/develop/ci.md
name: macOS runtime setup
description: The toolchain, caches and test inputs of runtime.yml's macOS jobs
inputs:
  nidhogg:
    description: "true: install Nidhogg 31.1 (writes DRGNX_EMACS to the environment)"
    default: "false"
  assets:
    description: "The `drgnx-assets` image by digest (runtime.yml's images job; empty: the setup downloads what it needs)"
    default: ""
runs:
  using: composite
  steps:
    - name: the prebuilt assets (models, libghostty-vt, Zig and Nidhogg tarballs)
      shell: bash
      env:
        TOKEN: ${{ github.token }}
        ACTOR: ${{ github.actor }}
        ASSETS_REF: ${{ inputs.assets }}
      run: /bin/bash .github/ci/assets.sh use "$ASSETS_REF"
    # the image's rustup (as the Linux runner jobs), not Homebrew's rust: no formula download and install per run
    - shell: bash
      run: bash .github/ci/rust.sh --component clippy
    - uses: ./.github/actions/cargo-target
      with:
        job: macos-dev
        mode: restore
    # draugr runs only the git of the developer dir xcode-select's link names, and refuses Xcode under the
    # admin-writable /Applications (on the runner even its git is the runner user's); the Command Line Tools, which
    # the image installs, pass. Before the tests: draugr's git tests and the escape rows run that git.
    - name: xcode-select points at the Command Line Tools (the git draugr trusts)
      shell: bash
      run: |
        xcode-select -p
        sudo xcode-select -s /Library/Developer/CommandLineTools
        xcode-select -p
    # the model files, as the Fedora 45 job: from the assets, each file's sum checked (a missing one is fetched)
    - name: the model files (DRGNX_TEST_MODELS)
      id: models-fetch
      shell: bash
      run: |
        /bin/bash .github/ci/models.sh ../test-models
        echo "DRGNX_TEST_MODELS=$(cd ../test-models && pwd)" >> "$GITHUB_ENV"
    # the plugin tests and rows load WASM components built for wasm32-wasip2
    - name: wasm32-wasip2 and the plugin fixtures
      shell: bash
      run: bash .github/ci/wasm-target.sh
    # the terminal engine is built from source with a pinned Zig (test/container/zig.sh, from ZIG_DOWNLOADS)
    - name: Zig
      shell: bash
      run: /bin/bash test/container/zig.sh macos
    - name: libghostty-vt's pinned tarballs (build.rs never downloads)
      shell: bash
      run: /bin/bash crates/hub/ghostty-vt-sys/fetch.sh
    # drgnx-term's vttest rows drive the real vttest (the Linux test images carry it; a missing one fails the rows)
    - name: vttest (the terminal's conformance rows)
      shell: bash
      run: brew install vttest
    # the pinned release tarball comes from NIDHOGG_DOWNLOADS (the assets); the script checks it against the pinned sums
    - name: Nidhogg 31.1 (writes DRGNX_EMACS to the environment)
      id: nidhogg
      if: ${{ inputs.nidhogg == 'true' }}
      shell: bash
      run: /bin/bash test/container/nidhogg.sh macos
