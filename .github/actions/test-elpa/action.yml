# The packages the modal and kitty tests load, at the versions etc/drgnx.lock.eld pins (evil, goto-chg, evil-collection,
# kkp): unpacked by test/container/modal-elpa.sh (each tarball's sha256 is checked before it is unpacked) into one
# directory, cached by the lock's hash. Sets DRGNX_MODAL_ELPA and DRGNX_USER_ELPA to it, which `bin/drgnx test
# --container` mounts read-only. docs/develop/ci.md
name: drgnx test packages
description: The lock's pinned evil and kkp, unpacked for DRGNX_MODAL_ELPA and DRGNX_USER_ELPA
inputs:
  dir:
    description: The drgnx checkout
    default: drgnx
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/test-elpa
        key: test-elpa-${{ hashFiles(format('{0}/etc/drgnx.lock.eld', inputs.dir), format('{0}/test/container/modal-elpa.sh', inputs.dir)) }}
    - name: Unpack the pinned packages
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: sh "$DIR/test/container/modal-elpa.sh" "$RUNNER_TEMP/test-elpa"
    # saved by the run's own commit only: a push to or the daily run of main, or a pull request from a branch of this
    # repository (its cache is scoped to the pull request's merge ref: main never restores it); never a fork's pull
    # request, never for a drgnx_ref of another repository's run
    - id: own
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: echo "commit=$(git -C "$DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.own.outputs.commit == (github.event.pull_request.head.sha || github.sha) && github.repository == 'Black-Dragon-Foundation/drgnx' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/test-elpa
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: The directory, for the tests
      shell: bash
      run: |
        echo "DRGNX_MODAL_ELPA=$RUNNER_TEMP/test-elpa" >> "$GITHUB_ENV"
        echo "DRGNX_USER_ELPA=$RUNNER_TEMP/test-elpa" >> "$GITHUB_ENV"
