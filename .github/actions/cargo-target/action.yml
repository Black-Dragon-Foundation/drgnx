# The one cargo target cache of a build job (docs/develop/ci.md, "What is cached"): `mode: restore` restores the registry
# and the target by .github/ci/cache-key.sh's keys (this toolchain and lock, the newest commit's entry; never another
# toolchain's) and gives each tracked file its last commit's time; `mode: save`, at the job's end, asks
# .github/ci/cache-policy.sh and, when it says save, prunes the target (.github/ci/cargo-prune.sh), writes the commit it
# was built from and saves the target and, if it missed, the registry. Only a push or a manual run on main, ci/* or
# scratch/drgnx-mac-rounds saves, and only when the build passed: a pull request never does. The superseded entries of
# a ref are deleted by the `cache-prune` job. Run it after the toolchain is installed and the checkout is whole
# (fetch-depth 0, for commit-times.sh).
name: cargo target cache
description: Restore or save a build job's cargo target cache and the registry
inputs:
  job:
    description: "The job's name in the key (fedora45, msrv195, escape-ubuntu-24.04, macos-dev, …)"
    required: true
  mode:
    description: restore (before the build) or save (after it)
    required: true
  build-outcome:
    description: "save: the outcome of the build step (steps.build.outcome); only success saves"
    default: success
  status:
    description: "save: the job's status so far (job.status); the built-from commit is written only when it is success"
    default: success
  manifest:
    description: The workspace's manifest, for cargo-prune.sh
    default: Cargo.toml
  target:
    description: The target directory
    default: target
  toolchain:
    description: "A rustup toolchain other than the default (msrv: 1.95.0, fuzz: the nightly); rustc +TOOLCHAIN -V names the key's toolchain"
    default: ""
  lock:
    description: The lock file the key hashes
    default: Cargo.lock
  paths:
    description: "More paths the entry holds (newline-separated; fuzz: cargo-fuzz and its registry)"
    default: ""
  registry:
    description: "false: the registry is in `paths` (the fuzz entry), not a cache of its own"
    default: "true"
  cargo-home:
    description: "Cargo's home, whose registry is cached (the Fedora image's is /opt/cargo, where mise put it)"
    default: "~/.cargo"
  commit-times:
    description: "false: no commit-times.sh and no built-from marker (a shallow checkout)"
    default: "true"
  keep-bins:
    description: "true: cargo-prune.sh keeps the local packages' binaries (a later step uses them)"
    default: "false"
outputs:
  key:
    description: The key the job saves under (cache-primary-key)
    value: ${{ steps.keys.outputs.key }}
  hit:
    description: "true: the target was restored by its exact key (only a re-run of the same commit)"
    value: ${{ steps.target.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # ---- restore
    - id: keys
      if: ${{ inputs.mode == 'restore' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        LOCK: ${{ inputs.lock }}
      run: bash .github/ci/cache-key.sh "${{ inputs.job }}" | tee -a "$GITHUB_OUTPUT"
    - id: registry
      if: ${{ inputs.mode == 'restore' && inputs.registry == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.cargo-home }}/registry/index
          ${{ inputs.cargo-home }}/registry/cache
        key: cargo-registry-${{ runner.os }}-${{ hashFiles(inputs.lock) }}
        restore-keys: cargo-registry-${{ runner.os }}-
    - id: target
      if: ${{ inputs.mode == 'restore' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.target }}
          ${{ inputs.paths }}
        key: ${{ steps.keys.outputs.key }}
        restore-keys: |
          ${{ steps.keys.outputs.restore1 }}
          ${{ steps.keys.outputs.restore2 }}
    # actions/cache logs no primary key on an exact hit, and the run's checks read the key from here; the save step
    # (a later step, maybe another action's) reads the state from the file
    - name: The cache's key and what restored
      if: ${{ inputs.mode == 'restore' }}
      shell: bash
      env:
        KEY: ${{ steps.keys.outputs.key }}
        MATCHED: ${{ steps.target.outputs.cache-matched-key }}
        HIT: ${{ steps.target.outputs.cache-hit }}
        REGISTRY_KEY: ${{ steps.registry.outputs.cache-primary-key }}
        REGISTRY_HIT: ${{ steps.registry.outputs.cache-hit }}
      run: |
        echo "cache-primary-key: $KEY"
        echo "cache-matched-key: ${MATCHED:-none}"
        mkdir -p "$RUNNER_TEMP/cargo-target"
        printf 'KEY=%s\nHIT=%s\nREGISTRY_KEY=%s\nREGISTRY_HIT=%s\n' "$KEY" "$HIT" "$REGISTRY_KEY" "$REGISTRY_HIT" > "$RUNNER_TEMP/cargo-target/${{ inputs.job }}.env"
    - name: Each tracked file at its last commit's time (cargo rebuilds only what changed since the cache)
      if: ${{ inputs.mode == 'restore' && inputs.commit-times == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash .github/ci/commit-times.sh "${{ inputs.target }}/.drgnx-built-from"
    # ---- save
    - id: state
      if: ${{ inputs.mode == 'save' }}
      shell: bash
      run: |
        f="$RUNNER_TEMP/cargo-target/${{ inputs.job }}.env"
        if [ -f "$f" ]; then
          # shellcheck disable=SC1090
          . "$f"
          printf 'key=%s\nhit=%s\nregistry-key=%s\nregistry-hit=%s\n' "$KEY" "$HIT" "$REGISTRY_KEY" "$REGISTRY_HIT" | tee -a "$GITHUB_OUTPUT"
        else
          echo "::warning::cargo-target: no restore of ${{ inputs.job }} came first: nothing saved"
          echo "key=" >> "$GITHUB_OUTPUT"
        fi
    - id: policy
      if: ${{ inputs.mode == 'save' && steps.state.outputs.key != '' }}
      uses: ./.github/actions/cache-policy
      with:
        build-outcome: ${{ inputs.build-outcome }}
        exact-hit: ${{ steps.state.outputs.hit }}
    - if: ${{ inputs.mode == 'save' && steps.state.outputs.key != '' }}
      shell: bash
      env:
        SAVE: ${{ steps.policy.outputs.save }}
        WHY: ${{ steps.policy.outputs.why }}
      run: 'echo "cargo-target ${{ inputs.job }}: save=$SAVE ($WHY)"'
    - id: prune
      if: ${{ inputs.mode == 'save' && steps.policy.outputs.save == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        STATUS: ${{ inputs.status }}
        KEEP: ${{ inputs.keep-bins == 'true' && '--keep-bins' || '' }}
      run: |
        bash .github/ci/cargo-prune.sh "${{ inputs.manifest }}" "${{ inputs.target }}" $KEEP
        # the commit it was built from, only when every step before passed: after a step that failed some outputs
        # may be older than the sources, so the commit restored stays (or none: the next run rebuilds everything)
        if [ "${{ inputs.commit-times }}" = true ] && [ "$STATUS" = success ]; then
          git -c safe.directory="$PWD" rev-parse HEAD > "${{ inputs.target }}/.drgnx-built-from"
        fi
    - if: ${{ steps.prune.outcome == 'success' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.target }}
          ${{ inputs.paths }}
        key: ${{ steps.state.outputs.key }}
    # the registry once per lock and OS, for every job: one already there (main's, for a pull request whose lock is
    # main's) is not saved again
    - if: ${{ steps.prune.outcome == 'success' && inputs.registry == 'true' && steps.state.outputs.registry-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.cargo-home }}/registry/index
          ${{ inputs.cargo-home }}/registry/cache
        key: ${{ steps.state.outputs.registry-key }}
