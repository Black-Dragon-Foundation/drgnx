# The drgnx runtime workspace (docs/develop/runtime.md).  Later tasks add crates under crates/ (a glob) and write
# `x.workspace = true`; the fuzz crate is its own workspace.
[workspace]
members = ["conformance", "crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

# Library evaluation section 17, nothing else.  Only crates a member uses enter Cargo.lock.
[workspace.dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a stored f64 (a grant's expiry, any time in an entity's data) reads back exactly; the default parser
# may land one ulp off (URDR-SCOPE-GRANT-FLAKE-1)
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1.2"
serde_path_to_error = "0.1"
serde_ignored = "0.1"
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.11"              # the socket name is sha1(data-dir)[0:8] (design 3.1); one addition to section 17
subtle = "2.6"
getrandom = "0.4"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# hrafn's structural chunker; the grammars arrive with the languages that use them
tree-sitter = "0.25"   # 0.26 and 0.27 need Rust 1.90; the workspace MSRV is 1.88
tree-sitter-elisp = "1.7"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-bash = "0.25"
notify = "8"
rustix = { version = "1.1", features = ["fs", "process", "net", "thread"] }
libc = "0.2"
hyper = { version = "1.12", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client-legacy", "client-proxy"] }
http-body-util = "0.1"
# `rustls-platform-verifier` is turned on by bifrost's default feature `platform-verifier`, so an Android build can drop it
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "logging"] }
rustls = { version = ">=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# hermod's ACP types; the two unstable features carry a turn's token usage and session/fork (both in 1.12.0)
agent-client-protocol-schema = { version = "=1.12.0", features = ["unstable_end_turn_token_usage", "unstable_session_fork"] }
pulldown-cmark = { version = "0.13", default-features = false }  # saga's Markdown, with offsets (agent system part 1, Calls made 12)
secrecy = "0.10"
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json"] }
tracing-appender = "0.2"
lexopt = "0.3"
# the hub's runner transport drives the user's own ssh (runners design 6.4; one addition to section 17): native mux
# only, never the process mux
openssh = { version = "0.11.6", default-features = false, features = ["native-mux"] }
landlock = "0.4"
seccompiler = "=0.5.0"
insta = { version = "1.49", features = ["json"] }
proptest = "1.12"
tempfile = "3"
rmcp = { version = "3.6", default-features = false }   # dev only (mimir's interop test); a member names its features
# hrafn-embed, pure Rust: a tokeniser with no C regex engine (default-features alone does not compile), and the model file
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
safetensors = "0.8"
half = "2"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
# hrafn-embed's GPU path. wgpu breaks its API about every 3 months: pinned, moved on purpose
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "metal", "wgsl"] }
pollster = "0.4"
gemm = "=0.19.0"
rayon = "1"

[profile.release]
strip = true
lto = "thin"
panic = "unwind"

# `cargo test` is a debug build, and a real-model test would crawl in one
[profile.dev.package.hrafn-embed]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
