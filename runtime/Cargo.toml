# The drgnx runtime workspace (docs/develop/runtime.md).  Later tasks add crates under crates/ (a glob) and write
# `x.workspace = true`; the fuzz crate is its own workspace.
[workspace]
members = ["conformance", "crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

# Library evaluation section 17, nothing else.  Only crates a member uses enter Cargo.lock.
[workspace.dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
serde_path_to_error = "0.1"
serde_ignored = "0.1"
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.11"              # the socket name is sha1(data-dir)[0:8] (design 3.1); one addition to section 17
subtle = "2.6"
getrandom = "0.4"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process", "net", "thread"] }
libc = "0.2"
hyper = { version = "1.12", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client-legacy", "client-proxy"] }
http-body-util = "0.1"
# `rustls-platform-verifier` is turned on by bifrost's default feature `platform-verifier`, so an Android build can drop it
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "logging"] }
rustls = { version = ">=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
agent-client-protocol-schema = "=1.12.0"
secrecy = "0.10"
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json"] }
tracing-appender = "0.2"
lexopt = "0.3"
landlock = "0.4"
seccompiler = "=0.5.0"
insta = { version = "1.49", features = ["json"] }
proptest = "1.12"
tempfile = "3"
rmcp = { version = "3.6", default-features = false }   # dev only (mimir's interop test); a member names its features

[profile.release]
strip = true
lto = "thin"
panic = "unwind"
