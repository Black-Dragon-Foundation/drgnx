# cargo-fuzz targets for the parsers of phase 1 (docs/develop/runtime.md, "Fuzzing").  Its own workspace: the product
# workspace excludes it, and it builds on the pinned nightly only.
[package]
name = "drgnx-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
serde_json = "1"
runstav = { path = "../crates/runstav" }
drgnx-ratatoskr = { path = "../crates/drgnx-ratatoskr" }
gleipnir = { path = "../crates/gleipnir", features = ["fuzzing"] }
mimir = { path = "../crates/mimir" }
# no platform verifier: the targets make no TLS connection, and it is the one optional piece with a system dependency
bifrost = { path = "../crates/bifrost", default-features = false }
http = "1"
norn = { path = "../crates/norn" }
urdr = { path = "../crates/urdr" }
tokio = { version = "1.54", features = ["rt", "io-util", "time"] }

[workspace]

[[bin]]
name = "line_codec"
path = "fuzz_targets/line_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_prelude"
path = "fuzz_targets/request_prelude.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hello"
path = "fuzz_targets/hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "connect_head"
path = "fuzz_targets/connect_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_target"
path = "fuzz_targets/host_target.rs"
test = false
doc = false
bench = false

