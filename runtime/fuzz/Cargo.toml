# cargo-fuzz targets for the parsers of phase 1 (docs/develop/runtime.md, "Fuzzing").  Its own workspace: the product
# workspace excludes it, and it builds on the pinned nightly only.
[package]
name = "drgnx-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
serde_json = "1"
runstav = { path = "../crates/runstav" }
drgnx-ratatoskr = { path = "../crates/drgnx-ratatoskr" }
gleipnir = { path = "../crates/gleipnir", features = ["fuzzing"] }

[workspace]

[[bin]]
name = "line_codec"
path = "fuzz_targets/line_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_prelude"
path = "fuzz_targets/request_prelude.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hello"
path = "fuzz_targets/hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "connect_head"
path = "fuzz_targets/connect_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_target"
path = "fuzz_targets/host_target.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sbpl_quote"
path = "fuzz_targets/sbpl_quote.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bwrap_version"
path = "fuzz_targets/bwrap_version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inner_spec"
path = "fuzz_targets/inner_spec.rs"
test = false
doc = false
bench = false
