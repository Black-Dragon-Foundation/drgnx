[package]
name = "runstav"
description = "The hub protocol's contract: wire types, strict lines, typed decode, HMAC proofs, the socket paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
serde_path_to_error.workspace = true
serde_ignored.workspace = true
hmac.workspace = true
sha2.workspace = true
sha1.workspace = true
subtle.workspace = true
getrandom.workspace = true
rustix.workspace = true
secrecy.workspace = true
zeroize.workspace = true
# the row and patch types of hub-built views (`view-patch`), re-exported as `methods::view`
drgnx-rows = { path = "../drgnx-rows", version = "0.1.0", features = ["schema"] }

[dev-dependencies]
skuld = { path = "../skuld", version = "0.1.0" }
proptest.workspace = true
tempfile.workspace = true
