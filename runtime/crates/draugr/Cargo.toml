[package]
name = "draugr"
description = "Ratatoskr's process control: explicit environments, own process groups, one exit, the orphan reaper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
eitri = { path = "../eitri", version = "0.1.0" }
tokio.workspace = true
libc.workspace = true
drgnx-clock = { path = "../drgnx-clock", version = "0.1.0" }  # the grace and the probes wait on the installed clock
drgnx-exe = { path = "../drgnx-exe", version = "0.1.0" }  # every spawn goes through its lock where unshare is refused (ETXTBSY)

[dev-dependencies]
drgnx-clock = { path = "../drgnx-clock", version = "0.1.0", features = ["test-hooks"] }
skuld = { path = "../skuld", version = "0.1.0" }
tempfile.workspace = true
