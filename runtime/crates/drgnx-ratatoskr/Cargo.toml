[package]
name = "drgnx-ratatoskr"
description = "Ratatoskr, drgnx's agent runtime: the hub protocol's server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "drgnx_ratatoskr"
path = "src/lib.rs"

[[bin]]
name = "ratatoskr"
path = "src/main.rs"

[features]
# Every test-only surface (the `__test_flood` method, `--agent-socket`, `sandbox run`): off in the binary install.sh
# builds. The migration's seams too (`DRGNX_TEST_MIGRATE7_FAIL`, `_PAUSE`).
test-hooks = ["gleipnir/test-hooks", "norn/test-hooks", "urdr/test-hooks", "bifrost/test-hooks"]
# The fuzz crate's entry into the session reducer (`agents::session::fuzz_apply`); off everywhere else.
fuzzing = []
# Builds the fleet rows (tests/fleet_link.rs, tests/fleet_runners.rs), which run only inside a fake-runner fleet's
# harness container (test/runners/); a plain `cargo test --ignored` leaves them out.
fleet = []

# the transport's rows run in the fake fleet's harness against real sshd
[[test]]
name = "fleet_link"
required-features = ["fleet"]

# the link session's, the queue's and the health check's rows, against a real `sleipnir serve` in a fake runner
[[test]]
name = "fleet_runners"
required-features = ["fleet"]

# the registry's rows: a host becomes a runner, its refusals, its removal
[[test]]
name = "fleet_registry"
required-features = ["fleet"]

# sync's rows: job trust from what the origin has, the shared runner's origin fetch and overlay
[[test]]
name = "fleet_sync"
required-features = ["fleet"]

[[test]]
name = "fleet_keys"
required-features = ["fleet"]

# the link drills (test/runners/drills.sh): the link broken mid-job, the hub restarted, the runner's guards
[[test]]
name = "fleet_drills"
required-features = ["fleet"]

# cloud machines' SSH: a mock cloud's machine (a fake runner) reached by certificate, its pinned host keys
[[test]]
name = "fleet_cloud"
required-features = ["fleet", "test-hooks"]

[dependencies]
runstav = { path = "../runstav", version = "0.1.0" }
# hub-built view rows (view): the row and patch types and their diff
drgnx-rows = { path = "../drgnx-rows", version = "0.1.0" }
getrandom.workspace = true   # the hub's instance id on view patches (view)
draugr = { path = "../draugr", version = "0.1.0" }
drgnx-px = { path = "../drgnx-px", version = "0.1.0" }  # the networked container job's relay sidecar
urdr = { path = "../urdr", version = "0.1.0" }
saga = { path = "../saga", version = "0.1.0" }
gleipnir = { path = "../gleipnir", version = "0.1.0" }
eitri = { path = "../eitri", version = "0.1.0" }
mimir = { path = "../mimir", version = "0.1.0" }
norn = { path = "../norn", version = "0.1.0" }
brokkr = { path = "../brokkr", version = "0.1.0" }  # plugin manifests, approval hashes and the install scan (plugins)
hermod = { path = "../hermod", version = "0.1.0" }  # the ACP client of every session (agents::session)
bifrost = { path = "../bifrost", version = "0.1.0" }
sleipnir = { path = "../sleipnir", version = "0.1.0", default-features = false, features = ["linux", "sync"] }  # the shared podman argv; inputs frozen at submit
vegvisir = { path = "../vegvisir", version = "0.1.0" }  # the Work map's model and layout (work::map)
pulldown-cmark.workspace = true  # agent messages as Markdown blocks (agents::markdown)
forseti = { path = "../forseti", version = "0.1.0" }  # the scheduler core: the queue's order, placement and admission
hrafn-embed = { path = "../hrafn-embed", version = "0.1.0" }  # the model table, the cache's checks, the embed worker's engine
hrafn = { path = "../hrafn", version = "0.1.0" }  # each project's code store, tier 1 and the store side of tier 2
verdandi = { path = "../verdandi", version = "0.1.0" }  # the edit history's store (history::)
# history::capture's disk diffs (a text onto a document), the hooks' diffs of a write, and the pair door's edit lines
# from a whole-file diff, three-way projection and whole-file writes as line hunks (pair::writes); 3.x is not in the
# lock file yet
similar = "2.7"
heimdall = { path = "../heimdall", version = "0.1.0" }  # the CDP broker's routing and codecs (browser::{host,broker})
fastwebsockets.workspace = true  # the CDP broker's websocket (browser::broker)
hyper.workspace = true           # the CDP broker's HTTP/1.1 upgrade (already in the tree through bifrost)
hyper-util.workspace = true
subtle.workspace = true          # the CDP secret, compared in constant time
huginn = { path = "../huginn", version = "0.1.0", features = ["serde"] }  # settings.el and runtime-defaults.el, as data
serde_path_to_error.workspace = true  # where in a setting's value a mistake is
tokio = { workspace = true, features = ["io-std"] }  # mcp-bridge's stdio (a feature, no new crate)
tokio-util.workspace = true
bytes = "1"              # the read buffer the line codec decodes from (already in the tree through tokio)
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
lexopt.workspace = true
sha2.workspace = true  # the merge gate's diff hashes
zip.workspace = true  # `browser install` unpacks the pinned archive
http-body-util.workspace = true  # the download's body
http = "1"                # the download's request (already in the tree through hyper)
# a plugin's HTTPS to the address the hub judged (plugins::hub_io); all three already in the tree through bifrost
rustls.workspace = true
rustls-platform-verifier.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
zeroize.workspace = true  # the line that carries provider keys to the backend is wiped once written
secrecy.workspace = true  # job keys held in memory (runners::keys; already in the tree through bifrost and sleipnir)
# cloud runners over plain HTTPS (runners::cloud): EC2 Query requests signed. `sign-http` alone does not compile in
# 1.6.4 (it names `http` types); `http1` is http 1, already in the tree, and nothing brings http 0.2. Its hmac 0.13 and
# sha2 0.11 are the workspace's
aws-sigv4 = { version = "1.6.4", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3"  # the credentials aws-sigv4 signs with (in its tree)
quick-xml = "0.42"            # EC2's XML answers
# the cloud SSH CA's and each redial's ed25519 keys (runners::cloud::ca; already in the tree through rustls): the
# runners plan's fallback, since ssh-key 0.6 would add sha2 0.10 beside the workspace's 0.11. `alloc` for RS256: a GCP
# service-account key signs its token request (runners::cloud::gcp)
ring = { version = "0.17", default-features = false, features = ["alloc"] }

# runners: the user's OpenSSH through the crate's native mux (no Android: the transport is Unix desktops only)
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
openssh.workspace = true

[dev-dependencies]
# `test-hooks`: `urdr::graph::Tx::for_test` for the manager's unit tests (a `-p drgnx-ratatoskr` test build alone has no
# other crate turning it on)
urdr = { path = "../urdr", version = "0.1.0", features = ["test-hooks"] }
tokio = { workspace = true, features = ["test-util"] }  # paused time: the pacer's tests take their instants from it
skuld = { path = "../skuld", version = "0.1.0" }  # waits in tests; every order of a pure core (the connection's, a session's turn)
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }  # the MCP client of tests/search_query.rs (as mimir's interop test)
tempfile.workspace = true
proptest.workspace = true  # the shell-command parser never panics and is deterministic (work::shell_read)
# plugins::hub_io's tests: the fixture plugins, and an in-test TLS server with certificates made at run time
brokkr = { path = "../brokkr", version = "0.1.0", features = ["test-support"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
