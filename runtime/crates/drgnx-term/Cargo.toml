[package]
name = "drgnx-term"
description = "drgnx's terminal worker: one PTY and one libghostty-vt terminal per process, its screen sent as drgnx-rows patches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "drgnx_term"
path = "src/lib.rs"

[[bin]]
name = "drgnx-term"
path = "src/main.rs"

[features]
# The engine. Off (Android until its link row passes), the crate builds its pure parts (the frame clock, the row keys,
# the wire) and the binary refuses to start (docs/develop/terminal.md, "Building the engine").
default = ["ghostty"]
ghostty = ["ghostty-vt-sys/ghostty"]

[dependencies]
ghostty-vt-sys = { path = "../ghostty-vt-sys", version = "0.1.0", default-features = false }
drgnx-rows = { path = "../drgnx-rows", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = ["pty", "termios", "event", "process", "fs", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
# images (docs/develop/terminal.md, "Images"): kitty PNG decode and the canvases, sixel, iTerm2
png = "0.18"
icy_sixel = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
base64 = "0.23"

[dev-dependencies]
skuld = { path = "../skuld", version = "0.1.0" }  # bounded waits in the tests
tempfile.workspace = true
