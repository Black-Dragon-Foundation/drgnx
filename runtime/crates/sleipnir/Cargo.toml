[package]
name = "sleipnir"
description = "The runner: the machine probe and executor on Linux, the shared podman argv, the reservation files, sync and the wire protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["runner"]
# the wire protocol: pure
proto = []
# input capture, the hardened git and slots: blocking, no tokio
sync = ["dep:forseti", "dep:sha2", "dep:rustix", "dep:secrecy"]
# the probe, the reservation files and the executor: blocking, std, rustix and serde only, no tokio
linux = ["dep:forseti", "dep:serde_json", "dep:rustix", "dep:libc"]
# the binary's modes
runner = ["proto", "sync", "linux"]
# test-only entry points; compiled away otherwise
test-hooks = []

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }
forseti = { path = "../forseti", version = "0.1.0", optional = true }
rustix = { workspace = true, features = ["event"], optional = true }
libc = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

# job-exec, the mode a job's unit runs; the runner's other modes join it
[[bin]]
name = "sleipnir"
path = "src/main.rs"
required-features = ["linux"]

# run inside a fake runner (tests/runner_host.rs)
[[test]]
name = "runner_host"
required-features = ["linux"]

# sync's rows run inside a fake runner too (the real binary's git-receive and credential-helper modes)
[[test]]
name = "runner_host_sync"
required-features = ["linux", "sync", "test-hooks"]

# sync's rows over real SSH, from the fleet's harness to a fake runner (the binary's test-hooks bundle mode)
[[test]]
name = "fleet_sync"
required-features = ["sync"]

[dev-dependencies]
skuld = { path = "../skuld", version = "0.1.0" }
tempfile.workspace = true
