[package]
name = "vor"
description = "A Debug Adapter Protocol client on tokio: framing, correlation, events, reverse requests, generated types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The mock adapter (`vor::mock` and the `vor-mock` binary): a script of expected requests, for the hub's tests and ERT.
mock = ["tokio/io-std"]

[[bin]]
name = "vor-mock"
path = "src/bin/vor-mock.rs"
required-features = ["mock"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
