[package]
name = "urdr"
description = "A small SQLite store: one owning thread, read-only connections that never checkpoint, migrations as data; the generic graph store (graph)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Test-only surfaces (`graph::tx::Tx::for_test`, the writer's hooks): off in the binary install.sh builds.
test-hooks = []

[dependencies]
# `hooks`: the progress handler (walk and graph/sql deadlines) and the authorizer (graph/sql)
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
