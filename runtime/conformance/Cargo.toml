[package]
name = "domr"
description = "The hub protocol's conformance harness: scenarios as data, run against a hub binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "domr"
path = "src/main.rs"

# std-only harness (threads, blocking UnixStreams): no async runtime here.
[dependencies]
tempfile.workspace = true
rusqlite.workspace = true
hmac.workspace = true
sha2.workspace = true
runstav = { path = "../crates/runstav", version = "0.1.0" }   # the paths rule (socket, data dir) the hub itself uses
getrandom.workspace = true
serde_json.workspace = true
libc.workspace = true
rustls.workspace = true      # ratatoskr-mock llm --tls (already in the lock file through bifrost)
# ratatoskr-mock llm --tls: the CA and the leaf are made at start (no key file is ever committed or written). Already
# in the lock file as bifrost's dev-dependency, ring only (no aws-lc).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
