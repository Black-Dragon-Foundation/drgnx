# Smidja's rules (W1-W10, design section 4.5) as properties over random intent sequences, for a given time.
# Its own workspace, a sibling of the crate as sja-fuzz is.  Stable Rust, no fuzzing engine: a seeded generator
# (smidja::sim) drives every intent with both origins, 1-3 OS windows, widths 400-3840 and TTY 80x24 / 120x40, and
# checks every rule after every step.  `cargo run --release -- --seconds N`; a broken rule prints its seed and exits 1.
[package]
name = "smidja-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
smidja = { path = "../smidja" }

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "intents"
path = "fuzz_targets/intents.rs"
test = false
doc = false
bench = false
