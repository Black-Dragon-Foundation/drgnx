[package]
name = "skald"
description = "The language pack format: pack.eld read as data, its schema, and the rules a fetched pack must meet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false  # tests/main.rs is the one binary of the files that need no process of their own; the rest are [[test]]s below

[dependencies]
draugr.workspace = true
eitri.workspace = true
stig.workspace = true
tracing.workspace = true
huginn = { path = "../../core/huginn", version = "0.1.0", features = ["serde"] }
cc.workspace = true
libloading.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
tree-sitter.workspace = true
tree-sitter-language.workspace = true

[build-dependencies]
annall.workspace = true
villa.workspace = true

[dev-dependencies]
tempfile.workspace = true


# every tests/*.rs not named below, as modules of one binary: `cargo test -p skald --test it <file>::`
[[test]]
name = "it"
path = "tests/main.rs"

# the pack registry is process-wide (one test installs entries)
[[test]]
name = "registry"
