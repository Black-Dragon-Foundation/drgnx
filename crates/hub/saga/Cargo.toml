[package]
name = "saga"
description = "The org folder's record formats (plans, ledgers, DEFERRED, the build board, board.org): parsed, turned into graph operations, rendered back byte-exact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false  # tests/main.rs is the one binary of every tests/*.rs

[dependencies]
pulldown-cmark.workspace = true
villa.workspace = true

[dev-dependencies]
proptest.workspace = true
stund.workspace = true


# every tests/*.rs not named below, as modules of one binary: `cargo test -p saga --test it <file>::`
[[test]]
name = "it"
path = "tests/main.rs"

[lints]
workspace = true
