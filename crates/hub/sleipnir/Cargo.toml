[package]
name = "sleipnir"
description = "The runner: the machine probe and executor on Linux, the shared podman argv, the reservation files, sync and the wire protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["runner"]
# the wire protocol: pure (serde, and `secrecy` for a key's value)
proto = ["dep:forseti", "dep:serde_json", "dep:secrecy", "dep:zeroize"]
# input capture, the hardened git and slots: blocking, no tokio
sync = ["dep:forseti", "dep:sha2", "dep:sha1", "dep:similar", "dep:rustix", "dep:secrecy", "std-owners"]
# the probe, the reservation files and the executor: blocking, std, rustix and serde only, no tokio; the probe's
# facts are the protocol's
linux = ["proto", "dep:forseti", "dep:serde_json", "dep:rustix", "dep:libc", "std-owners"]
# the standards' owner crates (errors, files, processes, time, threads, output, paths): every blocking module reaches
# them; the wire protocol and the key line stay pure
std-owners = ["dep:villa", "dep:eitri", "dep:draugr", "dep:stund", "dep:saman", "dep:annall", "dep:stig", "dep:tracing"]
# the binary's modes; the job helper's proxy is Gleipnir's, on tokio
runner = ["proto", "sync", "linux", "dep:gleipnir", "dep:tokio", "dep:ferja", "dep:hlaup"]
# test-only entry points; compiled away otherwise
test-hooks = []

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }
forseti = { path = "../forseti", version = "0.1.0", optional = true }
rustix = { workspace = true, features = ["event"], optional = true }
libc = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }  # git's blob ids in a returned patch's `index` lines
similar = { version = "2.7", optional = true }  # a returned patch's hunks (the hub already has it)
secrecy = { workspace = true, features = ["serde"], optional = true }
zeroize = { workspace = true, optional = true }
gleipnir = { path = "../gleipnir", version = "0.1.0", optional = true }
ferja = { path = "../ferja", version = "0.1.0", optional = true }  # the job helper's relay sidecar
hlaup = { path = "../hlaup", version = "0.1.0", optional = true }  # a job's own drgnx-key copy, never busy (ETXTBSY)
tokio = { workspace = true, features = ["io-std"], optional = true }  # the relay's log goes to stderr
villa = { workspace = true, optional = true }
eitri = { workspace = true, optional = true }
draugr = { workspace = true, optional = true }
stund = { workspace = true, optional = true }
saman = { workspace = true, optional = true }
annall = { workspace = true, optional = true }
stig = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# job-exec, the mode a job's unit runs; the runner's other modes join it
[[bin]]
name = "sleipnir"
path = "src/main.rs"
required-features = ["linux"]

# what a keyed job runs in front of its command: villa, annall and draugr only (no tokio), so its static build starts
# in any image
[[bin]]
name = "drgnx-key"
path = "src/bin/drgnx-key.rs"
required-features = ["std-owners"]

# `drgnx-key` run on its own against a stand-in helper
[[test]]
name = "key_bin"
required-features = ["std-owners"]

# the job helper's rows inside a fake runner: its keys, its socket, its disk watch, drgnx-key in a container
[[test]]
name = "runner_host_helper"
required-features = ["runner", "test-hooks"]

# the static bundle in an image of another libc (CI's container lane, with the bundle built)
[[test]]
name = "bundle_host"
required-features = ["linux"]

# run inside a fake runner (tests/runner_host.rs)
[[test]]
name = "runner_host"
required-features = ["linux"]

# the hub's side of `serve`, run in the fake fleet's harness (tests/fleet_serve.rs); test-hooks so the runner's
# machine is the rows' figures, not the host's
[[test]]
name = "fleet_serve"
required-features = ["runner", "test-hooks"]

# sync's rows run inside a fake runner too (the real binary's git-receive and credential-helper modes)
[[test]]
name = "runner_host_sync"
required-features = ["linux", "sync", "test-hooks"]

# sync's rows over real SSH, from the fleet's harness to a fake runner (the binary's test-hooks bundle mode)
[[test]]
name = "fleet_sync"
required-features = ["sync"]

[dev-dependencies]
stund = { workspace = true, features = ["test-hooks"] }   # the loop's timers move when a test says
hlaup = { path = "../hlaup", version = "0.1.0" }  # stand-in scripts written and run, never busy (ETXTBSY)
skuld = { path = "../skuld", version = "0.1.0" }
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
