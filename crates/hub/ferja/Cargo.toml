[package]
name = "ferja"
description = "A networked container job's relay sidecar: the job's TCP connections as framed streams over stdio to the owner's proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# test-only flags of the binary (`--test-log-frames`, `--test-panic-on-beat`); never in a shipped build
test-hooks = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
libc.workspace = true
gleipnir = { path = "../gleipnir", version = "0.1.0" }
sha2.workspace = true
zeroize.workspace = true
villa.workspace = true
saman.workspace = true
stund.workspace = true
draugr.workspace = true
tracing.workspace = true

[dev-dependencies]
hlaup = { path = "../hlaup", version = "0.1.0" }  # stand-in scripts written and run, never busy (ETXTBSY)
eitri.workspace = true
stig.workspace = true
skuld = { path = "../skuld", version = "0.1.0" }
stund = { workspace = true, features = ["test-hooks"] }  # `stop`'s deadline moves when a test says
tempfile.workspace = true


[lints]
workspace = true
