[package]
name = "vordr"
description = "The orchestration gates' pure core: a job's rows and failure classes, the red-first decision, merge notes and the merge batch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
forseti = { path = "../forseti", version = "0.1.0" }  # the key's `Canon` and the selector dialects
toml_edit.workspace = true  # `.drgnx/jobs.toml`, read with spans for `file:line` errors
serde.workspace = true
serde_json.workspace = true
villa.workspace = true

[dev-dependencies]
skuld = { path = "../skuld", version = "0.1.0" }  # every order of the reruns' results

[lints]
workspace = true
