# The drgnx workspace: one Cargo workspace for the whole editor (docs/develop/runtime.md). Crates live in groups:
# crates/core (text and models), crates/ui (drawing, shell, views, kit), crates/hub (the hub and its services),
# crates/ext (the extension API and hosts), crates/std (the standards); app/ is the editor binary. Members write
# `x.workspace = true`. The fuzz crates and the plugin fixtures and template are their own workspaces.
[workspace]
members = ["app", "crates/core/*", "crates/hub/*", "crates/std/*", "crates/ui/*", "xtask"]
exclude = [
    "crates/hub/hrista",
    "crates/hub/plugins",
    "crates/hub/protocol",
    "crates/ui/glitnir-fuzz",
    "crates/ui/sja-fuzz",
    "crates/ui/smidja-fuzz",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# Every crate is GPL-3.0-or-later for now (LICENSE-GPL). The plan (README.md, "Licences"): the editor and the hub
# GPL-3.0-or-later, hosted server parts AGPL-3.0-or-later, libraries and the extension SDK Apache-2.0, each library moved
# only after an audit shows it is all our own code.
license = "GPL-3.0-or-later"

# Library evaluation section 17, nothing else.  Only crates a member uses enter Cargo.lock.
[workspace.dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
jsonc-parser = { version = "0.34", default-features = false, features = ["serde"] }  # launch.json / tasks.json (JSONC)
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a stored f64 (a grant's expiry, any time in an entity's data) reads back exactly; the default parser
# may land one ulp off (URDR-SCOPE-GRANT-FLAKE-1). raw_value: the CDP broker (heimdall) keeps params as the bytes it got
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
schemars = "1.2"
serde_path_to_error = "0.1"
# the hook rules' `command` (norn::hooks): linear time, compiled under a size limit; already in the lock as a
# transitive dependency, so nothing new is downloaded. Never fancy-regex for a user's pattern
regex = "1.13"
# the minimap density scan's line search (already in the lock through regex)
memchr = "2.8"
serde_ignored = "0.1"
hmac = "0.13"
sha2 = "0.11"
# Hrafn's `.drgnx/search.toml` (read as data; already in the lock through proc-macro-crate)
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
sha1 = "0.11"             # the socket name is sha1(data-dir)[0:8] (design 3.1); one addition to section 17
subtle = "2.6"
getrandom = "0.4"
# Jupyter kernels (language packs Task 11b): the pure-Rust ZeroMQ client; only the features used (no async-std, no async-dispatcher)
zeromq = { version = "0.7", default-features = false, features = ["tokio-runtime", "tcp-transport", "ipc-transport"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
# hrafn's structural chunker; the grammars arrive with the languages that use them
tree-sitter = "0.27"   # 0.27 for ast-grep-core (the Search view's Pattern); needs Rust 1.90, under the MSRV (1.95)
# the Search view's structural matcher behind `hrafn::structural` (pattern by example, `$A` / `$$$A`, rewrite templates):
# core only (no YAML rules), pinned exactly, moved on purpose (a 0.x API); MIT, MSRV 1.90
ast-grep-core = "=0.51.1"   # its one feature, `tree-sitter`, is the parser it matches on
# skald's pack job builds a pinned grammar's parser.c at runtime and loads it (language packs design §10); all three are
# already in the lock through tree-sitter. libloading 0.8 (the lock's), not 0.9
cc = "1"
libloading = "0.8"
tree-sitter-language = "0.1"
tree-sitter-elisp = "1.7"
notify = "8"
# Hrafn's read-only door of agent-touched trees: pinned exactly, read-only features only; no filter,
# hook or fsmonitor is ever run, and submodules are never opened. MIT OR Apache-2.0, MSRV 1.88
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "index", "dirwalk"] }
inotify = { version = "0.11", default-features = false }
# verdandi's documents (the edit history; agent system part 4's spike chose it): public API only, pinned, moved on purpose
loro = { version = "=1.17.1", default-features = false }
rustix = { version = "1.1", features = ["fs", "process", "net", "thread"] }
libc = "0.2"
hyper = { version = "1.12", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client-legacy", "client-proxy"] }
http-body-util = "0.1"
# the CDP broker's websocket server on cdp.sock, on the hyper above; `unstable-split` reads and writes it from two tasks
fastwebsockets = { version = "0.10", features = ["upgrade", "unstable-split"] }
# `drgnx browser install` unpacks the pinned Chrome for Testing archive; read only, deflate only
zip = { version = "9.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Debug: Install Adapter unpacks js-debug's pinned tar.gz (the same zlib-rs backend as zip's deflate)
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }
# `rustls-platform-verifier` is turned on by bifrost's default feature `platform-verifier`, so an Android build can drop it
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "logging"] }
rustls = { version = ">=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# hermod's ACP types; the unstable features carry a turn's token usage, session/fork, ACP v2 (negotiated per connection, behind a profile setting), subagents and plan operations (1.19.0: v2 has the background list and tool_call/cancel, terminal/cancel)
agent-client-protocol-schema = { version = "=1.19.0", features = ["unstable_end_turn_token_usage", "unstable_session_fork", "unstable_protocol_v2", "unstable_subagents", "unstable_plan_operations"] }
pulldown-cmark = { version = "0.13", default-features = false }  # saga's Markdown, with offsets (agent system part 1, Calls made 12)
secrecy = "0.10"
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json"] }
tracing-appender = "0.2"
lexopt = "0.3"
# the hub's runner transport drives the user's own ssh (runners design 6.4; one addition to section 17): native mux
# only, never the process mux
openssh = { version = "0.11.6", default-features = false, features = ["native-mux"] }
landlock = "0.4"
seccompiler = "=0.5.0"
insta = { version = "1.49", features = ["json"] }
proptest = "1.12"
tempfile = "3"
rmcp = { version = "3.9", default-features = false }   # dev only (mimir's interop test); a member names its features
# rodd' fitter (render offload, Call 1): the advances of the font file Emacs names, unshaped and unhinted; TTC
# and variable fonts. 0.x breaks often: pinned, moved on purpose. skrifa's own read-fonts requirement is this one
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }
read-fonts = { version = "=0.46.0", default-features = false, features = ["std"] }
# the terminal fitter's widths (rodd), adjusted by the editor's char-width-table; already in the lock
unicode-width = "0.2"
unicode-segmentation = "1.13"
# hrafn-embed, pure Rust: a tokeniser with no C regex engine (default-features alone does not compile), and the model file
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
safetensors = "0.8"
half = "2"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
# hrafn-embed's GPU path. wgpu breaks its API about every 3 months: pinned, moved on purpose
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "metal", "wgsl"] }
pollster = "0.4"
# f32 matmuls only: no `f16` feature, whose gemm-f16 has aarch64 asm that needs FEAT_FP16 (fullfp16), which baseline
# aarch64 (Linux arm64, Android) doesn't have; the CPU path runs on baseline NEON there
gemm = { version = "=0.19.0", default-features = false, features = ["std", "rayon"] }
rayon = "1"
# brokkr's plugin engine: the 48 LTS (rustc 1.95, supported to 2028-08-20), only these features; no `wat`, `cache`,
# `gc`, `threads`, pooling allocator, Winch or WASI p1/p3/http. wasmtime-wasi-io links wasi:io on its own, so brokkr
# links each WASI interface it provides one by one (docs/develop/plugins.md, "What a plugin can reach")
wasmtime = { version = "=48.0.10", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "std"] }
wasmtime-wasi = { version = "=48.0.10", default-features = false, features = ["p2"] }
wasmtime-wasi-io = { version = "=48.0.10", default-features = false, features = ["std"] }
bytes = "1"
# brokkr's tests only: component text for what no toolchain emits on purpose (a disabled proposal, many handles)
wat = "=1.263.0"

[profile.release]
strip = true
lto = "thin"
panic = "unwind"

# Test builds (cargo test is a dev build): the dependencies carry no debug info (a backtrace through them names no
# line; the workspace's own crates keep whatever `debug` the profile sets, `line-tables-only` in CI and under the
# build wrapper, so a panic in workspace code still prints file:line), and the debug info of what is built is kept in
# `.dwo` files beside the objects instead of being linked into each binary (every test binary links a big lib). The
# macOS jobs' cargo-config override of the same table (`line-tables-only`, docs/develop/ci.md) takes precedence there
[profile.dev]
split-debuginfo = "unpacked"
[profile.dev.package."*"]
debug = false

# `cargo test` is a debug build, and a real-model test would crawl in one
[profile.dev.package.hrafn-embed]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
# the edit history's documents: its property test makes some hundred thousand records
[profile.dev.package.loro]
opt-level = 3
[profile.dev.package.loro-internal]
opt-level = 3
[profile.dev.package.loro-common]
opt-level = 3
[profile.dev.package.loro-rle]
opt-level = 3
[profile.dev.package.generic-btree]
opt-level = 3
